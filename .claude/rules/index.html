: 0, "titulo": "1. Sincronizar", "tipo": "Obrigatória", "texto": "Trazer a `main` antes de ler qualquer coisa: `git fetch --all --prune` + `git pull --rebase origin\nmain` (comandos e proibições: `git-quick.md`)."}, {"arquivo": "essentials.md", "tituloArquivo": "⚡ Essentials — Checklist de início de sessão", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Checklist de início: sincronizar, o que ler e em que ordem", "ordem": 0, "titulo": "2. Ler, nesta ordem", "tipo": "Obrigatória", "texto": "| Arquivo | Para quê |\n|---------|----------|\n| `CLAUDE.md` → `AGENTS.md` | Regras do projeto (precedência máxima) |\n| `tasks/STATUS.md` | Quadro: frentes, tarefas e reservas (`tasks/quadro.md`) |\n| Etapa da tarefa da sua frente | Próximo passo — retomar de onde parou (`tasks/ciclo-da-task.md`) |\n| `tasks/RECADOS.md` | Recados de outras frentes para você ou `todas` |\n| `database/SEEDS-APLICADOS.md` | Seeds em dia antes de tarefa nova (`seeds.md`) |\n| `docs/` e `bugs/` | Orientação do que vai editar (`docs-antes-de-editar.md`) |"}, {"arquivo": "essentials.md", "tituloArquivo": "⚡ Essentials — Checklist de início de sessão", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Checklist de início: sincronizar, o que ler e em que ordem", "ordem": 0, "titulo": "3. Checklist", "tipo": "Fluxo", "texto": "```\n☐ Trouxe a main (fetch + pull --rebase)?\n☐ Li o STATUS.md, a etapa da minha frente e os recados?\n☐ Seeds em dia (ou exceção de seeds.md)?\n☐ Li a orientação em docs/ do que vou mexer?\n☐ Sei se a tarefa é pequena ou grande (tasks/ciclo-da-task.md)?\n```\n\n---\n\n**Data e hora:** sempre de Brasília. No Windows local, `date` ou `Get-Date` (o relógio já está em\nBrasília) — `TZ=America/Sao_Paulo date` no Git Bash sai em UTC (3 h a mais). Na nuvem:\n`TZ=America/Sao_Paulo date`."}, {"arquivo": "git-quick.md", "tituloArquivo": "🔀 Git Quick — Commit e push", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Tudo na `main`; quando commitar; commit + push; Git × site; proibições", "ordem": 1, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Único lugar das regras de git do projeto. Vale para **local e nuvem** e para todas as IAs."}, {"arquivo": "git-quick.md", "tituloArquivo": "🔀 Git Quick — Commit e push", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Tudo na `main`; quando commitar; commit + push; Git × site; proibições", "ordem": 1, "titulo": "Tudo na `main`", "tipo": "Obrigatória", "texto": "- Trabalho, quadro e regras vão direto para a **`main`** — também nas sessões de nuvem, mesmo que\n  a ferramenta indique outra branch. ⛔ Sem branches paralelas, sem `git worktree`, sem PR para\n  entregar tarefa.\n- Push para a `main` recusado por **permissão** → parar e avisar o usuário; não publicar em outra\n  branch como alternativa."}, {"arquivo": "git-quick.md", "tituloArquivo": "🔀 Git Quick — Commit e push", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Tudo na `main`; quando commitar; commit + push; Git × site; proibições", "ordem": 1, "titulo": "Quando commitar", "tipo": "Obrigatória", "texto": "| Momento | O que vai no commit |\n|---------|---------------------|\n| Reserva da tarefa (`tasks/frentes-e-reserva.md`) | Só o quadro — commit + push imediatos |\n| **Fim da tarefa** | Arquivos da tarefa + quadro (`tasks/STATUS.md` e a etapa) + visualizador regenerado — **1 commit + push** |\n| Usuário pede \"faça commit agora\" | Na hora, mesmo no meio da tarefa |\n\n- Usuário diz \"só commit, sem push\" → respeitar.\n- Executar os comandos de git **direto, sem perguntar**."}, {"arquivo": "git-quick.md", "tituloArquivo": "🔀 Git Quick — Commit e push", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Tudo na `main`; quando commitar; commit + push; Git × site; proibições", "ordem": 1, "titulo": "Fluxo", "tipo": "Fluxo", "texto": "```bash\ngit fetch --all --prune          # sem isso o git status mente\ngit pull --rebase origin main    # nunca pull sem --rebase (gera merge)\npython scripts/regras/gerar_visualizador_regras.py   # só no fim da tarefa (visualizador-regras.md)\ngit add <caminho1> <caminho2>    # só os arquivos da tarefa + quadro\ngit diff --cached --name-only    # conferir o que vai no commit\ngit commit -m \"feat(tema): descrição por <IA> (<frente>)\n\nCo-Authored-By: <nome do modelo em uso> <e-mail noreply do fornecedor da IA>\"\ngit push origin main\n```\n\n- Claude: `Co-Authored-By: Claude <modelo> <noreply@anthropic.com>`; outras IAs usam o nome e o\n  e-mail noreply do próprio fornecedor.\n- Push recusado porque o remoto andou → `fetch` + `pull --rebase` + reler o quadro + push de novo.\n  Conflito no `.claude/rules/index.html` → regenerar (não resolver à mão)."}, {"arquivo": "git-quick.md", "tituloArquivo": "🔀 Git Quick — Commit e push", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Tudo na `main`; quando commitar; commit + push; Git × site; proibições", "ordem": 1, "titulo": "Proibido", "tipo": "Proibição", "texto": "- ⛔ `git add .` (arrasta arquivos de outra tarefa ou de outra frente)\n- ⛔ `git push --force`\n- ⛔ `git pull` sem `--rebase` e `git merge`\n- ⛔ `git status` repetido entre comandos ou depois do commit (o git já avisa erros)\n- ⛔ Várias tarefas num commit só, ou tarefa concluída sem commit\n- ⛔ Commit/push de tarefa incompleta ou falhando"}, {"arquivo": "git-quick.md", "tituloArquivo": "🔀 Git Quick — Commit e push", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Tudo na `main`; quando commitar; commit + push; Git × site; proibições", "ordem": 1, "titulo": "O que vai para o Git e o que vai para o site", "tipo": "Proibição", "texto": "| Arquivo | Git | Site (Vercel) |\n|---------|-----|---------------|\n| `.env`, chaves, tokens, `variaveis.js` | ❌ (`.gitignore`) | ❌ |\n| Gabaritos, fontes de questões, seeds de atividades, listas de alunos e de presença | ✅ | ❌ (`.vercelignore`) |\n| Markdown, JavaScript, HTML, schema SQL | ✅ | ✅ |\n\nArquivo novo com resposta certa ou dado pessoal → conferir se o `.vercelignore` já o tira do site."}, {"arquivo": "git-quick.md", "tituloArquivo": "🔀 Git Quick — Commit e push", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Tudo na `main`; quando commitar; commit + push; Git × site; proibições", "ordem": 1, "titulo": "Mensagens", "tipo": "Obrigatória", "texto": "```\nfeat(materias): gerar atividades de ITIC\nfix(banco): corrigir RLS de professor\ndocs(regras): reestruturar .claude/rules\n```"}, {"arquivo": "tasks/quadro.md", "tituloArquivo": "🗂️ Quadro de tarefas — fonte única", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "Fonte única: onde fica cada informação; modelos do `STATUS.md` e da etapa", "ordem": 2, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Esta pasta (`.claude/rules/tasks/`) serve para **qualquer projeto**: não tem nada específico de um\nprojeto. Para usar em outro, copie a pasta e crie `tasks/STATUS.md` e `tasks/etapas/` pelos\nmodelos abaixo. Ciclo da tarefa: `ciclo-da-task.md` · várias sessões: `frentes-e-reserva.md`."}, {"arquivo": "tasks/quadro.md", "tituloArquivo": "🗂️ Quadro de tarefas — fonte única", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "Fonte única: onde fica cada informação; modelos do `STATUS.md` e da etapa", "ordem": 2, "titulo": "Cada informação em um lugar só", "tipo": "Obrigatória", "texto": "| Informação | Lugar único |\n|------------|-------------|\n| Pedido, objetivo, próximo passo, escopo, riscos, itens e status de cada item | **Etapa** da tarefa: `tasks/etapas/ETAPA-NNN-<uuid8>-ASSUNTO.md` |\n| Status geral, prioridade, dependências e reserva | Linha da tarefa em \"📌 Tarefas\" do `tasks/STATUS.md` |\n| Tarefa que cada sessão está fazendo | Linha da frente em \"🧭 Frentes\" do `tasks/STATUS.md` |\n| Decisões, riscos, pendências e lições do projeto | Seções do `tasks/STATUS.md` |\n| Recados entre sessões | `tasks/RECADOS.md` (só se acrescentam linhas) |\n\n- ⛔ Não copiar para outro lugar: sem `TASKS.md`, sem plano separado em `docs/`, sem lista de\n  pendências do usuário montada à mão, sem cópia da fila em tabela de banco.\n- O que o usuário precisa fazer = itens **👀** das etapas (filtrar; não copiar).\n- O que não está no quadro não aconteceu. Histórico nunca é apagado: só se acrescentam etapas.\n- Quadro em formato antigo → migrar para este modelo levando o conteúdo, sem perder histórico.\n- Linguagem simples, que quem não é técnico entende."}, {"arquivo": "tasks/quadro.md", "tituloArquivo": "🗂️ Quadro de tarefas — fonte única", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "Fonte única: onde fica cada informação; modelos do `STATUS.md` e da etapa", "ordem": 2, "titulo": "Legenda", "tipo": "Obrigatória", "texto": "⬜ Pendente · 🔄 Em progresso · ✅ Concluído · ⛔ Bloqueado (motivo + o que destrava) ·\n👀 Aguardando o usuário"}, {"arquivo": "tasks/quadro.md", "tituloArquivo": "🗂️ Quadro de tarefas — fonte única", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "Fonte única: onde fica cada informação; modelos do `STATUS.md` e da etapa", "ordem": 2, "titulo": "Modelo do `tasks/STATUS.md`", "tipo": "Referência", "texto": "```markdown\n\n\n**Objetivo:** <1 frase> · **Partes interessadas:** <quem decide / aprova / usa>\n**Links:** [Regras](../AGENTS.md) · [Etapas](etapas/) · [Recados](RECADOS.md)\n\n## 🧭 Frentes de trabalho\n| Frente | Tarefa (etapa) | Situação | Atualizado em |\n\n## 📌 Tarefas\n| Tarefa | Título | Prioridade | Depende de | Status | Em uso por | Etapa |\n\n## Escopo do projeto\n## 🗂️ Etapas            (uma linha por etapa, criada junto com ela; nunca apagar)\n| Etapa | Assunto | Arquivo |\n## Riscos · ## Bloqueios gerais (sem tarefa) · ## Registro de decisões\n## Pendências (ficou para depois) · ## Lições aprendidas\n```\n\n- **Status** na linha da tarefa: só o emoji e 1–3 palavras (`🔄 Em execução`); o detalhe fica na\n  etapa. **Prioridade:** 🔴 Máxima · 🟠 Alta · 🟡 Média · 🟢 Baixa (definida pelo usuário).\n- Seção sem conteúdo fica com a tabela vazia (não apagar o cabeçalho)."}, {"arquivo": "tasks/quadro.md", "tituloArquivo": "🗂️ Quadro de tarefas — fonte única", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "Fonte única: onde fica cada informação; modelos do `STATUS.md` e da etapa", "ordem": 2, "titulo": "Modelo da etapa", "tipo": "Referência", "texto": "```markdown\n## Etapa NNN-<uuid8> — <título>\n\n**Tarefa:** #NN-<uuid> · **Pedido em:** AAAA-MM-DD HH:MM · **Executor:** <IA (frente)>\n**Pedido:** <palavras de quem pediu>\n**Objetivo:** <1 frase: o que e por quê>\n**Próximo passo:** NNN.x — <ação exata>\n\n### Escopo · ### Riscos · ### Decisões     ← só em tarefa grande (o plano é a etapa)\n\n| Item | Descrição | Status | Concluído em | Verificação |\n|------|-----------|--------|--------------|-------------|\n| NNN.1 | … | ⬜ Pendente | — | <como foi conferido> |\n| NNN.x | Aceite do usuário | ⬜ Pendente | — | — |\n```\n\n- Número da etapa sequencial + 8 caracteres de um UUID (evita número repetido entre sessões).\n- Itens pequenos (horas, não semanas), na ordem de execução."}, {"arquivo": "tasks/ciclo-da-task.md", "tituloArquivo": "🔁 Ciclo de uma tarefa (TASK)", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "O que vira TASK; abrir, pequena × grande (plano na etapa), executar, encerrar, retomar", "ordem": 3, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Reutilizável em qualquer projeto. Onde fica cada informação: `quadro.md`."}, {"arquivo": "tasks/ciclo-da-task.md", "tituloArquivo": "🔁 Ciclo de uma tarefa (TASK)", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "O que vira TASK; abrir, pequena × grande (plano na etapa), executar, encerrar, retomar", "ordem": 3, "titulo": "O que vira TASK", "tipo": "Obrigatória", "texto": "- ✅ Todo pedido que **muda** arquivo, banco ou configuração vira TASK **antes** de executar.\n- ❌ Pergunta, explicação ou análise que não muda nada **não** vira TASK: só responder.\n  Se a resposta levar a mudanças, a TASK nasce quando o usuário pedir."}, {"arquivo": "tasks/ciclo-da-task.md", "tituloArquivo": "🔁 Ciclo de uma tarefa (TASK)", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "O que vira TASK; abrir, pequena × grande (plano na etapa), executar, encerrar, retomar", "ordem": 3, "titulo": "1. Abrir", "tipo": "Obrigatória", "texto": "1. Sincronizar com o remoto (regras de git do projeto) e ler o `tasks/STATUS.md`.\n2. Criar a etapa (`quadro.md`), a linha em \"📌 Tarefas\" e a linha em \"🗂️ Etapas\".\n3. Reservar a tarefa (`frentes-e-reserva.md`).\n4. **Pedir detalhes ao solicitante**, numa mensagem só: objetivo e resultado esperado, escopo\n   (entra / não entra), arquivos ou partes envolvidas, critério de pronto, prazo.\n   - Não perguntar o que já está no pedido, no quadro ou no código.\n   - Pedido completo → confirmar o entendimento em 1 frase e seguir.\n   - ❌ Não assumir detalhe crítico em silêncio."}, {"arquivo": "tasks/ciclo-da-task.md", "tituloArquivo": "🔁 Ciclo de uma tarefa (TASK)", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "O que vira TASK; abrir, pequena × grande (plano na etapa), executar, encerrar, retomar", "ordem": 3, "titulo": "2. Pequena ou grande", "tipo": "Obrigatória", "texto": "| Tipo | Definição | Exige |\n|------|-----------|-------|\n| **Pequena** | Ajuste pontual em até ~3 arquivos, sem nada da linha de baixo | Etapa com itens |\n| **Grande** | Mexe em **banco**, **segurança** (login, papéis, permissões, chaves), tem **várias partes**, cria estrutura/gerador novo, faz **mudança em massa** ou **apaga dados** | Plano na **própria etapa** + **aprovação** |\n\nNa dúvida, é grande. O projeto pode definir exceções (rotinas já autorizadas).\n\n**Tarefa grande — o plano é a etapa:**\n1. Escrever na etapa: objetivo, escopo (entra / não entra), critério de pronto, premissas, riscos\n   com plano B e os itens com a verificação de cada um.\n2. Mostrar ao usuário um resumo (itens, arquivos, riscos, verificações) e perguntar se está certo.\n3. Esperar um **\"sim\" claro**; registrar a aprovação como item ✅ da etapa (quem, quando).\n4. Executar **só o escopo aprovado**. Mudança material de escopo → atualizar a etapa e pedir\n   **nova** aprovação."}, {"arquivo": "tasks/ciclo-da-task.md", "tituloArquivo": "🔁 Ciclo de uma tarefa (TASK)", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "O que vira TASK; abrir, pequena × grande (plano na etapa), executar, encerrar, retomar", "ordem": 3, "titulo": "3. Executar", "tipo": "Obrigatória", "texto": "- **Um item por vez:** só um 🔄 na etapa; terminar antes de começar outro.\n- Atualizar **na hora**: 🔄 ao começar, ✅ com data e hora ao terminar — nunca acumular.\n- **Próximo passo** da etapa sempre atualizado: é a última coisa a escrever ao parar e a primeira\n  a ler ao retomar.\n- Bloqueio → item ⛔ com motivo e o que destrava, **na hora**. Depende do usuário → item 👀.\n- Cada item com **verificação** (como foi conferido), conforme as regras de validação do projeto.\n- Decisão tomada no caminho → seção Decisões da etapa (o quê, quando, quem, por quê); se valer\n  para o projeto todo, também no \"Registro de decisões\" do `STATUS.md`."}, {"arquivo": "tasks/ciclo-da-task.md", "tituloArquivo": "🔁 Ciclo de uma tarefa (TASK)", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "O que vira TASK; abrir, pequena × grande (plano na etapa), executar, encerrar, retomar", "ordem": 3, "titulo": "4. Encerrar", "tipo": "Obrigatória", "texto": "1. Etapa: todos os itens ✅ (ou ⛔ justificados); o último é o **aceite** de quem pediu (👀 até ele\n   confirmar).\n2. Pendências que ficaram para depois → \"Pendências\" do `STATUS.md`, com motivo.\n3. Lição aprendida que vira regra → \"Lições aprendidas\" do `STATUS.md` (e a regra no lugar certo).\n4. `STATUS.md`: status da tarefa atualizado, \"Em uso por\" = `—`, linha da frente atualizada.\n5. **Um commit por tarefa** com o quadro no mesmo commit (e push, conforme a regra do projeto).\n6. Responder **apenas**: **TAREFA FINALIZADA!, AJUDO EM ALGO MAIS?** — sem resumo nem tabela\n   (perguntas e bloqueios são respondidos normalmente)."}, {"arquivo": "tasks/ciclo-da-task.md", "tituloArquivo": "🔁 Ciclo de uma tarefa (TASK)", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "O que vira TASK; abrir, pequena × grande (plano na etapa), executar, encerrar, retomar", "ordem": 3, "titulo": "Retomar (sessão nova ou que caiu)", "tipo": "Obrigatória", "texto": "1. Ler o `STATUS.md`: linha da sua frente e da tarefa reservada.\n2. Ler o **Próximo passo** da etapa; item 🔄/⬜ de tarefa aprovada → conferir o que já foi feito\n   (arquivos e commits) e **continuar de onde parou**.\n3. ❌ Não recomeçar do zero, não refazer itens ✅, não pular itens."}, {"arquivo": "tasks/frentes-e-reserva.md", "tituloArquivo": "🧭 Frentes e reserva de tarefas", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "Várias sessões/IAs: frentes, reserva, prioridade, limites, conflitos", "ordem": 4, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Reutilizável em qualquer projeto em que várias sessões ou IAs (Claude, Gemini, Grok, Copilot…)\ntrabalham no mesmo repositório e só se falam pelos arquivos. Quadro: `quadro.md`."}, {"arquivo": "tasks/frentes-e-reserva.md", "tituloArquivo": "🧭 Frentes e reserva de tarefas", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "Várias sessões/IAs: frentes, reserva, prioridade, limites, conflitos", "ordem": 4, "titulo": "Frentes", "tipo": "Obrigatória", "texto": "- Cada sessão é uma **frente**: `<ambiente> · <branch>` (ex.: `local · main`,\n  `nuvem · <nome-da-sessão>`).\n- Cada frente atualiza **só a própria linha** em \"🧭 Frentes\", ao começar e ao parar. Sem\n  pendência → `⏹️ Encerrada`.\n- O nome da IA/frente aparece na reserva, na linha da frente, no Executor da etapa e na mensagem\n  de commit (ex.: `feat(x): ... por Claude Code (local · main)`)."}, {"arquivo": "tasks/frentes-e-reserva.md", "tituloArquivo": "🧭 Frentes e reserva de tarefas", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "Várias sessões/IAs: frentes, reserva, prioridade, limites, conflitos", "ordem": 4, "titulo": "Pegar uma tarefa", "tipo": "Obrigatória", "texto": "1. Sincronizar com o remoto; **só então** ler o `STATUS.md` (sem sincronizar, o quadro mente).\n2. Escolher uma tarefa com **\"Em uso por\" = `—`** e **todas as dependências ✅**.\n3. Entre as livres, a de **maior prioridade** (🔴 → 🟠 → 🟡 → 🟢); empate = ordem do quadro.\n   🟢 Baixa só com orientação explícita do usuário.\n4. Gravar `<frente> (desde <data hora>)` em \"Em uso por\", fazer **commit + push imediatos** e só\n   então começar o trabalho.\n5. Push da reserva recusado → sincronizar, **reler** o quadro; se outra frente pegou a mesma tarefa,\n   desfazer a sua reserva e escolher outra."}, {"arquivo": "tasks/frentes-e-reserva.md", "tituloArquivo": "🧭 Frentes e reserva de tarefas", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "Várias sessões/IAs: frentes, reserva, prioridade, limites, conflitos", "ordem": 4, "titulo": "Limites", "tipo": "Proibição", "texto": "- **1 tarefa reservada por frente.** Só pega a próxima depois de entregar ou liberar a atual.\n- ⛔ Nunca mexer na reserva, na linha de frente ou na etapa de outra frente. Reserva \"parada\" não é\n  abandonada: quem libera é **o usuário** (ou quem ele autorizar).\n- Tarefa grande demais → dividir em tarefas menores antes de começar, cada uma com prioridade\n  (herda a da mãe, ou 🟡) e dependências declaradas.\n- A prioridade é **do usuário**; a IA não muda a de tarefas existentes sem pedido.\n- Scripts e rascunhos temporários na **pasta da própria sessão**, nunca em pasta compartilhada\n  nem no repositório."}, {"arquivo": "tasks/frentes-e-reserva.md", "tituloArquivo": "🧭 Frentes e reserva de tarefas", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "Várias sessões/IAs: frentes, reserva, prioridade, limites, conflitos", "ordem": 4, "titulo": "Conflitos", "tipo": "Obrigatória", "texto": "- Conflito no `STATUS.md` ao sincronizar: manter as mudanças das duas frentes (cada uma só mexe\n  nas próprias linhas) e reler antes de seguir.\n- Arquivo **gerado** em conflito (ex.: visualizador do quadro): não resolver à mão — rodar o\n  gerador de novo depois de sincronizar.\n- Recado para outra frente (ou para todas) → `tasks/RECADOS.md`; ler os recados ao começar."}, {"arquivo": "multiplas-ias.md", "tituloArquivo": "🤖 Várias IAs neste projeto", "categoria": "🟠 Coordenar neste projeto", "assunto": "Nome das frentes; banco só pelo Claude Code local", "ordem": 5, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "As regras gerais de frentes, reserva, prioridade e conflitos estão em\n[`tasks/frentes-e-reserva.md`](tasks/frentes-e-reserva.md) (valem para todas as IAs). Aqui fica só\no que é **deste projeto**."}, {"arquivo": "multiplas-ias.md", "tituloArquivo": "🤖 Várias IAs neste projeto", "categoria": "🟠 Coordenar neste projeto", "assunto": "Nome das frentes; banco só pelo Claude Code local", "ordem": 5, "titulo": "1. Nome das frentes", "tipo": "Obrigatória", "texto": "- **Local:** `local · main` (máquina do usuário).\n- **Nuvem:** `nuvem · <nome-da-sessão>` — também trabalha na `main` (`git-quick.md`), mesmo que a\n  ferramenta indique outra branch."}, {"arquivo": "multiplas-ias.md", "tituloArquivo": "🤖 Várias IAs neste projeto", "categoria": "🟠 Coordenar neste projeto", "assunto": "Nome das frentes; banco só pelo Claude Code local", "ordem": 5, "titulo": "2. Banco de dados: só o Claude Code local", "tipo": "Obrigatória", "texto": "- Só o **Claude Code local** (máquina do usuário, com o conector do Supabase) pega tarefa de banco:\n  SQL, schema, trigger, função, RLS, migração, seeds, consultas e validação contra o banco real.\n- ⛔ Sessões de nuvem e outras IAs não pegam essas tarefas; se a tarefa tiver parte sem banco\n  (frontend, documentação), essa parte vira item ou tarefa separada.\n- Frente sem banco que encontrar seed pendente: segue o que diz `seeds.md` (não fica travada).\n- Mudança em banco de produção exige autorização do usuário, exceto o ciclo de seeds já autorizado\n  em `seeds.md`."}, {"arquivo": "docs-antes-de-editar.md", "tituloArquivo": "📚 Ler a orientação em `docs/` antes de editar", "categoria": "🟠 Coordenar neste projeto", "assunto": "Ler a orientação em `docs/` antes de mexer em um arquivo", "ordem": 6, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "**Antes de modificar um arquivo**, procure a orientação dele e leia por completo."}, {"arquivo": "docs-antes-de-editar.md", "tituloArquivo": "📚 Ler a orientação em `docs/` antes de editar", "categoria": "🟠 Coordenar neste projeto", "assunto": "Ler a orientação em `docs/` antes de mexer em um arquivo", "ordem": 6, "titulo": "Onde procurar", "tipo": "Referência", "texto": "| Vai mexer em | Leia antes |\n|--------------|-----------|\n| Módulo de `js/` (`aulas`, `curso`, `materia`, `unidade`…) | `docs/ORIENTACAO_JS_<MODULO>.md` |\n| Login / autenticação ⚠️ | `docs/ORIENTACAO_JS_LOGIN.md` e `docs/ORIENTACAO_USUARIO.md` |\n| Supabase (queries, headers, RLS, JWT) ⚠️ | `docs/ORIENTACAO_JS_SUPABASE.md` |\n| Banco de dados | `docs/database.md` (manter `docs/relatorio_verificacao_database.html` sincronizado) |\n| Bug já identificado | `bugs/bug-<nome>.md` |\n| Demais arquivos (`assets/js/`, páginas, geradores) | Cabeçalho do próprio arquivo + regra do assunto em `docs/regras/` (`materias.md`, `atividades.md`, `apostilas.md`, `codigo.md`, `assets-e-geradores.md`…) |"}, {"arquivo": "docs-antes-de-editar.md", "tituloArquivo": "📚 Ler a orientação em `docs/` antes de editar", "categoria": "🟠 Coordenar neste projeto", "assunto": "Ler a orientação em `docs/` antes de mexer em um arquivo", "ordem": 6, "titulo": "Quando avisar o usuário", "tipo": "Obrigatória", "texto": "- Módulo de `js/` sem orientação (hoje: `menu.js` e `header-usuario.js`) → avisar antes de editar.\n- Para os demais arquivos não há orientação própria: não precisa avisar."}, {"arquivo": "docs-antes-de-editar.md", "tituloArquivo": "📚 Ler a orientação em `docs/` antes de editar", "categoria": "🟠 Coordenar neste projeto", "assunto": "Ler a orientação em `docs/` antes de mexer em um arquivo", "ordem": 6, "titulo": "Checklist", "tipo": "Fluxo", "texto": "```\n☐ Identifiquei o arquivo a modificar\n☐ Achei a orientação correspondente (ou avisei, se for módulo de js/ sem orientação)\n☐ Li a orientação inteira e apliquei as regras dela\n```\n\nSem ler a orientação, é fácil violar regras críticas (RLS, JWT, segurança)."}, {"arquivo": "codigo-solid.md", "tituloArquivo": "🧱 Código — Princípios SOLID", "categoria": "🟡 Código e validação", "assunto": "SOLID e aplicação em JS, Python, HTML e CSS", "ordem": 7, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Todo arquivo de programação criado ou modificado (JavaScript, Python, HTML, CSS…) aplica SOLID,\nde forma **pragmática**: sem abstração desnecessária em script pequeno. Em código existente, seguir\no padrão do projeto e aplicar SOLID nas partes criadas ou alteradas.\nLimites, nomes e legibilidade: `codigo-limites-nomes.md`."}, {"arquivo": "codigo-solid.md", "tituloArquivo": "🧱 Código — Princípios SOLID", "categoria": "🟡 Código e validação", "assunto": "SOLID e aplicação em JS, Python, HTML e CSS", "ordem": 7, "titulo": "Os 5 princípios", "tipo": "Obrigatória", "texto": "| Letra | Princípio | Regra prática |\n|-------|-----------|---------------|\n| **S** | Single Responsibility | Cada função/classe/módulo/arquivo tem **uma** responsabilidade |\n| **O** | Open/Closed | Estender sem modificar: mapas de estratégia, composição — não `if/else` crescente |\n| **L** | Liskov Substitution | Implementações substituem a base sem quebrar o contrato |\n| **I** | Interface Segregation | Módulos pequenos e específicos; ninguém depende do que não usa |\n| **D** | Dependency Inversion | Depender de abstrações; **injetar** cliente de banco, API, storage |"}, {"arquivo": "codigo-solid.md", "tituloArquivo": "🧱 Código — Princípios SOLID", "categoria": "🟡 Código e validação", "assunto": "SOLID e aplicação em JS, Python, HTML e CSS", "ordem": 7, "titulo": "Por tecnologia", "tipo": "Obrigatória", "texto": "**JavaScript / Python**\n- ✅ Separar regra de negócio, acesso a dados (repository/service) e UI/DOM\n- ✅ Injetar dependências por construtor ou parâmetro (cliente Supabase, `fetch`, repositório)\n- ✅ Trocar cadeias de `if/switch` por tipo por mapas de estratégia ou polimorfismo\n- ✅ Um arquivo por responsabilidade (`aula.servico.js`, `aula.repositorio.js`, `aula.tela.js`)\n- ✅ Python: `abc.ABC`/`Protocol` quando houver mais de uma implementação\n- ❌ Arquivo \"faz-tudo\" (validação + banco + DOM + formatação juntos)\n\n**HTML**\n- ✅ Estrutura semântica (`header`, `main`, `section`, `article`, `nav`, `footer`)\n- ✅ Sem `style=\"\"` e sem JavaScript inline (`onclick`)\n- ✅ Blocos reutilizáveis e independentes\n\n**CSS**\n- ✅ Classes de responsabilidade única (layout ≠ tema ≠ componente ≠ utilitário)\n- ✅ Estender por modificador (BEM: `.cartao--destaque`) em vez de editar a classe base\n- ✅ Tokens em `:root { --cor-primaria }`; componentes usam tokens, não valores fixos\n- ❌ Seletores acoplados à estrutura (`div > ul > li > a`) e `!important` desnecessário"}, {"arquivo": "codigo-solid.md", "tituloArquivo": "🧱 Código — Princípios SOLID", "categoria": "🟡 Código e validação", "assunto": "SOLID e aplicação em JS, Python, HTML e CSS", "ordem": 7, "titulo": "Checklist SOLID", "tipo": "Fluxo", "texto": "```\n☐ Cada função/classe/arquivo tem uma única responsabilidade?\n☐ Dá para adicionar um caso novo sem alterar código existente?\n☐ Implementações podem ser trocadas sem quebrar quem as usa?\n☐ Módulos enxutos?\n☐ Dependências externas injetadas, não instanciadas no meio da lógica?\n☐ HTML, CSS e JS separados?\n```"}, {"arquivo": "codigo-limites-nomes.md", "tituloArquivo": "📏 Código — Limites, nomes e legibilidade", "categoria": "🟡 Código e validação", "assunto": "Limites (arquivo, função, linha), constantes, nomes em português, legibilidade", "ordem": 8, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Complementa `codigo-solid.md`. Vale para todas as linguagens."}, {"arquivo": "codigo-limites-nomes.md", "tituloArquivo": "📏 Código — Limites, nomes e legibilidade", "categoria": "🟡 Código e validação", "assunto": "Limites (arquivo, função, linha), constantes, nomes em português, legibilidade", "ordem": 8, "titulo": "Limites obrigatórios", "tipo": "Obrigatória", "texto": "| Regra | Exigência |\n|-------|-----------|\n| Arquivo | Máx. **1000 linhas** — passou, dividir por responsabilidade |\n| Função | Máx. **45 linhas** — passou, extrair funções menores |\n| Parâmetros | Máx. **3** — acima disso, receber um objeto (`criarAula({ titulo, data, turma })`) |\n| Aninhamento | Máx. **2 níveis** de `if`/`for`/`while` — usar return early ou extrair função |\n| Linha | Máx. **100 caracteres** |\n| Documentação | **Toda função** com JSDoc/docstring: objetivo, parâmetros, retorno, exceções |\n| Constantes | Valores fixos (URLs, tabelas, mensagens, limites, chaves, cores) viram **constantes nomeadas**: no bloco do topo do arquivo, ou no arquivo de constantes/configuração do módulo quando ele existir; cores e medidas em `:root` no CSS. Proibido número/string mágica no meio do código |\n| Formatação | Prettier + ESLint (JS/HTML/CSS) e Black + Ruff (Python) **onde houver configuração**; sem configuração (caso atual do projeto), seguir o estilo do próprio arquivo e o limite de 100 caracteres |"}, {"arquivo": "codigo-limites-nomes.md", "tituloArquivo": "📏 Código — Limites, nomes e legibilidade", "categoria": "🟡 Código e validação", "assunto": "Limites (arquivo, função, linha), constantes, nomes em português, legibilidade", "ordem": 8, "titulo": "Legibilidade", "tipo": "Obrigatória", "texto": "- **Return early:** validações e erros no início da função.\n- **Condições nomeadas:** `const podeInscrever = idade >= 16 && matriculado;`\n- **Sem abreviações:** `quantidade`, não `qtd` (exceto `i`, `j` de laço).\n- **Sem ternário aninhado** (`a ? b : c ? d : e`) — usar `if` com return ou mapa.\n- **Comentários** explicam o porquê; sem código comentado ou morto (o Git guarda o histórico).\n- `const` por padrão, `let` só se reatribuir, **nunca `var`**; funções puras quando possível.\n- `async/await` em vez de `.then()`; erros com `try/catch` consistente.\n- Ordem no arquivo: imports → constantes → auxiliares → principais → inicialização/export."}, {"arquivo": "codigo-limites-nomes.md", "tituloArquivo": "📏 Código — Limites, nomes e legibilidade", "categoria": "🟡 Código e validação", "assunto": "Limites (arquivo, função, linha), constantes, nomes em português, legibilidade", "ordem": 8, "titulo": "Nomes em português (sem acentos)", "tipo": "Obrigatória", "texto": "| Elemento | JavaScript | Python | CSS |\n|----------|-----------|--------|-----|\n| Variável | `totalAlunos` | `total_alunos` | — |\n| Função | `buscarAulas()` | `buscar_aulas()` | — |\n| Classe | `AulaRepositorio` | `AulaRepositorio` | `.lista-aulas` |\n| Constante | `LIMITE_ALUNOS` | `LIMITE_ALUNOS` | `--cor-destaque` |\n| Booleano | `estaAtivo`, `temNota`, `podeEditar` | `esta_ativo` | — |\n\nEm inglês só: palavras reservadas, APIs/bibliotecas (`fetch`, `querySelector`), colunas e tabelas\njá existentes no banco e padrões consolidados do projeto. ❌ Não misturar (`getAlunos`, `userNome`)."}, {"arquivo": "codigo-limites-nomes.md", "tituloArquivo": "📏 Código — Limites, nomes e legibilidade", "categoria": "🟡 Código e validação", "assunto": "Limites (arquivo, função, linha), constantes, nomes em português, legibilidade", "ordem": 8, "titulo": "Exemplo", "tipo": "Referência", "texto": "```js\n/**\n * Retorna a situação do aluno conforme a nota final.\n * @param {{matriculado: boolean, bloqueado: boolean, nota: number}} aluno\n * @returns {string|null} Situação, ou null se não puder ser avaliado.\n */\nfunction obterSituacao(aluno) {\n  if (!aluno) return null;\n\n  const podeSerAvaliado = aluno.matriculado && !aluno.bloqueado;\n  if (!podeSerAvaliado) return null;\n\n  if (aluno.nota >= NOTA_MINIMA_APROVACAO) return SITUACAO_APROVADO;\n  if (aluno.nota >= NOTA_MINIMA_RECUPERACAO) return SITUACAO_RECUPERACAO;\n  return SITUACAO_REPROVADO;\n}\n```"}, {"arquivo": "codigo-limites-nomes.md", "tituloArquivo": "📏 Código — Limites, nomes e legibilidade", "categoria": "🟡 Código e validação", "assunto": "Limites (arquivo, função, linha), constantes, nomes em português, legibilidade", "ordem": 8, "titulo": "Checklist", "tipo": "Fluxo", "texto": "```\n☐ Arquivo ≤ 1000 linhas, função ≤ 45, linha ≤ 100?\n☐ Toda função documentada?\n☐ Return early, ≤ 3 parâmetros, ≤ 2 níveis de aninhamento?\n☐ Sem número/string mágica (tudo em constante nomeada)?\n☐ Nomes em português, sem abreviação e sem ternário aninhado?\n☐ const/let, async/await, no estilo do arquivo (ou formatador, onde houver configuração)?\n```"}, {"arquivo": "testes-validacao.md", "tituloArquivo": "🧪 Testes e validação", "categoria": "🟡 Código e validação", "assunto": "Nunca abrir navegador; nunca escrever testes (exceto bug)", "ordem": 9, "titulo": "🚫 Nunca abrir navegador (2026-09-30)", "tipo": "Proibição", "texto": "- ⛔ Nada de Browser pane/preview (`preview_start`, `navigate`, `screenshot`…), computer-use,\n  Playwright, Puppeteer, `start chrome`/`Start-Process` de páginas.\n- ⛔ Não iniciar servidor de desenvolvimento para validar.\n- ✅ Validar só por **leitura do código**, `node --check`, **consultas ao banco** e terminal.\n- Vale mesmo quando o ambiente sugerir \"verificar no navegador\". Se algo só puder ser confirmado\n  no navegador, **avisar o usuário** para testar."}, {"arquivo": "testes-validacao.md", "tituloArquivo": "🧪 Testes e validação", "categoria": "🟡 Código e validação", "assunto": "Nunca abrir navegador; nunca escrever testes (exceto bug)", "ordem": 9, "titulo": "🚨 Nunca escrever testes automatizados", "tipo": "Proibição", "texto": "Regra **permanente**. Única exceção: a tarefa é **corrigir um bug** (aí um teste que reproduza a\nfalha é bem-vindo).\n\n- ❌ Criar `*.test.js`, `*.spec.js`, `test_*.py` ou equivalentes\n- ❌ \"Escrever testes\" como passo de plano\n- ❌ Testes \"de brinde\" junto com uma feature\n- ❌ Seguir skills de TDD que mandem testar antes\n- Vale mesmo que o repositório já tenha suíte configurada."}, {"arquivo": "testes-validacao.md", "tituloArquivo": "🧪 Testes e validação", "categoria": "🟡 Código e validação", "assunto": "Nunca abrir navegador; nunca escrever testes (exceto bug)", "ordem": 9, "titulo": "Quando rodar testes existentes", "tipo": "Obrigatória", "texto": "Só se houver erro específico a verificar, o usuário pedir, ou para diagnosticar um bug.\nNão rodar só para \"validar visualmente\"."}, {"arquivo": "security-banco.md", "tituloArquivo": "🔐 Security & Banco — RLS, JWT, Gabarito", "categoria": "🟢 Banco e segurança", "assunto": "RLS + JWT, onde o gabarito pode estar, SQL idempotente", "ordem": 10, "titulo": "RLS + JWT — OBRIGATÓRIO", "tipo": "Obrigatória", "texto": "```javascript\n// ✅ CORRETO — JWT do usuário logado\nconst session = await supabase.auth.getSession();\nif (session?.data?.session?.access_token) {\n  headers.Authorization = \"Bearer \" + session.data.session.access_token;\n}\n\n// ❌ ERRADO — Sem JWT ou chave service_role\n```\n\n```sql\n-- ✅ CORRETO — RLS na tabela\nALTER TABLE \"usuario\" ENABLE ROW LEVEL SECURITY;\nCREATE POLICY \"usuarios_veem_seus_dados\"\nON \"usuario\" FOR SELECT TO authenticated\nUSING (id = auth.uid());\n```"}, {"arquivo": "security-banco.md", "tituloArquivo": "🔐 Security & Banco — RLS, JWT, Gabarito", "categoria": "🟢 Banco e segurança", "assunto": "RLS + JWT, onde o gabarito pode estar, SQL idempotente", "ordem": 10, "titulo": "Gabarito — o aluno nunca vê", "tipo": "Proibição", "texto": "| Local | Gabarito? | Por quê |\n|-------|-----------|---------|\n| Banco (tabela) | ✅ SIM | RLS controla quem lê |\n| Fontes `.md` e seeds com resposta | ✅ Só no Git | Fora do site pelo `.vercelignore` (`git-quick.md`) |\n| Página HTML / site | ❌ NÃO | Aluno vê o código |\n| PDF do aluno | ❌ NÃO | Vai para o aluno |\n| `localStorage` | ❌ NÃO | Console expõe |\n\nDepois da migração #25 (`atividades-banco.md`), as questões e o gabarito ficam **só no banco**."}, {"arquivo": "security-banco.md", "tituloArquivo": "🔐 Security & Banco — RLS, JWT, Gabarito", "categoria": "🟢 Banco e segurança", "assunto": "RLS + JWT, onde o gabarito pode estar, SQL idempotente", "ordem": 10, "titulo": "Schema — Sempre Idempotente", "tipo": "Obrigatória", "texto": "```sql\n-- ✅ CORRETO\nCREATE TABLE IF NOT EXISTS \"usuario\" (...)\nDROP POLICY IF EXISTS \"nome\" ON \"usuario\";\nALTER TABLE \"usuario\" ENABLE ROW LEVEL SECURITY;\n\n-- ❌ ERRADO — Apaga dados (só com pedido do usuário e backup)\nDELETE FROM usuario WHERE ...;\nDROP TABLE usuario;\n```\n\nApagar linhas, tabelas ou colunas em massa (com pedido do usuário): preparar o SQL e deixar o\nprofessor executar no SQL Editor — o classificador do Claude Code bloqueia esse comando pelo\nconector. O que não apaga dados pode ir pelo conector.\n\n---\n\n**Ver também:** `docs/regras/usuarios-turmas-paginas-professor.md` · hierarquia das tabelas:\n`materias-global.md`"}, {"arquivo": "seeds.md", "tituloArquivo": "🌱 Seeds — Banco de dados", "categoria": "🟢 Banco e segurança", "assunto": "Ciclo dos seeds, exceções e `database/SEEDS-APLICADOS.md`", "ordem": 11, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "**Registro único:** `database/SEEDS-APLICADOS.md`. Passo a passo completo: `scripts/seeds/README.md`.\nTarefa de banco = só o **Claude Code local** (`multiplas-ias.md`)."}, {"arquivo": "seeds.md", "tituloArquivo": "🌱 Seeds — Banco de dados", "categoria": "🟢 Banco e segurança", "assunto": "Ciclo dos seeds, exceções e `database/SEEDS-APLICADOS.md`", "ordem": 11, "titulo": "Ciclo", "tipo": "Fluxo", "texto": "| Status | Significado | Próxima ação |\n|--------|-------------|--------------|\n| **PENDENTE** | `.sql` gerado, nunca rodado | Aplicar no Supabase |\n| **APLICADO** | Rodado, ainda não conferido (ou md5 não bateu) | Conferir md5 |\n| **CONCLUÍDO** | Rodado e conferido ✅ | — |\n| **SUBSTITUÍDO** | Não será usado (outro seed já CONCLUÍDO) ✅ | — |"}, {"arquivo": "seeds.md", "tituloArquivo": "🌱 Seeds — Banco de dados", "categoria": "🟢 Banco e segurança", "assunto": "Ciclo dos seeds, exceções e `database/SEEDS-APLICADOS.md`", "ordem": 11, "titulo": "Antes de QUALQUER tarefa nova", "tipo": "Obrigatória", "texto": "Todo seed precisa estar **CONCLUÍDO** ou **SUBSTITUÍDO**. Se houver PENDENTE ou APLICADO:\naplicar → conferir md5 → registrar CONCLUÍDO → só então a tarefa nova. Exceções (decididas em\n2026-10-13), em que se segue sem travar:\n\n| Situação | O que fazer |\n|----------|-------------|\n| Frente **sem banco** (nuvem, outras IAs — `multiplas-ias.md`) | Não aplica; deixa recado em `tasks/RECADOS.md` para a frente local e segue com tarefa sem banco |\n| Seed de tarefa **reservada por outra frente** | Fica com a frente dona (item da etapa dela) |\n| Seed que depende de **ação ou decisão do usuário** | Item 👀 na etapa da tarefa dona |\n\nO ciclo de seeds **não é tarefa grande**: não precisa de plano nem de aprovação (autorização\npermanente abaixo)."}, {"arquivo": "seeds.md", "tituloArquivo": "🌱 Seeds — Banco de dados", "categoria": "🟢 Banco e segurança", "assunto": "Ciclo dos seeds, exceções e `database/SEEDS-APLICADOS.md`", "ordem": 11, "titulo": "Scripts (nunca montar à mão)", "tipo": "Proibição", "texto": "Rodar na raiz do repositório. Python no Windows: `C:\\Python314\\python.exe`; na nuvem: `python3`.\nRascunhos (lotes, JSON) ficam na pasta temporária da sessão, nunca no repositório.\n\n```bash\npython scripts/seeds/dividir_seed.py database/<seed>.sql <pasta-lotes>\npython scripts/seeds/comparar_md5.py <pasta-lotes>/esperado.json <pasta-lotes>/resultado.json\npython scripts/seeds/registrar_seed.py <seed>.sql CONCLUÍDO \"<observação com ids>\"\n```\n\n- O lote só **acrescenta** itens. Se a atividade já tiver itens diferentes no banco, avisar o\n  usuário (apagar exige pedido e backup)."}, {"arquivo": "seeds.md", "tituloArquivo": "🌱 Seeds — Banco de dados", "categoria": "🟢 Banco e segurança", "assunto": "Ciclo dos seeds, exceções e `database/SEEDS-APLICADOS.md`", "ordem": 11, "titulo": "Autorização permanente (desde 2026-10-09)", "tipo": "Obrigatória", "texto": "Sem perguntar de novo: aplicar PENDENTE, conferir APLICADO, marcar CONCLUÍDO, registrar e fazer\ncommit + push. Qualquer outra mudança no banco de produção continua exigindo autorização."}, {"arquivo": "materias-global.md", "tituloArquivo": "📚 Matérias — Regra Global", "categoria": "🔵 Conteúdo das matérias", "assunto": "Estrutura de pasta, 1 aula = 4 h, fontes do conteúdo, hierarquia, critério de pronto", "ordem": 12, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Vale para todas as matérias (substituiu a antiga \"matéria modelo ITIC\"). Detalhes com exemplos:\n`docs/regras/materias.md`."}, {"arquivo": "materias-global.md", "tituloArquivo": "📚 Matérias — Regra Global", "categoria": "🔵 Conteúdo das matérias", "assunto": "Estrutura de pasta, 1 aula = 4 h, fontes do conteúdo, hierarquia, critério de pronto", "ordem": 12, "titulo": "Estrutura de pasta (com os 5 status)", "tipo": "Obrigatória", "texto": "```\nMATERIAIS/<CURSO>/<MATERIA>/\n├── EMENTA-CHALKIE-AI.md            ← fonte do conteúdo\n├── materia.json                    ← dados da ementa e plano das aulas (`apostilas.md`)\n├── STATUS-EMENTAS.md               ← status 1\n├── STATUS_MATERIA.md               ← status 2\n├── CONTEUDO/\n│   └── AULA-NN-DESCRICAO-CURTA.md  ← uma aula por arquivo\n├── AULAS/STATUS-AULAS.md           ← status 3\n├── ATIVIDADES/STATUS-ATIVIDADES.md ← status 4 (atividades: `atividades-banco.md`)\n├── APOSTILA/\n│   ├── APOSTILA-<MATERIA>.md + .html\n│   └── STATUS-APOSTILA.md          ← status 5\n└── DOCUMENTACAO/\n```\n\nOs nomes acima são os reais (inclusive `STATUS_MATERIA.md` com sublinhado)."}, {"arquivo": "materias-global.md", "tituloArquivo": "📚 Matérias — Regra Global", "categoria": "🔵 Conteúdo das matérias", "assunto": "Estrutura de pasta, 1 aula = 4 h, fontes do conteúdo, hierarquia, critério de pronto", "ordem": 12, "titulo": "1 aula = 4 horas", "tipo": "Obrigatória", "texto": "- 1 aula a cada 4 h da carga horária da ementa (arredondando para cima).\n- Arquivo `CONTEUDO/AULA-NN-DESCRICAO-CURTA.md`; as partes da aula estão em\n  `docs/regras/materias.md` §3. O plano de cada aula (tema, domínios, capacidades…) fica só no\n  `materia.json`."}, {"arquivo": "materias-global.md", "tituloArquivo": "📚 Matérias — Regra Global", "categoria": "🔵 Conteúdo das matérias", "assunto": "Estrutura de pasta, 1 aula = 4 h, fontes do conteúdo, hierarquia, critério de pronto", "ordem": 12, "titulo": "Fontes do conteúdo", "tipo": "Proibição", "texto": "- ✅ `EMENTA-CHALKIE-AI.md` (principal) e os Markdowns da matéria; ementa da UC no curso vence a\n  da matéria.\n- ❌ Nunca ler de PDF.\n- ❌ Nunca usar conteúdo, bibliografia ou capacidade de outra UC.\n- ❌ Nunca usar matéria semelhante como base sem pedir ao usuário. Matéria semelhante é **outra\n  linha** da tabela `materia` (não reaproveitar a linha)."}, {"arquivo": "materias-global.md", "tituloArquivo": "📚 Matérias — Regra Global", "categoria": "🔵 Conteúdo das matérias", "assunto": "Estrutura de pasta, 1 aula = 4 h, fontes do conteúdo, hierarquia, critério de pronto", "ordem": 12, "titulo": "Hierarquia no banco", "tipo": "Obrigatória", "texto": "```\ncurso → materia → aulas → atividade → resposta\n```"}, {"arquivo": "materias-global.md", "tituloArquivo": "📚 Matérias — Regra Global", "categoria": "🔵 Conteúdo das matérias", "assunto": "Estrutura de pasta, 1 aula = 4 h, fontes do conteúdo, hierarquia, critério de pronto", "ordem": 12, "titulo": "Critério de pronto", "tipo": "Obrigatória", "texto": "✅ Aulas em `CONTEUDO/` · ✅ Atividades no banco · ✅ Apostila (Markdown 100% + HTML) ·\n✅ Seeds CONCLUÍDO · ✅ Os 5 status em ✅"}, {"arquivo": "apostilas.md", "tituloArquivo": "📘 Apostilas e dados da ementa (`materia.json`)", "categoria": "🔵 Conteúdo das matérias", "assunto": "`materia.json`, fluxo da apostila, identificação, PDF", "ordem": 13, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Estrutura de pastas da matéria: `materias-global.md`. Detalhes: `docs/regras/apostilas.md`."}, {"arquivo": "apostilas.md", "tituloArquivo": "📘 Apostilas e dados da ementa (`materia.json`)", "categoria": "🔵 Conteúdo das matérias", "assunto": "`materia.json`, fluxo da apostila, identificação, PDF", "ordem": 13, "titulo": "Antes de gerar", "tipo": "Obrigatória", "texto": "- Ler a **ementa da matéria** e a da **UC no curso** (a do curso vence). Fontes permitidas e\n  proibidas: `materias-global.md` (\"Fontes do conteúdo\")."}, {"arquivo": "apostilas.md", "tituloArquivo": "📘 Apostilas e dados da ementa (`materia.json`)", "categoria": "🔵 Conteúdo das matérias", "assunto": "`materia.json`, fluxo da apostila, identificação, PDF", "ordem": 13, "titulo": "`materia.json` — arquivo único de dados da matéria", "tipo": "Obrigatória", "texto": "- Fica em `<MATERIA>/materia.json` (substituiu `atividades.json` e `apostila.json`).\n- Contém as **capacidades** (básicas e socioemocionais) e os **conhecimentos** (domínios e\n  conteúdos) da ementa, sem repetir dados em outro JSON.\n- Traz o **plano de aulas: 1 aula de 4 horas = 1 capítulo** (tema, domínios, capacidades, conteúdos\n  oficiais × detalhamento didático, indicadores, situação-problema, atividade, estratégias).\n- Todos os geradores leem dele (`assets/gerador-materia/materia.py`)."}, {"arquivo": "apostilas.md", "tituloArquivo": "📘 Apostilas e dados da ementa (`materia.json`)", "categoria": "🔵 Conteúdo das matérias", "assunto": "`materia.json`, fluxo da apostila, identificação, PDF", "ordem": 13, "titulo": "Fluxo da apostila", "tipo": "Fluxo", "texto": "1. Capítulos em Markdown — **um por vez, com validação do usuário**.\n2. **Sem atividades nem perguntas** (2026-10-14, todas as apostilas): nenhum capítulo tem\n   exercícios, questões ou atividades — o gerador recusa `## Exercícios`. Atividades ficam só\n   no banco (`atividades-banco.md`). Vídeos: opcionais só com `apostila_sem_videos_e_exercicios`.\n3. **Markdown completo** em `<MATERIA>/APOSTILA/APOSTILA-<MATERIA>.md` (o usuário compara e\n   acrescenta dados).\n4. Só no final o **HTML**, gerado a partir do Markdown completo."}, {"arquivo": "apostilas.md", "tituloArquivo": "📘 Apostilas e dados da ementa (`materia.json`)", "categoria": "🔵 Conteúdo das matérias", "assunto": "`materia.json`, fluxo da apostila, identificação, PDF", "ordem": 13, "titulo": "Identificação (2026-10-07)", "tipo": "Obrigatória", "texto": "- Toda apostila mostra **autor, versão, data e hora** (capa e rodapé do HTML/PDF e cabeçalho do\n  Markdown completo).\n- Autor e versão no `materia.json` (`autor_apostila`, `versao_apostila`); data e hora = geração do\n  HTML. Autor padrão: **Gelvazio Camargo**.\n- Mudou o conteúdo → subir a versão (ajuste 1.0 → 1.1; mudança grande → 2.0)."}, {"arquivo": "apostilas.md", "tituloArquivo": "📘 Apostilas e dados da ementa (`materia.json`)", "categoria": "🔵 Conteúdo das matérias", "assunto": "`materia.json`, fluxo da apostila, identificação, PDF", "ordem": 13, "titulo": "PDF (2026-10-08, todas as apostilas)", "tipo": "Obrigatória", "texto": "- Rodapé de toda folha: **\"Página N de T\"** — apostila completa usa a numeração da apostila;\n  exportação parcial (só nas apostilas antigas com exercícios) numera as folhas exportadas.\n  Código: `assets/js/apostila.js` (`numerarPaginas`, `numerarPaginasExportadas`).\n- A **faixa azul vertical** da esquerda aparece só na tela; no PDF não sai (`@media print` em\n  `assets/css/apostila.css`), mantendo as margens para a paginação não mudar."}, {"arquivo": "atividades-banco.md", "tituloArquivo": "🗃️ Atividades — Banco, layout global, sem HTML", "categoria": "🔵 Conteúdo das matérias", "assunto": "Alvo da migração #25, tamanho padrão, \"você como aluno consultor\"", "ordem": 14, "titulo": "⚠️ Situação: alvo da migração #25 (ainda pendente)", "tipo": "Obrigatória", "texto": "O modelo abaixo foi decidido em 2026-10-11 e é o **alvo** da tarefa #25 (Etapa 143-d30a9c4d),\nque ainda não foi feita. **Até a migração terminar, vale o jeito atual** descrito em\n`docs/regras/atividades.md` (páginas e fontes por aula). ⛔ Não criar página nova por aula fora do\nplano da #25."}, {"arquivo": "atividades-banco.md", "tituloArquivo": "🗃️ Atividades — Banco, layout global, sem HTML", "categoria": "🔵 Conteúdo das matérias", "assunto": "Alvo da migração #25, tamanho padrão, \"você como aluno consultor\"", "ordem": 14, "titulo": "Alvo: questões só no banco", "tipo": "Obrigatória", "texto": "Enunciado, alternativas, gabarito e tópicos ficam **só no banco**. A página busca pelo id da\natividade e monta tudo na hora. Nada de questão em arquivo (`.md`, `.html`, `.json`) nem em\n`localStorage`. Onde o gabarito pode estar: `security-banco.md`."}, {"arquivo": "atividades-banco.md", "tituloArquivo": "🗃️ Atividades — Banco, layout global, sem HTML", "categoria": "🔵 Conteúdo das matérias", "assunto": "Alvo da migração #25, tamanho padrão, \"você como aluno consultor\"", "ordem": 14, "titulo": "Alvo: layout global", "tipo": "Obrigatória", "texto": "Uma página por tipo, para todas as matérias, que recebe o **id da atividade** (ex.:\n`atividade-objetiva.html` e `atividade-pratica.html`, criadas na #25).\n\nRecursos que toda atividade já tem (não replicar por matéria): progresso da turma, gráficos,\ncálculo de nota, mínimo de questões, correção por IA (discursiva), gabarito por turma, PDF SENAI."}, {"arquivo": "atividades-banco.md", "tituloArquivo": "🗃️ Atividades — Banco, layout global, sem HTML", "categoria": "🔵 Conteúdo das matérias", "assunto": "Alvo da migração #25, tamanho padrão, \"você como aluno consultor\"", "ordem": 14, "titulo": "Alvo: pasta da matéria só com Markdown", "tipo": "Obrigatória", "texto": "```\nMATERIAIS/<CURSO>/<MATERIA>/ATIVIDADES/\n└── STATUS-ATIVIDADES.md      (sem HTML; índice gerado por script a partir do banco)\n```"}, {"arquivo": "atividades-banco.md", "tituloArquivo": "🗃️ Atividades — Banco, layout global, sem HTML", "categoria": "🔵 Conteúdo das matérias", "assunto": "Alvo da migração #25, tamanho padrão, \"você como aluno consultor\"", "ordem": 14, "titulo": "Tamanho padrão (vale já)", "tipo": "Obrigatória", "texto": "| Tipo | Tamanho |\n|------|---------|\n| Objetiva | 50 questões |\n| Prática | 10 questões × 3 tópicos |\n| Avaliação | Conforme a ementa |"}, {"arquivo": "atividades-banco.md", "tituloArquivo": "🗃️ Atividades — Banco, layout global, sem HTML", "categoria": "🔵 Conteúdo das matérias", "assunto": "Alvo da migração #25, tamanho padrão, \"você como aluno consultor\"", "ordem": 14, "titulo": "Contexto: \"Você como aluno consultor\" (2026-10-08, vale já)", "tipo": "Obrigatória", "texto": "Vale para **toda atividade** (objetiva, prática, discursiva, avaliação, situação-problema, Excel,\nWord…).\n\n- ⛔ **Não criar empresa fictícia** (\"a empresa X Ltda.\", \"a Distribuidora Y\"…).\n- ✅ O enunciado coloca o aluno como **consultor** que analisa a situação e resolve o problema:\n  \"Você, como aluno consultor, foi chamado para organizar o controle de estoque de um\n  almoxarifado…\".\n- ✅ O contexto profissional do curso continua (almoxarifado, logística, escritório…), sem nome de\n  empresa inventada."}, {"arquivo": "faixa-materias-ensalado.md", "tituloArquivo": "🎚️ Faixa de matérias: SOMENTE ENSALADO / VER TODAS MATÉRIAS", "categoria": "🔵 Conteúdo das matérias", "assunto": "Botões SOMENTE ENSALADO / VER TODAS e ON/OFF", "ordem": 15, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Registrada em 2026-10-08 23:42:02. Vale para qualquer faixa **\"Matérias — <CURSO>\"** de índice de\ncurso."}, {"arquivo": "faixa-materias-ensalado.md", "tituloArquivo": "🎚️ Faixa de matérias: SOMENTE ENSALADO / VER TODAS MATÉRIAS", "categoria": "🔵 Conteúdo das matérias", "assunto": "Botões SOMENTE ENSALADO / VER TODAS e ON/OFF", "ordem": 15, "titulo": "Filtro", "tipo": "Obrigatória", "texto": "- Ao lado do título da faixa, dois botões: **SOMENTE ENSALADO** (só matérias com\n  `ensalado = true`) e **VER TODAS MATÉRIAS** (lista completa).\n- A faixa **sempre abre em SOMENTE ENSALADO**; se nenhuma matéria estiver ensalada, mostra todas.\n- O botão do filtro em uso fica com **fundo verde piscando levemente**.\n- No índice do curso, a grade de matérias de baixo segue o mesmo filtro."}, {"arquivo": "faixa-materias-ensalado.md", "tituloArquivo": "🎚️ Faixa de matérias: SOMENTE ENSALADO / VER TODAS MATÉRIAS", "categoria": "🔵 Conteúdo das matérias", "assunto": "Botões SOMENTE ENSALADO / VER TODAS e ON/OFF", "ordem": 15, "titulo": "ON/OFF por matéria", "tipo": "Obrigatória", "texto": "- Cada matéria da faixa tem um botão **ON/OFF** ao lado do nome para marcar/desmarcar `ensalado`.\n- A mudança grava no banco: coluna **`materia.ensalado`** (boolean). Não criar coluna nova\n  (ver `docs/database.md`).\n- O ON/OFF aparece e grava **só para o perfil PROFESSOR** (garantido por RLS); o aluno vê apenas o\n  filtro."}, {"arquivo": "graphify.md", "tituloArquivo": "🕸️ Graphify", "categoria": "⚪ Ferramentas", "assunto": "Graphify só quando o usuário pedir", "ordem": 16, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "- Skill: `.claude/skills/graphify/SKILL.md`. Gatilho: o usuário digita `/graphify` → invocar a\n  skill antes de qualquer outra coisa.\n- Python: sempre `C:\\Python314\\python.exe`.\n- ⛔ **Só roda quando o u na mostra a data e hora da geração (a aba TASKS pode estar atrás do quadro entre\numa entrega e outra; a fonte é sempre o `tasks/STATUS.md`)."}, {"arquivo": "visualizador-regras.md", "tituloArquivo": "👁️ Visualizador de regras e tarefas (`.claude/rules/index.html`)", "categoria": "⚪ Ferramentas", "assunto": "`index.html` desta pasta: só visualizador; quando regenerar", "ordem": 17, "titulo": "Como funciona", "tipo": "Obrigatória", "texto": "| Parte | Onde |\n|-------|------|\n| Gerador | `scripts/regras/gerar_visualizador_regras.py` |\n| Leitura das regras (`*.md` e `tasks/*.md`; seções `##`, categoria pelo `INDEX.md`, tipo) | `scripts/regras/visualizador/leitor_regras.py` |\n| Leitura do quadro (frentes e \"📌 Tarefas\" do `STATUS.md`, etapa de cada tarefa; \"Aguardando o usuário\" = itens 👀 das etapas) | `scripts/regras/visualizador/leitor_tarefas.py` |\n| Página (HTML, CSS e JS que o gerador junta num arquivo só) | `scripts/regras/visualizador/` |\n\n- O conteúdo vai **embutido** no HTML: a página abre também por duplo clique, sem servidor.\n- **Categoria** = grupo do arquivo no `INDEX.md` (arquivo novo de regra: listar lá para aparecer\n  na categoria certa). **Tipo** = Proibição, Fluxo, Referência ou Obrigatória, pelo título da\n  seção.\n- O limite de 5 KB vale para as regras `.md`; o `index.html` gerado não entra nessa conta."}], "tasks": {"tarefas": [{"Tarefa": "#2", "Título": "Apostilas só em Markdown (.md)", "Prioridade": "🟠 Alta", "Depende de": "—", "Status": "👀 Plano aguardando aprovação", "Em uso por": "—", "Etapa": "[149-b8f5e662](etapas/ETAPA-149-b8f5e662-APOSTILAS-SO-EM-MARKDOWN-MD.md)", "situacao": "Aguardando", "etapas": [{"arquivo": "ETAPA-149-b8f5e662-APOSTILAS-SO-EM-MARKDOWN-MD.md", "texto": "## Etapa 149-b8f5e662 — Apostilas só em Markdown (.md)\n\n**Tarefa:** #2 · **Pedido em:** — (início estimado 2026-09-22) · **Executor:** —\n**Pedido:** Garantir que todas as apostilas estão em formato **Markdown (.md) apenas** — sem PDF/DOCX no momento. Cons tor:** Claude Code (local · main)\n**Pedido:** \"Nas Atividades, deve ser possivel o professor marcar 1 atividade como entregue, em\nhttp://127.0.0.1:5500/MATERIAIS/TECNICO-INFORMATICA-INTERNET/TESTES-DE-FRONTEND/ATIVIDADES/ATIVIDADES-AULA-01-50-QUESTOES.html,\ncrie tasks pra que isso seja feito em todas as materias,mas agora faça apenas na materia listada\nacima\"\n**Objetivo:** o professor consegue marcar como entregue a atividade de um aluno que não clicou em\n\"Entregar\", nas atividades objetivas e práticas. Agora só nas páginas de Testes de Front-End; as\ndemais matérias de todos os cursos de `MATERIAIS/` (menos `AGENDA_COLABORADOR`, que não é curso)\nficam nas tarefas #46 a #79 (etapas 173 a 206), uma por matéria.\n**Próximo passo:** 172.8 — aguardar o aceite do usuário (testar como professor).\n\n### Respostas do usuário (2026-10-14)\n\n1. Botão \"📨 Marcar como entregue\" na tabela \"Respostas dos alunos\", na tentativa atual: **sim**.\n2. Marca mesmo abaixo do mínimo (em branco = errada): **sim**.\n3. Vale para quem nunca abriu (nota 0): **sim**.\n4. Professor pode desfazer: **sim**.\n5. Mostrar \"Entregue pelo professor\" (coluna nova): **sim**.\n6. Liga por `data-marcar-entregue=\"sim\"` no `<body>`: **sim** — \"o botão deve existir em todas as\n   páginas de atividades\" (aqui: as 10 de Testes de Front-End).\n7. Vale também para as práticas: **sim**.\n\n### Escopo\n\n- **Entra (banco):** coluna `entrega_atividade.entregue_por uuid` (nula = o aluno entregou);\n  função `professor_marcar_entregue(p_aluno, p_atividade)` (`security definer`: só professor,\n  só aluno que `professor_pode_ver_aluno`, grava a tentativa atual do aluno sem exigir o mínimo\n  nem o horário, recusa se já entregue); função `professor_desmarcar_entregue(p_aluno,\n  p_atividade)` (apaga só a entrega da tentativa atual feita pelo professor, e só se não houver\n  tentativa nova liberada depois); `resumo_tentativas_atividade` passa a trazer também o aluno\n  entregue sem nenhuma resposta (0 acertos) e o `entregue_por`. Política de INSERT da tabela\n  **não muda** (o aluno continua igual). Seed em `database/` + `SEEDS-APLICADOS.md`.\n- **Entra (tela):** módulo novo `assets/js/marcar-entregue-professor.js` (+ CSS) com o botão\n  \"📨 Marcar como entregue\" / \"↩️ Desfazer entrega\" e a confirmação em popup.\n  - Objetivas: tabela \"Respostas dos alunos\" (`respostas-atividade-professor.js`, só a chamada\n    ao módulo — o arquivo tem 968 linhas): na linha \"Aguardando a entrega\" e na linha do aluno\n    que não respondeu nada; status \"📨 Entregue pelo professor\".\n  - Práticas (discursivas): painel \"Progresso da turma\" (`progresso-turma-global.js`), na\n    situação do aluno não entregue; o painel passa a listar também os alunos das turmas da UC\n    que não começaram (para o caso 3), só quando a página tiver o atributo.\n  - Só aparece com `data-marcar-entregue=\"sim\"` no `<body>` das 10 páginas de\n    `TESTES-DE-FRONTEND/ATIVIDADES/` (5 objetivas e 5 práticas).\n- **Entra (docs):** `docs/database.md` (+ `relatorio_verificacao_database.html`),\n  `docs/regras/atividades.md`, `docs/HISTORICO-REGRAS.md` se mudar regra.\n- **Não entra:** as demais matérias (#46 a #79); mudar a entrega feita pelo aluno.\n\n### Riscos\n\n- A função nova abre escrita do professor em `entrega_atividade`. Plano B: todas as checagens\n  dentro da função (`eh_professor` + `professor_pode_ver_aluno`) e a política da tabela intacta.\n- Mudar o retorno de `resumo_tentativas_atividade` exige `drop function` + `create`. Plano B:\n  seed idempotente aplicado em transação; conferir a tela das objetivas logo depois.\n- Desfazer uma entrega cuja nota já foi lançada (discursiva, \"Finalizar Atividade\"). Plano B: a\n  função de desfazer recusa se já houver nota lançada naquela tentativa.\n- Validação só por leitura, `node --check` e consultas ao banco (sem navegador): o teste na tela\n  fica no aceite do usuário.\n\n| Item | Descrição | Status | Concluído em | Verificação |\n|---- down primeiro, depois HTML, versão 1.1).\n- **Não entra:** outras apostilas já geradas (ITIC, Rio do Sul Mais Tech) — o HTML delas fica como está; ao regerar, o gerador vai exigir tirar os exercícios (pendência no STATUS). `assets/js/apostila.js` e o CSS dos exercícios ficam (as apostilas antigas ainda usam).\n\n### Riscos\n\n| Risco | Plano B |\n|---|---|\n| Conferência com a ementa (`--conferir`) cair abaixo de 100% sem os exercícios | Conferir antes do HTML; se cair, ajustar a teoria (a conferência não lê exercícios nem vídeos) |\n| Regerar outras apostilas falhar | Mensagem clara do gerador; pendência registrada |\n\n### Decisões\n\n| Quando | Decisão | Quem | Por quê |\n|---|---|---|---|\n| 2026-10-14 | Apostila nunca tem exercícios/perguntas/atividades; gerador recusa `## Exercícios` | Usuário | Pedido \"AS APOSTILAS NAO DEVEM TER ATIVIDADES OU PERGUNTAS\" |\n| 2026-10-14 | Testes de Front-End também sem vídeos (`apostila_sem_videos_e_exercicios`) | Usuário | Resposta \"1-B\" |\n\n| Item | Descrição | Status | Concluído em | Verificação |\n|------|-----------|--------|--------------|-------------|\n| 208-9cf63981.0 | Aprovação do usuário (pedido explícito + respostas \"1-B, 2-remova\") | ✅ Concluído | 2026-10-14 10:33 | Mensagens do usuário em 2026-10-14 |\n| 208-9cf63981.1 | Regra: `.claude/rules/apostilas.md`, `docs/regras/apostilas.md`, `docs/HISTORICO-REGRAS.md` | ✅ Concluído | 2026-10-14 10:34 | Regra 2 do fluxo em `apostilas.md` (2386 bytes ≤ 5 KB); `docs/regras/apostilas.md` sem exigência de exercícios; linha no histórico |\n| 208-9cf63981.2 | Gerador: `## Exercícios` proibida; remover leitura/HTML/sumário de exercícios | 🔄 Em progresso | — | — |\n| 208-9cf63981.3 | Testes de Front-End — Markdown: tirar Vídeos e Exercícios dos `CAPITULO-NN.md` e do `APOSTILA-TESTES-DE-FRONTEND.md`, citações na introdução; `materia.json` (opção + versão 1.1) | ⬜ Pendente | — | — |\n| 208-9cf63981.4 | Testes de Front-End — HTML gerado + `STATUS-APOSTILA.md` | ⬜ Pendente | — | — |\n| 208-9cf63981.5 | Aceite do usuário | ⬜ Pendente | — | — |", "proximo": "208-9cf63981.2 — gerador sem exercícios."}], "proximo": "208-9cf63981.2 — gerador sem exercícios."}, {"Tarefa": "#82-70a67f33-08c9-45e6", "Título": "Botão \"Exportar Meu Gabarito\" (aluno, só após entregar): recurso global + Testes de Front-End", "Prioridade": "🟠 Alta", "Depende de": "—", "Status": "✅ Concluído (aceite)", "Em uso por": "—", "Etapa": "[209-70a67f33](etapas/ETAPA-209-70a67f33-EXPORTAR-MEU-GABARITO-TESTES-FRONTEND.md)", "situacao": "Concluída", "etapas": [{"arquivo": "ETAPA-209-70a67f33-EXPORTAR-MEU-GABARITO-TESTES-FRONTEND.md", "texto": "## Etapa 209-70a67f33 — Botão \"Exportar Meu Gabarito\" (aluno): Testes de Front-End\n\n**Tarefa:** #82-70a67f33-08c9-45e6 · **Pedido em:** 2026-10-14 10:44 · **Executor:** Claude Code (local · main)\n**Pedido:** \"DEVE TER UM BOTAO EM TODAS AS ATIVIDADES DE NOME *Exportar Meu Gabarito*, que so habilita quando a atividade ja esta com status=entregue, e este botao deve exportar o gabarito com as respostas do aluno,pra ser postada no Ambiente Virtual dele\" · \"crie 1 task ja em andamento aqui nesta sessao pra materia *TESTES-DE-FRONTEND* , e crie task pra todas as outras materias pra outras IA fazer\" · \"apos o professor liberar os gabaritos,na pagina de atividade do aluno,deve ir marcado SE O ALUNO ACERTOU OU NAO A ATIVIDADE OBJETIVA ,A PRATICA JA FAZ ISSO\" · \"E DEVE MOSTRAR A NOTA DO ALUNO TAMBEM,VEJA SE A NOTA ESTA SENDO MOSTRADA\"\n**Objetivo:** em toda atividade, o aluno tem o botão **\"Exportar Meu Gabarito\"**, habilitado só\ndepois que a atividade dele está entregue, que exporta um PDF com as respostas dele para postar no\nAmbiente Virtual. Esta tarefa cria o recurso global e o liga em Testes de Front-End; as demais\nmatérias ficam nas tarefas #83 em diante. Também: depois que o professor libera os gabaritos da\nturma, a página da **objetiva** do aluno marca em cada questão se ele acertou ou errou (como a\nprática já faz) — recurso global no `atividade.js`, vale para todas as objetivas —, junto com a **nota do aluno**.\n\n### Conferência da nota (leitura do código, 2026-10-14)\n\n- **Objetiva:** a nota já aparece. Depois de entregar, o topo da página mostra o cartão\n  **\"RESULTADO — Sua nota: X (Nª tentativa)\"** com \"N acertos em M questões\" e se atingiu o 7\n  (`mostrarResultadoNoInicio` em `assets/js/respostas-atividade.js`; também no aviso da entrega).\n  Não depende da liberação do gabarito. Falta só o ✅/❌ por questão depois da liberação (209.4b).\n- **Prática/discursiva:** depois da liberação, mostra **\"🎓 Sua nota\"** (`notas_media_final`) e o\n  selo de cada tópico (`assets/js/resultado-aluno-discursiva.js`); antes da correção, \"⏳ Sua nota\n  ainda está aguardando a correção do professor\".\n- O PDF do \"Exportar Meu Gabarito\" deve levar a nota também.\n**Próximo passo:** — (tarefa concluída; demais matérias nas tarefas #83 a #116)\n\n### Respostas do usuário (2026-10-14)\n\n\"1-SÓ RESPOSTAS DO ALUNO, 2-SIM, 3-SIM, 4-SAI COM A MAIOR NOTA,PODE NAO SER A ULTIMA, 5-SIM\" ·\ncorreção da 4: \"NA VERDADE, NA OPCAO 4-SAI COM A ULTIMA,POIS COMO NA LIBERACAO SO LIBERA O QUE ELE\nERROU,NAO TEM COMO ELE FICAR COM NOTA MENOR QUE A TENTATIVA ANTERIOR\"\n\n| Pergunta | Decisão |\n|---|---|\n| 1. O que o PDF leva | Só as respostas do aluno (sem a resposta certa) |\n| 2. Nota e cabeçalho | Sim: nota + nome, turma, matéria, atividade, data e hora da entrega |\n| 3. Tipos | Todos: objetivas, práticas, discursivas e avaliações |\n| 4. Tentativa | A **última entregue** (a nova tentativa só reabre o que ele errou; a nota não cai) |\n| 5. Objetiva após a liberação | Sim: ✅/❌ em cada questão e a alternativa certa nas que ele errou |\n\n### Perguntas ao usuário (antes do plano)\n\n1. O PDF leva **só as respostas do aluno** (o que ele marcou/escreveu) ou também a **resposta\n   certa** de cada questão? (A regra atual proíbe o aluno de ver a resposta certa antes do\n   professor liberar o gabarito da turma.)\n2. Mostra a nota/acertos? Cabeçalho com nome, turma, matéria, atividade e data/hora da entrega?\n3. Vale para objetivas, práticas, discursivas e avaliações (todas as páginas de atividade)?\n4. Com várias tentativas: exporta a última entregue?\n5. Objetiva após a liberação: além de ✅/❌ em cada questão, mostra qual era a alternativa certa\n   nas que ele errou?\n\n### Páginas de Testes de Front-End (em 2026-10-14)\n\n- `MATERIAIS/TECNICO-INFORMATICA-INTERNET/TESTES-DE-FRONTEND/ATIVIDADES/ATIVIDADE-PRATICA-AULA-01.html`\n- `MATERIAIS/TECNICO-INFORMATICA-INTERNET/TESTES-DE-FRONTEND/ATIVIDADES/ATIVIDADE-PRATICA-AULA-02.html`\n- `MATERIAIS/TECNICO-INFORMATICA-INTERNET/TESTES-DE-FRONTEND/ATIVIDADES/ATIVIDADE-PRATICA-AULA-03.html`\n- `MATERIAIS/TECNICO-INFORMATICA-INTERNET/TESTES-DE-FRONTEND/ATIVIDADES/ATIVIDADE-PRATICA-AULA-04.html`\n- `MATERIAIS/TECNICO-INFORMATICA-INTERNET/TESTES-DE-FRONTEND/ATIVIDADES/ATIVIDADE-PRATICA-AULA-05.html`\n- `MATERIAIS/TECNICO-INFORMATICA-INTERNET/TESTES-DE-FRONTEND/ATIVIDADES/ATIVIDADES-AULA-01-50-QUESTOES.html`\n- `MATERIAIS/TECNICO-INFORMATICA-INTERNET/TESTES-DE-FRONTEND/ATIVIDADES/ATIVIDADES-AULA-02-50-QUESTOES.html`\n- `MATERIAIS/TECNICO-INFORMATICA-INTERNET/TESTES-DE-FRONTEND/ATIVIDADES/ATIVIDADES-AULA-03-50-QUESTOES.html`\n- `MATERIAIS/TECNICO-INFORMATICA-INTERNET/TESTES-DE-FRONTEND/ATIVIDADES/ATIVIDADES-AULA-04-50-QUESTOES.html`\n- `MATERIAIS/TECNICO-INFORMATICA-INTERNET/TESTES-DE-FRONTEND/ATIVIDADES/ATIVIDADES-AULA-05-50-QUESTOES.html`\n\n### Escopo\n\n- **Entra:**\n  - Módulo global `assets/js/exportar-meu-gabarito.js` (botão + regra de habilitar) e\n    `assets/js/exportar-meu-gabarito-pdf.js` (monta o PDF, padrão SENAI com jsPDF), + CSS. Ligado\n    pelo atributo `data-exportar-meu-gabarito=\"sim\"` no `<body>`, carregado por\n    `respostas-atividade.js` (objetivas/avaliações objetivas) e `avaliacao-discursiva.js`\n    (práticas/discursivas/avaliação prática), como o `marcar-entregue-professor.js`.\n  - Botão **\"📄 Exportar Meu Gabarito\"** só para o **aluno**; desabilitado (\"Disponível depois de\n    entregar\") até a **última tentativa liberada** estar entregue (`entrega_atividade`).\n  - PDF: cabeçalho (nome, turma, matéria, atividade, tentativa, data e hora da entrega), **nota**\n    (objetiva: `nota_da_tentativa` sobre o mínimo, máx. 10; prática/discursiva: `notas_media_final`\n    ou \"aguardando a correção do professor\") e as **respostas do aluno** da última tentativa\n    entregue (objetiva: questão + alternativa marcada, inclusive as herdadas; discursiva: tópico +\n    texto). ⛔ Sem a resposta certa.\n  - Objetiva depois da liberação dos gabaritos (`aluno_pode_ver_gabarito` → `solicitar_gabarito`):\n    ✅/❌ em cada questão e a alternativa certa nas erradas, **global** em `respostas-atividade.js`\n    (todas as objetivas), mantendo o cartão \"RESULTADO — Sua nota\".\n  - Testes de Front-End: atributo nas 10 páginas (5 objetivas + 5 práticas).\n  - Docs: `docs/regras/atividades.md` e `docs/HISTORICO-REGRAS.md`.\n- **Não entra:** mudança no banco (tudo já existe, ver abaixo); as demais matérias (#83 a #116);\n  o \"Exportar Gabarito\" atual (pedido de gabarito real).\n\n### Banco (consultado em 2026-10-14, sem mudança)\n\n| Precisa | Já existe (RLS: aluno lê só o próprio) |\n|---|---|\n| Respostas por tentativa | `resposta_atividade` (tentativa, herdada) e `resposta_discursiva` (tentativa) |\n| Entregue? | `entrega_atividade` (tentativa, entregue_em) + `tentativa_atual(p_atividade)` |\n| Nota | `nota_da_tentativa(p_atividade, p_tentativa)` e `notas_media_final(p_paginas)` |\n| Gabarito liberado | `aluno_pode_ver_gabarito` (não registra pedido) e `solicitar_gabarito` |\n| Turma | `turmaaluno` + `turma` |\n\n### Riscos\n\n| Risco | Plano B |\n|---|---|\n| PDF levar a resposta certa | O PDF só lê tabelas do próprio aluno; não chama `solicitar_gabarito` |\n| Chamar `solicitar_gabarito` antes da liberação grava pedido em `tentativaacessogabarito` | Checar antes com `aluno_pod d", "texto": "## Etapa 256-5db69b64 — \"Suspeita de Cópia\" nas discursivas (Progresso da Turma + alerta na questão)\n\n**Tarefa:** #129-5db69b64-150d-40d9 · **Pedido em:** 2026-10-14 13:55 · **Executor:** Claude Code (local · main)\n**Pedido:** \"Em progresso da Turma, adicione 1 coluna de nome Suspeita de Copia, onde que a IA, ao corrigir deve comparar com todas as outras respostas dos demais alunos para a mesma resposta e verificar se foi copiado ou nao, assinale la embaixo na questao tambem, com um alerta vermelho na questao toda, piscando e chamando a atencao *SUSPEITA DE COPIA!PROFESSOR PRECISA VALIDAR!*\"\n**Objetivo:** na correção por IA das discursivas, cada resposta é comparada com as dos outros alunos no mesmo item/tópico; a suspeita fica gravada e aparece (1) numa coluna nova **Suspeita de Cópia** no Progresso da Turma e (2) na questão do aluno, com a questão inteira em vermelho piscando: **SUSPEITA DE CÓPIA! PROFESSOR PRECISA VALIDAR!**\n**Próximo passo:** 256.7 — aceite do usuário.\n**Executor (desde 2026-10-14 14:06):** Claude Code (local · main)\n\n**Tarefa grande** (banco + correção por IA + várias partes): plano nesta etapa + aprovação antes de executar.\n\n### Respostas do usuário (2026-10-14 14:06)\n\n1. Só **discursivas**. 2. Só o **professor** vê. 3. Botões **\"Não é cópia\"** e **\"É cópia\"**; **É cópia zera a resposta daquela pergunta**.\n4. Comparar só com alunos da **mesma turma**. 5. Mostrar **com quem parece**; ao passar o mouse, **nome e resposta do outro aluno**.\n\n### Plano\n\n**A. Banco** (`database/2026-10-14-suspeita-copia-discursiva.sql`, idempotente, sem apagar dados)\n- Tabela nova `suspeita_copia_discursiva`: `atividade_id`, `aluno_id`, `tentativa`, `item`, `topico`,\n  `aluno_parecido_id`, `semelhanca` (0 a 1), `motivo` (texto curto da IA, sem nomes),\n  `situacao` (`pendente` · `nao_copia` · `copia`), `detectado_em`, `validado_por`, `validado_em`.\n  Chave: atividade + aluno + tentativa + item + tópico.\n- RLS: **só professor** lê (`eh_professor()` + `professor_pode_ver_aluno`); aluno não lê nada.\n  Ninguém grava direto pelo site.\n- Função `validar_suspeita_copia(atividade, aluno, tentativa, item, topico, e_copia)` (security\n  definer, só professor): grava `situacao`, `validado_por/em`; se **É cópia**, grava\n  `nota_professor = 0` naquele tópico em `correcao_discursiva` (a nota do professor fica travada,\n  regra de 2026-10-08). Se a nota do professor já estava confirmada, a função recusa e avisa.\n- Extensão `pg_trgm` (semelhança de textos) para achar os pares candidatos.\n- `docs/database.md` + `docs/relatorio_verificacao_database.html` atualizados.\n\n**B. IA** (procedimento + rotina da #130)\n- SQL dos candidatos: no mesmo item/tópico, pares de alunos **da mesma turma** com textos\n  parecidos (semelhança ≥ 0,6 e texto com pelo menos ~40 caracteres).\n- A IA lê os dois textos e decide se é **suspeita** (mesmas frases, mesma ordem, mesmos erros) ou\n  coincidência normal (resposta curta/técnica igual à apostila). Suspeita → grava a linha\n  `pendente` (não mexe em linha já validada pelo professor). Sem nomes para a IA (só `aluno_id`).\n- Procedimento escrito em `docs/regras/suspeita-copia-discursiva.md`; a tarefa agendada\n  `correcao-ia-atividade-81` (#130) passa a rodar esse passo depois da correção.\n\n**C. Progresso da Turma** (`progresso-turma-global.js` + `progresso-turma-fontes.js`, módulo novo\n`assets/js/suspeita-copia-discursiva.js` + `assets/css/suspeita-copia.css`)\n- Coluna **Suspeita de Cópia** (só discursivas): `—` ou `⚠️ N` com a lista \"Q03 ≈ <nome do\n  outro aluno>\"; **ao passar o mouse**: nome e resposta do outro aluno. Validada como \"não é\n  cópia\" some; \"é cópia\" fica `❌ Cópia (Q03)`.\n\n**D. Questão do aluno** (`avaliacao-discursiva.js`, ao escolher o aluno no combo)\n- A questão inteira fica com **fundo/borda vermelhos piscando** e o aviso\n  **SUSPEITA DE CÓPIA! PROFESSOR PRECISA VALIDAR!**, com \"Parece com: <nome>\" (mouse: resposta\n  do outro aluno) e os botões **✅ Não é cópia** / **❌ É cópia** (pede confirmação no popup).\n  Depois de validar, o alerta para de piscar (some no \"não é cópia\"; fica \"Cópia confirmada — nota\n  zerada\" no \"é cópia\").\n\n### Não entra\nObjetivas e práticas; o aluno ver a suspeita; zerar sem o professor validar.\n\n### Riscos (plano B)\n- Falso positivo em respostas curtas/iguais à apostila → mínimo de caracteres + a IA lê os dois\n  textos + o professor sempre valida.\n- Nota do professor já confirmada (travada) → \"É cópia\" não consegue zerar: a função avisa e o\n  professor decide (não destravar automaticamente).\n- Arquivos perto do limite (avaliacao-discursiva.js 803 linhas) → lógica nova em módulo próprio.\n\n| Item | Descrição | Status | Concluído em | Verificação |\n|------|-----------|--------|--------------|-------------|\n| 256.1 | Respostas do usuário às perguntas acima | ✅ Concluído | 2026-10-14 14:06 | Registradas em \"Respostas do usuário\" |\n| 256.2 | Plano completo nesta etapa (banco, IA, Progresso, alerta na questão) + aprovação do usuário | ✅ Concluído | 2026-10-14 14:13 | Aprovado pelo usuário: \"SIM, PODE EXECUTAR\" (2026-10-14 14:13) |\n| 256.3 | Banco: tabela `suspeita_copia_discursiva` + RLS (só professor lê) + função `validar_suspeita_copia` + `pg_trgm` (`database/2026-10-14-suspeita-copia-discursiva.sql`, aplicado pelo conector); `docs/database.md` e relatório HTML | ✅ Concluído | 2026-10-14 14:20 | Consulta: RLS ligado, 1 política, anon sem acesso; teste em transação desfeita: professor vê 2, \"é cópia\" zera a nota (0.00), \"não é cópia\" só marca, aluno vê 0; depois do teste, 0 linhas sobrando |\n| 256.4 | IA: `docs/regras/suspeita-copia-discursiva.md` (SQL dos candidatos + como decidir + como gravar); tarefa agendada `correcao-ia-atividade-81` (#130) com a Parte 2 (suspeita); 1ª rodada na 81 | ✅ Concluído | 2026-10-14 14:20 | 119 candidatos (75 com ≥ 90%); a IA leu os 44 abaixo de 90% e descartou os iguais só por dados do enunciado/modelo de ata; **109 suspeitas gravadas** (17 alunos, 20 questões, todas `pendente`) |\n| 256.5 | Progresso da Turma: coluna \"Suspeita de Cópia\" (`progresso-turma-global.js` com colunas extras por tipo; `progresso-turma-fontes.js` passa a `tentativa`; módulo `assets/js/suspeita-copia-discursiva.js` + `assets/css/suspeita-copia.css`) | ✅ Concluído | 2026-10-14 14:20 | `node --check` nos 4 JS; leitura: só discursiva carrega a coluna; dica do mouse com nome e resposta do outro aluno |\n| 256.6 | Questão: alerta vermelho piscando \"SUSPEITA DE CÓPIA! PROFESSOR PRECISA VALIDAR!\" + \"Parece com\" (mouse: resposta) + ✅ Não é cópia / ❌ É cópia (confirmação no popup), ligado no `aoMostrarAluno` de `avaliacao-discursiva.js` | ✅ Concluído | 2026-10-14 14:20 | `node --check`; leitura: sem aluno limpa; depois de validar redesenha e atualiza os botões de nota |\n| 256.7 | Aceite do usuário (abrir a 81 como professor, ver a coluna e validar algumas suspeitas) | 👀 Aguardando o usuário | — | — |", "proximo": "256.7 — aceite do usuário."}], "proximo": "256.7 — aceite do usuário."}, {"Tarefa": "#130-bddd56f9-a423-4f34", "Título": "Correção pela IA agendada da atividade 81 (a cada 30 min)", "Prioridade": "🟡 Média", "Depende de": "—", "Status": "👀 Aguardando aceite", "Em uso por": "—", "Etapa": "[257-bddd56f9](etapas/ETAPA-257-bddd56f9-CORRECAO-IA-AGENDADA-ATIVIDADE-81.md)", "situacao": "Aguardando", "etapas": [{"arquivo": "ETAPA-257-bddd56f9-CORRECAO-IA-AGENDADA-ATIVIDADE-81.md", "texto": "## Etapa 257-bddd56f9 — Correção pela IA agendada da atividade 81 (a cada 30 min)\n\n**Tarefa:** #130-bddd56f9-a423-4f34 · **Pedido em:** 2026-10-14 14:05 · **Executor:** Claude Code (local · main)\n**Pedido:** \"EXISTE 1 TAREFA AGENDADA PRA CORRIGIR ESTA PROVA?\" · \"ATIVIDADE ID=81\" → respostas: \"Agendar correção\", \"A cada 30 minutos\", \"Até eu desligar\"\n**Objetivo:** a nota parcial da IA da discursiva de sexta da ITIC (id 81) se atualiza sozinha: a cada 30 min a IA corrige as alternativas penden
