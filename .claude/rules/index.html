 0, "titulo": "2. Ler, nesta ordem", "tipo": "Obrigatória", "texto": "| Arquivo | Para quê |\n|---------|----------|\n| `CLAUDE.md` → `AGENTS.md` | Regras do projeto (precedência máxima) |\n| `tasks/STATUS.md` | Fonte única: frentes, tarefas em uso, próximo passo |\n| `tasks/RECADOS.md` | Recados de outras frentes para você ou `todas` |\n| `database/SEEDS-APLICADOS.md` | Todo seed CONCLUÍDO antes de tarefa nova (`seeds.md`) |\n| `docs/` e `bugs/` | Orientação do módulo antes de editar (`docs-antes-de-editar.md`) |\n\nSe houver item `🔄`/`⬜` de tarefa aprovada da sua frente: conferir o que já foi feito\n(arquivos e commits) e **continuar de onde parou** — sem refazer `✅` nem pular itens."}, {"arquivo": "essentials.md", "tituloArquivo": "⚡ Essentials — Checklist de início de sessão", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Checklist de início: sincronizar, o que ler, regras que valem sempre", "ordem": 0, "titulo": "3. Regras que valem SEMPRE", "tipo": "Obrigatória", "texto": "| Regra | Arquivo |\n|-------|---------|\n| Toda tarefa vira TASK; pedir detalhes antes de executar | `toda-tarefa-e-task.md` |\n| Tarefa grande = plano em `docs/` + aprovação | `plano-docs.md` |\n| Fim de tarefa = commit + push + quadro atualizado, tudo na `main` | `git-quick.md` |\n| STATUS.md é verdade: o que não está lá não aconteceu | `status-flow.md` |\n| Sem navegador e sem testes automatizados | `testes-validacao.md` |\n| RLS + JWT em toda página e tabela; gabarito nunca sai do banco | `security-banco.md` |\n| Código: SOLID, ≤ 1000 linhas/arquivo, ≤ 45 linhas/função, nomes em PT | `codigo-*.md` |"}, {"arquivo": "essentials.md", "tituloArquivo": "⚡ Essentials — Checklist de início de sessão", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Checklist de início: sincronizar, o que ler, regras que valem sempre", "ordem": 0, "titulo": "4. Checklist", "tipo": "Fluxo", "texto": "```\n☐ Fiz fetch + pull --rebase?\n☐ Li tasks/STATUS.md e retomei de onde parou?\n☐ Seeds todos CONCLUÍDO?\n☐ Li a orientação em docs/ do que vou mexer?\n☐ Sei se a tarefa é pequena ou grande?\n```\n\n---\n\n**Data e hora:** sempre de Brasília. No Windows local use `date` (o relógio já está em Brasília) —\n`TZ=America/Sao_Paulo date` no Git Bash sai em GMT (3 h a mais). Na nuvem: `TZ=America/Sao_Paulo date`."}, {"arquivo": "status-flow.md", "tituloArquivo": "📋 Status Flow — Ciclo de uma TASK", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Ciclo da TASK em `tasks/` (frentes, reserva, encerramento, frase final)", "ordem": 1, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "**Quadro do projeto:** `tasks/STATUS.md` (status oficial) · `tasks/TASKS.md` (descrição longa) ·\n`tasks/etapas/` (itens de cada etapa). Modelo e regras de gestão: `status-modelo.md`."}, {"arquivo": "status-flow.md", "tituloArquivo": "📋 Status Flow — Ciclo de uma TASK", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Ciclo da TASK em `tasks/` (frentes, reserva, encerramento, frase final)", "ordem": 1, "titulo": "🧭 Frentes de trabalho", "tipo": "Obrigatória", "texto": "Cada sessão é uma **frente** com uma linha em \"🧭 Frentes de trabalho\":\n- **Local:** `local · main`\n- **Nuvem:** `nuvem · <nome-da-sessão>` (também trabalha na `main` — ver `git-quick.md`)\n\nAtualize **só a linha da sua frente** ao começar e ao parar. Frente sem pendência → `⏹️ Encerrada`."}, {"arquivo": "status-flow.md", "tituloArquivo": "📋 Status Flow — Ciclo de uma TASK", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Ciclo da TASK em `tasks/` (frentes, reserva, encerramento, frase final)", "ordem": 1, "titulo": "📌 Tarefas em uso", "tipo": "Obrigatória", "texto": "Coluna **\"Em uso por\"**:\n- `—` = livre (pode pegar)\n- `<frente> (desde <data>)` = reservada; ninguém mais mexe até ela voltar a `—`\n\nUma frente reserva **no máximo 1 tarefa por vez** (`multiplas-ias.md`)."}, {"arquivo": "status-flow.md", "tituloArquivo": "📋 Status Flow — Ciclo de uma TASK", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Ciclo da TASK em `tasks/` (frentes, reserva, encerramento, frase final)", "ordem": 1, "titulo": "Ciclo", "tipo": "Fluxo", "texto": "### 1️⃣ Abrir a TASK (antes de executar)\n- `tasks/etapas/ETAPA-NNN-<uuid8>-ASSUNTO.md` com tabela\n  `Item | Descrição | Status | Concluído em | Verificação`\n- Linha em \"📌 Tarefas\" do `STATUS.md` e no índice de etapas\n- Bloco `### #NN-<uuid>: título — pedida em <data hora>` no `TASKS.md`\n- Pedir detalhes ao solicitante (`toda-tarefa-e-task.md`)\n\n### 2️⃣ Executar item por item\n- Item → `🔄` (só **1** em progresso por vez) → trabalhar → verificar → `✅` com data e hora\n- Atualizar o `STATUS.md` **na hora**, não no fim\n\n### 3️⃣ Encerrar\n- `STATUS.md`: tarefa `✅ Concluído` e linha da sua frente atualizada\n- `TASKS.md`: **remover o bloco inteiro** da tarefa concluída\n- Commit + push (`git-quick.md`)\n- Responder **apenas**: **TAREFA FINALIZADA!, AJUDO EM ALGO MAIS?**\n  (sem resumo nem tabela; perguntas e bloqueios são respondidos normalmente)"}, {"arquivo": "status-flow.md", "tituloArquivo": "📋 Status Flow — Ciclo de uma TASK", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Ciclo da TASK em `tasks/` (frentes, reserva, encerramento, frase final)", "ordem": 1, "titulo": "Legenda", "tipo": "Obrigatória", "texto": "⬜ Pendente · 🔄 Em progresso · ✅ Concluído · ⛔ Bloqueado (com motivo e o que destrava) ·\n👀 Aguardando o usuário"}, {"arquivo": "status-flow.md", "tituloArquivo": "📋 Status Flow — Ciclo de uma TASK", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Ciclo da TASK em `tasks/` (frentes, reserva, encerramento, frase final)", "ordem": 1, "titulo": "⚡ Próximo passo", "tipo": "Fluxo", "texto": "Sempre o **item exato** (`Etapa 42, item 42.3 — gerar seed da objetiva`).\nÉ a última coisa a atualizar ao parar e a primeira a ler ao retomar."}, {"arquivo": "toda-tarefa-e-task.md", "tituloArquivo": "🎫 Toda Tarefa é uma TASK — e a IA Pede Detalhes", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Toda tarefa vira TASK; pedir detalhes ao solicitante", "ordem": 2, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "**Registrada em 2026-10-13 a pedido do usuário.**"}, {"arquivo": "toda-tarefa-e-task.md", "tituloArquivo": "🎫 Toda Tarefa é uma TASK — e a IA Pede Detalhes", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Toda tarefa vira TASK; pedir detalhes ao solicitante", "ordem": 2, "titulo": "A Regra", "tipo": "Obrigatória", "texto": "Toda tarefa pedida à IA **vira uma TASK** (etapa em `tasks/etapas/` + linha em `tasks/STATUS.md`\n+ bloco em `tasks/TASKS.md`, conforme `status-flow.md`). Antes de executar, a IA **pede detalhes\nao solicitante da task**."}, {"arquivo": "toda-tarefa-e-task.md", "tituloArquivo": "🎫 Toda Tarefa é uma TASK — e a IA Pede Detalhes", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Toda tarefa vira TASK; pedir detalhes ao solicitante", "ordem": 2, "titulo": "Fluxo", "tipo": "Fluxo", "texto": "1. **Receber o pedido** — não executar de imediato.\n2. **Abrir a TASK** — criar a etapa e a linha no `STATUS.md` (⬜ Pendente).\n3. **Pedir detalhes ao solicitante** — perguntar o que falta para executar certo:\n   - Objetivo e resultado esperado\n   - Escopo (o que entra e o que não entra)\n   - Matéria, curso, turma ou arquivos envolvidos\n   - Critério de pronto (como saber que terminou)\n   - Prazo ou prioridade, se houver\n4. **Aguardar as respostas** — só então registrar os itens e executar.\n5. **Executar item por item** e fechar a TASK (ver `status-flow.md`)."}, {"arquivo": "toda-tarefa-e-task.md", "tituloArquivo": "🎫 Toda Tarefa é uma TASK — e a IA Pede Detalhes", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Toda tarefa vira TASK; pedir detalhes ao solicitante", "ordem": 2, "titulo": "Boas Práticas", "tipo": "Obrigatória", "texto": "- ✅ Perguntas objetivas, agrupadas numa única mensagem.\n- ✅ Não perguntar o que já está no pedido, no `STATUS.md` ou no código.\n- ✅ Se o pedido já vier completo, confirmar o entendimento em uma frase e seguir.\n- ❌ Não assumir detalhes críticos em silêncio.\n- ❌ Não executar antes de a TASK estar aberta.\n\n---\n\n**Ver também:** `status-flow.md`, `essentials.md`"}, {"arquivo": "git-quick.md", "tituloArquivo": "🔀 Git Quick — Commit e push", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Commit + push por tarefa na `main`; o que é proibido", "ordem": 3, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "**Regra (2026-10-13):** ao concluir **cada tarefa** = **1 commit + push + quadro atualizado**\n(`tasks/STATUS.md` e `tasks/TASKS.md`). Vale para **local e nuvem**, sempre na **`main`**\n(`multiplas-ias.md`)."}, {"arquivo": "git-quick.md", "tituloArquivo": "🔀 Git Quick — Commit e push", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Commit + push por tarefa na `main`; o que é proibido", "ordem": 3, "titulo": "Fluxo", "tipo": "Fluxo", "texto": "```bash\ngit fetch --all --prune\ngit pull --rebase origin main\ngit add <caminho1> <caminho2>        # só os arquivos da tarefa + quadro\ngit diff --cached --name-only        # conferir o que vai no commit\ngit commit -m \"feat(tema): descrição\n\nCo-Authored-By: <modelo em uso> <noreply@anthropic.com>\"\ngit push origin main\n```\n\n- Push recusado porque o remoto andou → `fetch` + `pull --rebase` + reler o quadro + push de novo.\n- Usuário pede \"faça commit agora\" → commitar na hora, mesmo no meio da tarefa.\n- Usuário diz \"só commit, sem push\" → respeitar.\n- Executar os comandos de git **direto, sem perguntar**."}, {"arquivo": "git-quick.md", "tituloArquivo": "🔀 Git Quick — Commit e push", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Commit + push por tarefa na `main`; o que é proibido", "ordem": 3, "titulo": "Proibido", "tipo": "Proibição", "texto": "- ⛔ `git add .` (arrasta `__pycache__`, gabaritos, listas de alunos)\n- ⛔ `git push --force`\n- ⛔ `git pull` sem `--rebase` (gera merge) e `git merge`\n- ⛔ `git worktree` e branches paralelas\n- ⛔ `git status` repetido entre comandos ou depois do commit (o git já avisa erros)\n- ⛔ Várias tarefas num commit só, ou tarefa concluída sem commit\n- ⛔ Commit/push de tarefa incompleta ou falhando"}, {"arquivo": "git-quick.md", "tituloArquivo": "🔀 Git Quick — Commit e push", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Commit + push por tarefa na `main`; o que é proibido", "ordem": 3, "titulo": "Nunca publicar", "tipo": "Proibição", "texto": "- ❌ Gabarito e questões de atividade (ficam só no banco)\n- ❌ Listas de alunos e dados pessoais\n- ❌ `.env`, chaves e tokens\n- ✅ Markdown, JavaScript, schema SQL — respeitando o `.gitignore`"}, {"arquivo": "git-quick.md", "tituloArquivo": "🔀 Git Quick — Commit e push", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Commit + push por tarefa na `main`; o que é proibido", "ordem": 3, "titulo": "Mensagens", "tipo": "Obrigatória", "texto": "```\nfeat(materias): gerar atividades de ITIC\nfix(banco): corrigir RLS de professor\ndocs(regras): reestruturar .claude/rules\n```"}, {"arquivo": "plano-docs.md", "tituloArquivo": "📝 Plano em `docs/` — tarefa grande × pequena", "categoria": "🟠 Planejar e coordenar", "assunto": "Tarefa pequena × grande; plano em `docs/` e aprovação", "ordem": 4, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Skill de apoio: `.claude/skills/documentacao-padrao/SKILL.md`."}, {"arquivo": "plano-docs.md", "tituloArquivo": "📝 Plano em `docs/` — tarefa grande × pequena", "categoria": "🟠 Planejar e coordenar", "assunto": "Tarefa pequena × grande; plano em `docs/` e aprovação", "ordem": 4, "titulo": "Pequena ou grande?", "tipo": "Obrigatória", "texto": "| Tipo | Definição | Exige |\n|------|-----------|-------|\n| **Pequena** | Ajuste pontual em até ~3 arquivos, sem nenhum ponto da linha abaixo | Só a TASK no `tasks/STATUS.md` + commit |\n| **Grande** | Mexe em **banco** (SQL, schema, trigger, função, migração), **segurança** (auth, papéis, RLS, chaves), tem **várias partes**, cria estrutura/gerador novo, faz **mudança em massa** ou **apaga dados** | Plano em `docs/` + **aprovação explícita** antes de executar |\n\nNa dúvida, trate como grande."}, {"arquivo": "plano-docs.md", "tituloArquivo": "📝 Plano em `docs/` — tarefa grande × pequena", "categoria": "🟠 Planejar e coordenar", "assunto": "Tarefa pequena × grande; plano em `docs/` e aprovação", "ordem": 4, "titulo": "Fluxo da tarefa grande", "tipo": "Fluxo", "texto": "1. Criar `docs/<nome-em-kebab-case>.md` **antes** de qualquer mudança (se `docs/` não existir,\n   pedir autorização para criá-la).\n2. Mostrar ao usuário um resumo: passos, arquivos afetados, riscos e verificações.\n3. **Perguntar se está correto** e aguardar um \"sim\" claro.\n4. Executar **só o escopo aprovado**, atualizando os passos na hora (`⬜ 🔄 ✅ ⛔`).\n5. Ao terminar: resultado, pendências, commit e tempo decorrido no plano.\n\nMudança material de escopo → atualizar o plano e pedir **nova** aprovação.\nCommit e atualização do `STATUS.md` são feitos sem perguntar."}, {"arquivo": "plano-docs.md", "tituloArquivo": "📝 Plano em `docs/` — tarefa grande × pequena", "categoria": "🟠 Planejar e coordenar", "assunto": "Tarefa pequena × grande; plano em `docs/` e aprovação", "ordem": 4, "titulo": "Conteúdo mínimo do plano", "tipo": "Obrigatória", "texto": "```markdown\n\n\n**Criado em:** AAAA-MM-DD HH:MM · **Executor:** <IA> · **Tarefa:** #NN / Etapa NNN\n**Status geral:** ⬜ Planejado | 🔄 Em progresso | ✅ Concluído\n\n## Objetivo        (1 frase: o que e por quê)\n## Escopo          (entra / não entra; arquivos, tecnologias, dependências)\n## Passos\n| # | Ação | Arquivos (caminho exato) | Verificação | Status |\n## Riscos\n| Risco | Chance | Plano B |\n## Conclusão       (resultado, pendências, commit, tempo decorrido)\n```\n\n- A **verificação** é sempre por leitura, `node --check`, consulta ao banco ou terminal — nunca\n  navegador nem teste automatizado (`testes-validacao.md`).\n- Citar o plano na etapa (`tasks/etapas/…`) e no bloco do `TASKS.md`; o plano vai no **mesmo\n  commit** da entrega, nunca sozinho depois.\n- Bug: o plano pode ficar em `bugs/bug-<nome>.md`, no mesmo formato."}, {"arquivo": "status-modelo.md", "tituloArquivo": "🗂️ Modelo do STATUS.md e regras de gestão", "categoria": "🟠 Planejar e coordenar", "assunto": "Modelo do `STATUS.md` e regras de gestão", "ordem": 5, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Vale para qualquer tarefa (código, apostila, slides, banco, pequena ou grande). Objetivo: qualquer\npessoa ou IA retoma pelo arquivo, sem depender de memória. Fluxo do dia a dia: `status-flow.md`."}, {"arquivo": "status-modelo.md", "tituloArquivo": "🗂️ Modelo do STATUS.md e regras de gestão", "categoria": "🟠 Planejar e coordenar", "assunto": "Modelo do `STATUS.md` e regras de gestão", "ordem": 5, "titulo": "Regras de gestão", "tipo": "Obrigatória", "texto": "| Fase | Regra |\n|------|-------|\n| Início | Objetivo em 1 frase · escopo (entra / não entra) · critério de pronto · partes interessadas · premissas e restrições |\n| Planejamento | Etapas e itens pequenos (horas, não semanas) · ordem e dependências · riscos com plano B · plano aprovado antes de executar |\n| Execução | Status na hora · 1 item por vez · bloqueio informado na hora · mudança de escopo = nova aprovação · cada item com verificação |\n| Comunicação | Fonte única (links para plano, regras e entregável) · registro de decisões (o quê, quando, quem, por quê) · linguagem simples |\n| Continuidade | Próximo passo sempre atualizado · commit por tarefa · histórico nunca apagado (só se acrescentam etapas) |\n| Encerramento | Aceite formal de quem pediu · pendências documentadas · lições aprendidas |\n\n⭐ **Regra de ouro:** planejar → aprovar → executar 1 item por vez → registrar na hora → entregar."}, {"arquivo": "status-modelo.md", "tituloArquivo": "🗂️ Modelo do STATUS.md e regras de gestão", "categoria": "🟠 Planejar e coordenar", "assunto": "Modelo do `STATUS.md` e regras de gestão", "ordem": 5, "titulo": "Modelo", "tipo": "Referência", "texto": "```markdown\n\n\n**Objetivo:** <1 frase: o que e por quê>\n**Partes interessadas:** <quem decide / aprova / usa>\n**Links:** [Regras](CLAUDE.md) · [Planos](docs/) · <entregável>\n**Próximo passo:** <item exato a executar agora>\n\nLegenda: ⬜ Pendente · 🔄 Em progresso · ✅ Concluído · ⛔ Bloqueado\n\n## Escopo\n- **Entra:** … · **Não entra:** …\n- **Critério de pronto:** … · **Premissas e restrições:** …\n\n## Etapa N — <nome> (aprovada em AAAA-MM-DD)\n| Item | Descrição | Status | Concluído em | Verificação |\n|------|-----------|--------|--------------|-------------|\n| N.1 | … | ⬜ Pendente | — | <como foi conferido> |\n| N.x | Aceite do usuário | ⬜ Pendente | — | — |\n\n## Riscos\n| Risco | Chance | Impacto | Plano B | Situação |\n\n## Bloqueios\n| Data | Item | Motivo | O que destrava | Resolvido em |\n\n## Registro de decisões\n| Data | Decisão | Quem | Por quê |\n\n## Pendências (ficou para depois)\n| Item | Motivo | Quando retomar |\n\n## Lições aprendidas\n| Data | O que aconteceu | Lição / nova regra |\n```\n\n- Seções sem conteúdo ficam com a tabela vazia (não apagar o cabeçalho).\n- `STATUS.md` antigo: migrar para o modelo **sem apagar** o histórico."}, {"arquivo": "docs-antes-de-editar.md", "tituloArquivo": "📚 Ler a orientação em `docs/` antes de editar", "categoria": "🟠 Planejar e coordenar", "assunto": "Ler `docs/ORIENTACAO_*` antes de mexer em um arquivo", "ordem": 6, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "**Antes de modificar qualquer arquivo** (principalmente JavaScript), procure a orientação dele em\n`docs/` e leia por completo. Se não houver orientação, **avise o usuário**."}, {"arquivo": "docs-antes-de-editar.md", "tituloArquivo": "📚 Ler a orientação em `docs/` antes de editar", "categoria": "🟠 Planejar e coordenar", "assunto": "Ler `docs/ORIENTACAO_*` antes de mexer em um arquivo", "ordem": 6, "titulo": "Onde procurar", "tipo": "Referência", "texto": "| Vai mexer em | Leia antes |\n|--------------|-----------|\n| `<arquivo>.js` | `docs/ORIENTACAO_JS_<ARQUIVO>.md` |\n| `index.html` | `docs/ORIENTACAO_INDEX.md` |\n| Login / autenticação ⚠️ | `docs/ORIENTACAO_JS_LOGIN.md` e `docs/ORIENTACAO_USUARIO.md` |\n| Supabase (queries, headers, RLS, JWT) ⚠️ | `docs/ORIENTACAO_JS_SUPABASE.md` |\n| Banco de dados | `docs/database.md` (manter `docs/relatorio_verificacao_database.html` sincronizado) |\n| Bug já identificado | `bugs/bug-<nome>.md` (plano de resolução) |\n| Regras detalhadas por tema | `docs/regras/` (`materias.md`, `atividades.md`, `apostilas.md`, `codigo.md`…) |"}, {"arquivo": "docs-antes-de-editar.md", "tituloArquivo": "📚 Ler a orientação em `docs/` antes de editar", "categoria": "🟠 Planejar e coordenar", "assunto": "Ler `docs/ORIENTACAO_*` antes de mexer em um arquivo", "ordem": 6, "titulo": "Checklist", "tipo": "Fluxo", "texto": "```\n☐ Identifiquei o arquivo a modificar\n☐ Achei a orientação correspondente (ou avisei que não existe)\n☐ Li a orientação inteira e apliquei as regras dela\n```\n\nSem ler a orientação, é fácil violar regras críticas (RLS, JWT, segurança)."}, {"arquivo": "multiplas-ias.md", "tituloArquivo": "🤖 Várias IAs e frentes ao mesmo tempo", "categoria": "🟠 Planejar e coordenar", "assunto": "Várias IAs/frentes: fonte única, só `main`, reserva, prioridade, banco só local", "ordem": 7, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Vale para **todas as IAs** (Claude, Gemini, Grok, Copilot, Devin, Antigravity…) e todas as frentes\n(local e nuvem). O quadro é o `tasks/STATUS.md` (`status-flow.md`)."}, {"arquivo": "multiplas-ias.md", "tituloArquivo": "🤖 Várias IAs e frentes ao mesmo tempo", "categoria": "🟠 Planejar e coordenar", "assunto": "Várias IAs/frentes: fonte única, só `main`, reserva, prioridade, banco só local", "ordem": 7, "titulo": "1. Fonte única das regras", "tipo": "Obrigatória", "texto": "- Toda regra nova vai para o **`AGENTS.md`** ou para um arquivo em `.claude/rules/` listado no\n  `INDEX.md`. \"Salvar no `CLAUDE.md`\" = salvar no `AGENTS.md`.\n- Arquivos de uma IA só (`CLAUDE.md`, `GEMINI.md`, `.cursorrules`…) apenas apontam para o\n  `AGENTS.md`; não guardam regras próprias."}, {"arquivo": "multiplas-ias.md", "tituloArquivo": "🤖 Várias IAs e frentes ao mesmo tempo", "categoria": "🟠 Planejar e coordenar", "assunto": "Várias IAs/frentes: fonte única, só `main`, reserva, prioridade, banco só local", "ordem": 7, "titulo": "2. Tudo na `main`", "tipo": "Obrigatória", "texto": "- Trabalho, quadro e documentação vão direto para a `main` — também nas sessões de nuvem, mesmo que\n  a ferramenta indique outra branch. ⛔ Sem branches paralelas e sem PR para entregar tarefa.\n- Se o push para a `main` for recusado por permissão: **pare e avise o usuário**; não publique em\n  outra branch como alternativa."}, {"arquivo": "multiplas-ias.md", "tituloArquivo": "🤖 Várias IAs e frentes ao mesmo tempo", "categoria": "🟠 Planejar e coordenar", "assunto": "Várias IAs/frentes: fonte única, só `main`, reserva, prioridade, banco só local", "ordem": 7, "titulo": "3. Pegar uma tarefa (reserva)", "tipo": "Obrigatória", "texto": "1. `git fetch --all --prune` + `git pull --rebase origin main`; só então ler o `tasks/STATUS.md`.\n2. Escolher uma tarefa com **\"Em uso por\" = `—`** e **todas as dependências concluídas**.\n3. Entre as livres, a de **maior prioridade** (🔴 Máxima → 🟠 Alta → 🟡 Média → 🟢 Baixa);\n   empate = ordem do quadro. Baixa só com orientação explícita do usuário.\n4. Gravar `<frente> (desde <data hora>)` em \"Em uso por\", **commit + push imediatos**, e só então\n   começar o trabalho.\n5. Push da reserva recusado → `fetch` + `pull --rebase`, **reler** o quadro; se outra frente pegou\n   a mesma tarefa, desfazer a sua reserva e escolher outra."}, {"arquivo": "multiplas-ias.md", "tituloArquivo": "🤖 Várias IAs e frentes ao mesmo tempo", "categoria": "🟠 Planejar e coordenar", "assunto": "Várias IAs/frentes: fonte única, só `main`, reserva, prioridade, banco só local", "ordem": 7, "titulo": "4. Limites", "tipo": "Obrigatória", "texto": "- **1 tarefa reservada por frente.** Só pega a próxima depois de entregar ou liberar a atual.\n- ⛔ Nunca mexer na reserva, na linha de frente ou no bloco de outra frente. Reserva \"parada\" não\n  é abandonada: quem libera é **o usuário**.\n- Tarefa grande demais → dividir em itens/sub-tarefas menores antes de codificar (cada uma com\n  dependências e prioridade declaradas; herda a prioridade da mãe ou Média).\n- A prioridade é definida **pelo usuário**; a IA não muda a de itens existentes sem pedido."}, {"arquivo": "multiplas-ias.md", "tituloArquivo": "🤖 Várias IAs e frentes ao mesmo tempo", "categoria": "🟠 Planejar e coordenar", "assunto": "Várias IAs/frentes: fonte única, só `main`, reserva, prioridade, banco só local", "ordem": 7, "titulo": "5. Identificar a IA", "tipo": "Obrigatória", "texto": "O nome da IA/frente aparece na reserva (\"Em uso por\"), na linha de frente, nas anotações da etapa\ne nas mensagens de commit (ex.: `feat(materias): ... por Claude Code (local · main)`)."}, {"arquivo": "multiplas-ias.md", "tituloArquivo": "🤖 Várias IAs e frentes ao mesmo tempo", "categoria": "🟠 Planejar e coordenar", "assunto": "Várias IAs/frentes: fonte única, só `main`, reserva, prioridade, banco só local", "ordem": 7, "titulo": "6. Banco de dados: só o Claude Code local", "tipo": "Obrigatória", "texto": "- Só o **Claude Code local** (máquina do usuário, com o MCP do Supabase) pega tarefa de banco:\n  SQL, schema, trigger, função, RLS, migração, seeds, consultas e validação contra o banco real.\n- ⛔ Sessões de nuvem e outras IAs não pegam essas tarefas; se houver parte sem banco\n  (frontend, documentação), ela vira item separado.\n- Mudança em banco de produção continua exigindo autorização do usuário (exceto o ciclo de seeds\n  já autorizado em `seeds.md`)."}, {"arquivo": "multiplas-ias.md", "tituloArquivo": "🤖 Várias IAs e frentes ao mesmo tempo", "categoria": "🟠 Planejar e coordenar", "assunto": "Várias IAs/frentes: fonte única, só `main`, reserva, prioridade, banco só local", "ordem": 7, "titulo": "7. Scripts temporários", "tipo": "Obrigatória", "texto": "Cada IA guarda scripts auxiliares na **própria pasta de trabalho** (ou scratchpad da sessão), nunca\nem `/tmp` compartilhado."}, {"arquivo": "codigo-solid.md", "tituloArquivo": "🧱 Código — Princípios SOLID", "categoria": "🟡 Código e validação", "assunto": "SOLID e aplicação em JS, Python, HTML e CSS", "ordem": 8, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Todo arquivo de programação criado ou modificado (JavaScript, Python, HTML, CSS…) aplica SOLID,\nde forma **pragmática**: sem abstração desnecessária em script pequeno. Em código existente, seguir\no padrão do projeto e aplicar SOLID nas partes criadas ou alteradas.\nLimites, nomes e legibilidade: `codigo-limites-nomes.md`."}, {"arquivo": "codigo-solid.md", "tituloArquivo": "🧱 Código — Princípios SOLID", "categoria": "🟡 Código e validação", "assunto": "SOLID e aplicação em JS, Python, HTML e CSS", "ordem": 8, "titulo": "Os 5 princípios", "tipo": "Obrigatória", "texto": "| Letra | Princípio | Regra prática |\n|-------|-----------|---------------|\n| **S** | Single Responsibility | Cada função/classe/módulo/arquivo tem **uma** responsabilidade |\n| **O** | Open/Closed | Estender sem modificar: mapas de estratégia, composição — não `if/else` crescente |\n| **L** | Liskov Substitution | Implementações substituem a base sem quebrar o contrato |\n| **I** | Interface Segregation | Módulos pequenos e específicos; ninguém depende do que não usa |\n| **D** | Dependency Inversion | Depender de abstrações; **injetar** cliente de banco, API, storage |"}, {"arquivo": "codigo-solid.md", "tituloArquivo": "🧱 Código — Princípios SOLID", "categoria": "🟡 Código e validação", "assunto": "SOLID e aplicação em JS, Python, HTML e CSS", "ordem": 8, "titulo": "Por tecnologia", "tipo": "Obrigatória", "texto": "**JavaScript / Python**\n- ✅ Separar regra de negócio, acesso a dados (repository/service) e UI/DOM\n- ✅ Injetar dependências por construtor ou parâmetro (cliente Supabase, `fetch`, repositório)\n- ✅ Trocar cadeias de `if/switch` por tipo por mapas de estratégia ou polimorfismo\n- ✅ Um arquivo por responsabilidade (`aula.service.js`, `aula.repository.js`, `aula.view.js`)\n- ✅ Python: `abc.ABC`/`Protocol` quando houver mais de uma implementação\n- ❌ Arquivo \"faz-tudo\" (validação + banco + DOM + formatação juntos)\n\n**HTML**\n- ✅ Estrutura semântica (`header`, `main`, `section`, `article`, `nav`, `footer`)\n- ✅ Sem `style=\"\"` e sem JavaScript inline (`onclick`)\n- ✅ Blocos reutilizáveis e independentes\n\n**CSS**\n- ✅ Classes de responsabilidade única (layout ≠ tema ≠ componente ≠ utilitário)\n- ✅ Estender por modificador (BEM: `.cartao--destaque`) em vez de editar a classe base\n- ✅ Tokens em `:root { --cor-primaria }`; componentes usam tokens, não valores fixos\n- ❌ Seletores acoplados à estrutura (`div > ul > li > a`) e `!important` desnecessário"}, {"arquivo": "codigo-solid.md", "tituloArquivo": "🧱 Código — Princípios SOLID", "categoria": "🟡 Código e validação", "assunto": "SOLID e aplicação em JS, Python, HTML e CSS", "ordem": 8, "titulo": "Checklist SOLID", "tipo": "Fluxo", "texto": "```\n☐ Cada função/classe/arquivo tem uma única responsabilidade?\n☐ Dá para adicionar um caso novo sem alterar código existente?\n☐ Implementações podem ser trocadas sem quebrar quem as usa?\n☐ Módulos enxutos?\n☐ Dependências externas injetadas, não instanciadas no meio da lógica?\n☐ HTML, CSS e JS separados?\n```"}, {"arquivo": "codigo-limites-nomes.md", "tituloArquivo": "📏 Código — Limites, nomes e legibilidade", "categoria": "🟡 Código e validação", "assunto": "Limites (arquivo, função, linha), nomes em português, legibilidade", "ordem": 9, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Complementa `codigo-solid.md`. Vale para todas as linguagens."}, {"arquivo": "codigo-limites-nomes.md", "tituloArquivo": "📏 Código — Limites, nomes e legibilidade", "categoria": "🟡 Código e validação", "assunto": "Limites (arquivo, função, linha), nomes em português, legibilidade", "ordem": 9, "titulo": "Limites obrigatórios", "tipo": "Obrigatória", "texto": "| Regra | Exigência |\n|-------|-----------|\n| Arquivo | Máx. **1000 linhas** — passou, dividir por responsabilidade |\n| Função | Máx. **45 linhas** — passou, extrair funções menores |\n| Parâmetros | Máx. **3** — acima disso, receber um objeto (`criarAula({ titulo, data, turma })`) |\n| Aninhamento | Máx. **2 níveis** de `if`/`for`/`while` — usar return early ou extrair função |\n| Linha | Máx. **100 caracteres** |\n| Documentação | **Toda função** com JSDoc/docstring: objetivo, parâmetros, retorno, exceções |\n| Constantes | Valores fixos (URLs, tabelas, mensagens, limites, chaves, cores) no **arquivo único de constantes** (`constants.js`, `constants.py`, `:root` no CSS) |\n| Formatação | JS/HTML/CSS: Prettier + ESLint · Python: Black + Ruff (seguir a config do projeto) |"}, {"arquivo": "codigo-limites-nomes.md", "tituloArquivo": "📏 Código — Limites, nomes e legibilidade", "categoria": "🟡 Código e validação", "assunto": "Limites (arquivo, função, linha), nomes em português, legibilidade", "ordem": 9, "titulo": "Legibilidade", "tipo": "Obrigatória", "texto": "- **Return early:** validações e erros no início da função.\n- **Condições nomeadas:** `const podeInscrever = idade >= 16 && matriculado;`\n- **Sem abreviações:** `quantidade`, não `qtd` (exceto `i`, `j` de laço).\n- **Sem ternário aninhado** (`a ? b : c ? d : e`) — usar `if` com return ou mapa.\n- **Comentários** explicam o porquê; sem código comentado ou morto (o Git guarda o histórico).\n- `const` por padrão, `let` só se reatribuir, **nunca `var`**; funções puras quando possível.\n- `async/await` em vez de `.then()`; erros com `try/catch` consistente.\n- Ordem no arquivo: imports → constantes → auxiliares → principais → inicialização/export."}, {"arquivo": "codigo-limites-nomes.md", "tituloArquivo": "📏 Código — Limites, nomes e legibilidade", "categoria": "🟡 Código e validação", "assunto": "Limites (arquivo, função, linha), nomes em português, legibilidade", "ordem": 9, "titulo": "Nomes em português (sem acentos)", "tipo": "Obrigatória", "texto": "| Elemento | JavaScript | Python | CSS |\n|----------|-----------|--------|-----|\n| Variável | `totalAlunos` | `total_alunos` | — |\n| Função | `buscarAulas()` | `buscar_aulas()` | — |\n| Classe | `AulaRepositorio` | `AulaRepositorio` | `.lista-aulas` |\n| Constante | `LIMITE_ALUNOS` | `LIMITE_ALUNOS` | `--cor-destaque` |\n| Booleano | `estaAtivo`, `temNota`, `podeEditar` | `esta_ativo` | — |\n\nEm inglês só: palavras reservadas, APIs/bibliotecas (`fetch`, `querySelector`), colunas e tabelas\njá existentes no banco e padrões consolidados do projeto. ❌ Não misturar (`getAlunos`, `userNome`)."}, {"arquivo": "codigo-limites-nomes.md", "tituloArquivo": "📏 Código — Limites, nomes e legibilidade", "categoria": "🟡 Código e validação", "assunto": "Limites (arquivo, função, linha), nomes em português, legibilidade", "ordem": 9, "titulo": "Exemplo", "tipo": "Referência", "texto": "```js\n/**\n * Retorna a situação do aluno conforme a nota final.\n * @param {{matriculado: boolean, bloqueado: boolean, nota: number}} aluno\n * @returns {string|null} Situação, ou null se não puder ser avaliado.\n */\nfunction obterSituacao(aluno) {\n  if (!aluno) return null;\n\n  const podeSerAvaliado = aluno.matriculado && !aluno.bloqueado;\n  if (!podeSerAvaliado) return null;\n\n  if (aluno.nota >= NOTA_MINIMA_APROVACAO) return SITUACAO_APROVADO;\n  if (aluno.nota >= NOTA_MINIMA_RECUPERACAO) return SITUACAO_RECUPERACAO;\n  return SITUACAO_REPROVADO;\n}\n```"}, {"arquivo": "codigo-limites-nomes.md", "tituloArquivo": "📏 Código — Limites, nomes e legibilidade", "categoria": "🟡 Código e validação", "assunto": "Limites (arquivo, função, linha), nomes em português, legibilidade", "ordem": 9, "titulo": "Checklist", "tipo": "Fluxo", "texto": "```\n☐ Arquivo ≤ 1000 linhas, função ≤ 45, linha ≤ 100?\n☐ Toda função documentada?\n☐ Return early, ≤ 3 parâmetros, ≤ 2 níveis de aninhamento?\n☐ Sem número/string mágica fora do arquivo de constantes?\n☐ Nomes em português, sem abreviação e sem ternário aninhado?\n☐ const/let, async/await, formatado pelo Prettier/ESLint ou Black/Ruff?\n```"}, {"arquivo": "testes-validacao.md", "tituloArquivo": "🧪 Testes e validação", "categoria": "🟡 Código e validação", "assunto": "Nunca abrir navegador; nunca escrever testes (exceto bug)", "ordem": 10, "titulo": "🚫 Nunca abrir navegador (2026-09-30)", "tipo": "Proibição", "texto": "- ⛔ Nada de Browser pane/preview (`preview_start`, `navigate`, `screenshot`…), computer-use,\n  Playwright, Puppeteer, `start chrome`/`Start-Process` de páginas.\n- ⛔ Não iniciar servidor de desenvolvimento para validar.\n- ✅ Validar só por **leitura do código**, `node --check`, **consultas ao banco** e terminal.\n- Vale mesmo quando o ambiente sugerir \"verificar no navegador\". Se algo só puder ser confirmado\n  no navegador, **avisar o usuário** para testar."}, {"arquivo": "testes-validacao.md", "tituloArquivo": "🧪 Testes e validação", "categoria": "🟡 Código e validação", "assunto": "Nunca abrir navegador; nunca escrever testes (exceto bug)", "ordem": 10, "titulo": "🚨 Nunca escrever testes automatizados", "tipo": "Proibição", "texto": "Regra **permanente**. Única exceção: a tarefa é **corrigir um bug** (aí um teste que reproduza a\nfalha é bem-vindo).\n\n- ❌ Criar `*.test.js`, `*.spec.js`, `test_*.py` ou equivalentes\n- ❌ \"Escrever testes\" como passo de plano\n- ❌ Testes \"de brinde\" junto com uma feature\n- ❌ Seguir skills de TDD que mandem testar antes\n- Vale mesmo que o repositório já tenha suíte configurada."}, {"arquivo": "testes-validacao.md", "tituloArquivo": "🧪 Testes e validação", "categoria": "🟡 Código e validação", "assunto": "Nunca abrir navegador; nunca escrever testes (exceto bug)", "ordem": 10, "titulo": "Quando rodar testes existentes", "tipo": "Obrigatória", "texto": "Só se houver erro específico a verificar, o usuário pedir, ou para diagnosticar um bug.\nNão rodar só para \"validar visualmente\"."}, {"arquivo": "security-banco.md", "tituloArquivo": "🔐 Security & Banco — RLS, JWT, Gabarito", "categoria": "🟢 Banco e segurança", "assunto": "RLS + JWT, gabarito só no banco, SQL idempotente", "ordem": 11, "titulo": "RLS + JWT — OBRIGATÓRIO", "tipo": "Obrigatória", "texto": "```javascript\n// ✅ CORRETO — JWT do usuário logado\nconst session = await supabase.auth.getSession();\nif (session?.data?.session?.access_token) {\n  headers.Authorization = \"Bearer \" + session.data.session.access_token;\n}\n\n// ❌ ERRADO — Sem JWT ou chave service_role\n```\n\n```sql\n-- ✅ CORRETO — RLS na tabela\nALTER TABLE \"usuario\" ENABLE ROW LEVEL SECURITY;\nCREATE POLICY \"usuarios_veem_seus_dados\"\nON \"usuario\" FOR SELECT TO authenticated\nUSING (id = auth.uid());\n```"}, {"arquivo": "security-banco.md", "tituloArquivo": "🔐 Security & Banco — RLS, JWT, Gabarito", "categoria": "🟢 Banco e segurança", "assunto": "RLS + JWT, gabarito só no banco, SQL idempotente", "ordem": 11, "titulo": "Gabarito — Nunca Sai do Banco", "tipo": "Proibição", "texto": "| Local | Gabarito? | Por quê |\n|-------|-----------|---------|\n| Banco (tabela) | ✅ SIM | RLS controla |\n| Página HTML | ❌ NÃO | Aluno vê code |\n| PDF aluno | ❌ NÃO | Publicado |\n| localStorage | ❌ NÃO | Console expõe |\n| Arquivo .md | ❌ NÃO | Publicado |"}, {"arquivo": "security-banco.md", "tituloArquivo": "🔐 Security & Banco — RLS, JWT, Gabarito", "categoria": "🟢 Banco e segurança", "assunto": "RLS + JWT, gabarito só no banco, SQL idempotente", "ordem": 11, "titulo": "Schema — Sempre Idempotente", "tipo": "Obrigatória", "texto": "```sql\n-- ✅ CORRETO\nCREATE TABLE IF NOT EXISTS \"usuario\" (...)\nDROP POLICY IF EXISTS \"nome\" ON \"usuario\";\nALTER TABLE \"usuario\" ENABLE ROW LEVEL SECURITY;\n\n-- ❌ ERRADO — Apaga dados\nDELETE FROM usuario WHERE ...;\nDROP TABLE usuario;\n```"}, {"arquivo": "security-banco.md", "tituloArquivo": "🔐 Security & Banco — RLS, JWT, Gabarito", "categoria": "🟢 Banco e segurança", "assunto": "RLS + JWT, gabarito só no banco, SQL idempotente", "ordem": 11, "titulo": "Hierarquia", "tipo": "Obrigatória", "texto": "```\ncurso → materia → aulas → atividade → resposta\n```\n\nMatéria semelhante = **outra linha** de materia (não reuse)\n\n---\n\n**Ver também:** `docs/regras/usuarios-turmas-paginas-professor.md`"}, {"arquivo": "seeds.md", "tituloArquivo": "🌱 Seeds — Banco de dados", "categoria": "🟢 Banco e segurança", "assunto": "Ciclo dos seeds e `database/SEEDS-APLICADOS.md`", "ordem": 12, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "**Registro único:** `database/SEEDS-APLICADOS.md`. Passo a passo completo: `scripts/seeds/README.md`.\nTarefa de banco = só o **Claude Code local** (`multiplas-ias.md`)."}, {"arquivo": "seeds.md", "tituloArquivo": "🌱 Seeds — Banco de dados", "categoria": "🟢 Banco e segurança", "assunto": "Ciclo dos seeds e `database/SEEDS-APLICADOS.md`", "ordem": 12, "titulo": "Ciclo", "tipo": "Fluxo", "texto": "| Status | Significado | Próxima ação |\n|--------|-------------|--------------|\n| **PENDENTE** | `.sql` gerado, nunca rodado | Aplicar no Supabase |\n| **APLICADO** | Rodado, ainda não conferido (ou md5 não bateu) | Conferir md5 |\n| **CONCLUÍDO** | Rodado e conferido ✅ | — |\n| **SUBSTITUÍDO** | Não será usado (outro seed já CONCLUÍDO) ✅ | — |"}, {"arquivo": "seeds.md", "tituloArquivo": "🌱 Seeds — Banco de dados", "categoria": "🟢 Banco e segurança", "assunto": "Ciclo dos seeds e `database/SEEDS-APLICADOS.md`", "ordem": 12, "titulo": "Antes de QUALQUER tarefa nova", "tipo": "Obrigatória", "texto": "Todo seed precisa estar **CONCLUÍDO** ou **SUBSTITUÍDO**. Se houver PENDENTE ou APLICADO:\naplicar → conferir md5 → registrar CONCLUÍDO → só então a tarefa nova."}, {"arquivo": "seeds.md", "tituloArquivo": "🌱 Seeds — Banco de dados", "categoria": "🟢 Banco e segurança", "assunto": "Ciclo dos seeds e `database/SEEDS-APLICADOS.md`", "ordem": 12, "titulo": "Scripts (nunca montar à mão)", "tipo": "Proibição", "texto": "Rodar na raiz do repositório. Python no Windows: `C:\\Python314\\python.exe`; na nuvem: `python3`.\nRascunhos (lotes, JSON) ficam na pasta temporária da sessão, nunca no repositório.\n\n```bash\npython scripts/seeds/dividir_seed.py database/<seed>.sql <pasta-lotes>\npython scripts/seeds/comparar_md5.py <pasta-lotes>/esperado.json <pasta-lotes>/resultado.json\npython scripts/seeds/registrar_seed.py <seed>.sql CONCLUÍDO \"<observação com ids>\"\n```\n\n- O lote só **acrescenta** itens. Se a atividade já tiver itens diferentes no banco, avisar o\n  usuário (apagar exige pedido e backup)."}, {"arquivo": "seeds.md", "tituloArquivo": "🌱 Seeds — Banco de dados", "categoria": "🟢 Banco e segurança", "assunto": "Ciclo dos seeds e `database/SEEDS-APLICADOS.md`", "ordem": 12, "titulo": "Autorização permanente (desde 2026-10-09)", "tipo": "Obrigatória", "texto": "Sem perguntar de novo: aplicar PENDENTE, conferir APLICADO, marcar CONCLUÍDO, registrar e fazer\ncommit + push. Qualquer outra mudança no banco de produção continua exigindo autorização."}, {"arquivo": "materias-global.md", "tituloArquivo": "📚 Matérias — Regra Global", "categoria": "🔵 Conteúdo das matérias", "assunto": "Estrutura de pasta, 1 aula = 4 h, status, critério de pronto", "ordem": 13, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "**Esta regra substitui a \"matéria modelo ITIC\".**"}, {"arquivo": "materias-global.md", "tituloArquivo": "📚 Matérias — Regra Global", "categoria": "🔵 Conteúdo das matérias", "assunto": "Estrutura de pasta, 1 aula = 4 h, status, critério de pronto", "ordem": 13, "titulo": "Estrutura de Pasta", "tipo": "Obrigatória", "texto": "```\nMATERIAIS/<CURSO>/<MATERIA>/\n├── EMENTA-CHALKIE-AI.md     ← Principal\n├── materia.json              ← Dados (`apostilas.md`)\n├── STATUS_MATERIA.md\n├── AULAS/\n│   └── CONTEUDO/\n│       ├── AULA-01-TITULO.md\n│       └── ...\n├── ATIVIDADES/\n│   └── STATUS-ATIVIDADES.md\n├── APOSTILA/\n│   ├── APOSTILA-<MATERIA>.md\n│   └── HTML\n└── DOCUMENTACAO/\n```"}, {"arquivo": "materias-global.md", "tituloArquivo": "📚 Matérias — Regra Global", "categoria": "🔵 Conteúdo das matérias", "assunto": "Estrutura de pasta, 1 aula = 4 h, status, critério de pronto", "ordem": 13, "titulo": "1 Aula = 4 Horas", "tipo": "Obrigatória", "texto": "- Um arquivo `AULA-NN-TITULO.md`\n- Tema, domínios, capacidades, conteúdos\n- Detalhamento, indicadores, situação-problema"}, {"arquivo": "materias-global.md", "tituloArquivo": "📚 Matérias — Regra Global", "categoria": "🔵 Conteúdo das matérias", "assunto": "Estrutura de pasta, 1 aula = 4 h, status, critério de pronto", "ordem": 13, "titulo": "Atividades e apostila", "tipo": "Obrigatória", "texto": "- Atividades (objetiva 50 questões, prática 10 × 3 tópicos, avaliação): `atividades-banco.md`\n- Apostila e `materia.json`: `apostilas.md`"}, {"arquivo": "materias-global.md", "tituloArquivo": "📚 Matérias — Regra Global", "categoria": "🔵 Conteúdo das matérias", "assunto": "Estrutura de pasta, 1 aula = 4 h, status, critério de pronto", "ordem": 13, "titulo": "5 Status Sempre Existem", "tipo": "Obrigatória", "texto": "1. `STATUS_MATERIA.md`\n2. `AULAS/STATUS-AULAS.md`\n3. `ATIVIDADES/STATUS-ATIVIDADES.md`\n4. `APOSTILA/STATUS-APOSTILA.md`\n5. `STATUS-EMENTAS.md`"}, {"arquivo": "materias-global.md", "tituloArquivo": "📚 Matérias — Regra Global", "categoria": "🔵 Conteúdo das matérias", "assunto": "Estrutura de pasta, 1 aula = 4 h, status, critério de pronto", "ordem": 13, "titulo": "Critério de Pronto", "tipo": "Obrigatória", "texto": "✅ Aulas em `CONTEUDO/`  \n✅ Atividades no banco  \n✅ Apostila (Markdown 100% + HTML)  \n✅ Seeds CONCLUÍDO  \n✅ Todos os status em ✅"}, {"arquivo": "materias-global.md", "tituloArquivo": "📚 Matérias — Regra Global", "categoria": "🔵 Conteúdo das matérias", "assunto": "Estrutura de pasta, 1 aula = 4 h, status, critério de pronto", "ordem": 13, "titulo": "Conteúdo — Nunca PDF", "tipo": "Proibição", "texto": "**Fonte:**\n- `EMENTA-CHALKIE-AI.md` (principal)\n- Markdown da matéria\n\n**NUNCA:**\n- ❌ Ler de PDF\n- ❌ Copiar de outra UC\n- ❌ Usar matéria semelhante como base sem pedir ao usuário\n\n---\n\n**Ver também:** `docs/regras/materias.md`"}, {"arquivo": "apostilas.md", "tituloArquivo": "📘 Apostilas e dados da ementa (`materia.json`)", "categoria": "🔵 Conteúdo das matérias", "assunto": "`materia.json`, fluxo da apostila, identificação, PDF", "ordem": 14, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Estrutura de pastas da matéria: `materias-global.md`. Detalhes: `docs/regras/apostilas.md`."}, {"arquivo": "apostilas.md", "tituloArquivo": "📘 Apostilas e dados da ementa (`materia.json`)", "categoria": "🔵 Conteúdo das matérias", "assunto": "`materia.json`, fluxo da apostila, identificação, PDF", "ordem": 14, "titulo": "Antes de gerar", "tipo": "Obrigatória", "texto": "- Ler a **ementa da matéria** (`EMENTA-CHALKIE-AI.md`) e a da **UC no curso** — a do curso vence.\n- ❌ Nunca usar conteúdo, bibliografia ou capacidade de outra UC."}, {"arquivo": "apostilas.md", "tituloArquivo": "📘 Apostilas e dados da ementa (`materia.json`)", "categoria": "🔵 Conteúdo das matérias", "assunto": "`materia.json`, fluxo da apostila, identificação, PDF", "ordem": 14, "titulo": "`materia.json` — arquivo único de dados da matéria", "tipo": "Obrigatória", "texto": "- Fica em `<MATERIA>/materia.json` (substituiu `atividades.json` e `apostila.json`).\n- Contém as **capacidades** (básicas e socioemocionais) e os **conhecimentos** (domínios e\n  conteúdos) da ementa, sem repetir dados em outro JSON.\n- Traz o **plano de aulas: 1 aula de 4 horas = 1 capítulo** (tema, domínios, capacidades, conteúdos\n  oficiais × detalhamento didático, indicadores, situação-problema, atividade, estratégias).\n- Todos os geradores leem dele (`assets/gerador-materia/materia.py`)."}, {"arquivo": "apostilas.md", "tituloArquivo": "📘 Apostilas e dados da ementa (`materia.json`)", "categoria": "🔵 Conteúdo das matérias", "assunto": "`materia.json`, fluxo da apostila, identificação, PDF", "ordem": 14, "titulo": "Fluxo da apostila", "tipo": "Fluxo", "texto": "1. Capítulos em Markdown — **um por vez, com validação do usuário**.\n2. Mínimo de **5 exercícios por capítulo**.\n3. **Markdown completo** em `<MATERIA>/APOSTILA/APOSTILA-<MATERIA>.md` (o usuário compara e\n   acrescenta dados).\n4. Só no final o **HTML**, gerado a partir do Markdown completo."}, {"arquivo": "apostilas.md", "tituloArquivo": "📘 Apostilas e dados da ementa (`materia.json`)", "categoria": "🔵 Conteúdo das matérias", "assunto": "`materia.json`, fluxo da apostila, identificação, PDF", "ordem": 14, "titulo": "Identificação (2026-10-07)", "tipo": "Obrigatória", "texto": "- Toda apostila mostra **autor, versão, data e hora** (capa e rodapé do HTML/PDF e cabeçalho do\n  Markdown completo).\n- Autor e versão no `materia.json` (`autor_apostila`, `versao_apostila`); data e hora = geração do\n  HTML. Autor padrão: **Gelvazio Camargo**.\n- Mudou o conteúdo → subir a versão (ajuste 1.0 → 1.1; mudança grande → 2.0)."}, {"arquivo": "apostilas.md", "tituloArquivo": "📘 Apostilas e dados da ementa (`materia.json`)", "categoria": "🔵 Conteúdo das matérias", "assunto": "`materia.json`, fluxo da apostila, identificação, PDF", "ordem": 14, "titulo": "PDF (2026-10-08, todas as apostilas)", "tipo": "Obrigatória", "texto": "- Rodapé de toda folha: **\"Página N de T\"** — apostila completa usa a numeração da apostila;\n  exportação parcial (ex.: só exercícios) numera as folhas exportadas (\"Página 1 de 2\").\n  Código: `assets/js/apostila.js` (`numerarPaginas`, `numerarPaginasExportadas`).\n- A **faixa azul vertical** da esquerda aparece só na tela; no PDF não sai (`@media print` em\n  `assets/css/apostila.css`), mantendo as margens para a paginação não mudar."}, {"arquivo": "atividades-banco.md", "tituloArquivo": "🗃️ Atividades — Banco, layout global, sem HTML", "categoria": "🔵 Conteúdo das matérias", "assunto": "Questões só no banco, layout global, \"você como aluno consultor\"", "ordem": 15, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "**Desde 2026-10-11** (migração na tarefa #25). Detalhes: `docs/regras/atividades.md`."}, {"arquivo": "atividades-banco.md", "tituloArquivo": "🗃️ Atividades — Banco, layout global, sem HTML", "categoria": "🔵 Conteúdo das matérias", "assunto": "Questões só no banco, layout global, \"você como aluno consultor\"", "ordem": 15, "titulo": "Questões só no banco", "tipo": "Proibição", "texto": "Enunciado, alternativas, gabarito e tópicos ficam **só no banco**. A página busca pelo id da\natividade e monta tudo na hora.\n\n- ❌ Questão em arquivo (`.md`, `.html`, `.json`)\n- ❌ `localStorage`\n- ❌ Gabarito visível para o aluno (`security-banco.md`)"}, {"arquivo": "atividades-banco.md", "tituloArquivo": "🗃️ Atividades — Banco, layout global, sem HTML", "categoria": "🔵 Conteúdo das matérias", "assunto": "Questões só no banco, layout global, \"você como aluno consultor\"", "ordem": 15, "titulo": "Layout global", "tipo": "Obrigatória", "texto": "Uma página por tipo, para todas as matérias — recebe o **id da atividade**:\n- `atividade-objetiva.html`\n- `atividade-pratica.html`\n\nRecursos que toda atividade já tem (não replicar por matéria): progresso da turma, gráficos,\ncálculo de nota, mínimo de questões, correção por IA (discursiva), gabarito por turma, PDF SENAI."}, {"arquivo": "atividades-banco.md", "tituloArquivo": "🗃️ Atividades — Banco, layout global, sem HTML", "categoria": "🔵 Conteúdo das matérias", "assunto": "Questões só no banco, layout global, \"você como aluno consultor\"", "ordem": 15, "titulo": "Pasta da matéria — só Markdown", "tipo": "Obrigatória", "texto": "```\nMATERIAIS/<CURSO>/<MATERIA>/ATIVIDADES/\n└── STATUS-ATIVIDADES.md      (sem HTML; índice gerado por script a partir do banco)\n```"}, {"arquivo": "atividades-banco.md", "tituloArquivo": "🗃️ Atividades — Banco, layout global, sem HTML", "categoria": "🔵 Conteúdo das matérias", "assunto": "Questões só no banco, layout global, \"você como aluno consultor\"", "ordem": 15, "titulo": "Tamanho padrão", "tipo": "Obrigatória", "texto": "| Tipo | Tamanho |\n|------|---------|\n| Objetiva | 50 questões |\n| Prática | 10 × 3 tópicos |\n| Avaliação | Conforme a ementa |"}, {"arquivo": "atividades-banco.md", "tituloArquivo": "🗃️ Atividades — Banco, layout global, sem HTML", "categoria": "🔵 Conteúdo das matérias", "assunto": "Questões só no banco, layout global, \"você como aluno consultor\"", "ordem": 15, "titulo": "Contexto: \"Você como aluno consultor\" (2026-10-08)", "tipo": "Obrigatória", "texto": "Vale para **toda atividade** (objetiva, prática, discursiva, avaliação, situação-problema, Excel,\nWord…).\n\n- ⛔ **Não criar empresa fictícia** (\"a empresa X Ltda.\", \"a Distribuidora Y\"…).\n- ✅ O enunciado coloca o aluno como **consultor** que analisa a situação e resolve o problema:\n  \"Você, como aluno consultor, foi chamado para organizar o controle de estoque de um\n  almoxarifado…\".\n- ✅ O contexto profissional do curso continua (almoxarifado, logística, escritório…), sem nome de\n  empresa inventada."}, {"arquivo": "faixa-materias-ensalado.md", "tituloArquivo": "🎚️ Faixa de matérias: SOMENTE ENSALADO / VER TODAS MATÉRIAS", "categoria": "🔵 Conteúdo das matérias", "assunto": "Botões SOMENTE ENSALADO / VER TODAS e ON/OFF", "ordem": 16, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Registrada em 2026-10-08 23:42:02. Vale para qualquer faixa **\"Matérias — <CURSO>\"** de índice de\ncurso."}, {"arquivo": "faixa-materias-ensalado.md", "tituloArquivo": "🎚️ Faixa de matérias: SOMENTE ENSALADO / VER TODAS MATÉRIAS", "categoria": "🔵 Conteúdo das matérias", "assunto": "Botões SOMENTE ENSALADO / VER TODAS e ON/OFF", "ordem": 16, "titulo": "Filtro", "tipo": "Obrigatória", "texto": "- Ao lado do título da faixa, dois botões: **SOMENTE ENSALADO** (só matérias com\n  `ensalado = true`) e **VER TODAS MATÉRIAS** (lista completa).\n- A faixa **sempre abre em SOMENTE ENSALADO**; se nenhuma matéria estiver ensalada, mostra todas.\n- O botão do filtro em uso fica com **fundo verde piscando levemente**.\n- No índice do curso, a grade de matérias de baixo segue o mesmo filtro."}, {"arquivo": "faixa-materias-ensalado.md", "tituloArquivo": "🎚️ Faixa de matérias: SOMENTE ENSALADO / VER TODAS MATÉRIAS", "categoria": "🔵 Conteúdo das matérias", "assunto": "Botões SOMENTE ENSALADO / VER TODAS e ON/OFF", "ordem": 16, "titulo": "ON/OFF por matéria", "tipo": "Obrigatória", "texto": "- Cada matéria da faixa tem um botão **ON/OFF** ao lado do nome para marcar/desmarcar `ensalado`.\n- A mudança grava no banco: coluna **`materia.ensalado`** (boolean). Não criar coluna nova\n  (ver `docs/database.md`).\n- O ON/OFF aparece e grava **só para o perfil PROFESSOR** (garantido por RLS); o aluno vê apenas o\n  filtro."}, {"arquivo": "graphify.md", "tituloArquivo": "🕸️ Graphify", "categoria": "⚪ Ferramentas", "assunto": "Graphify só quando o usuário pedir", "ordem": 17, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "- Skill: `.claude/skills/graphify/SKILL.md`. Gatilho: o usuário digita `/graphify` → invocar a\n  skill antes de qualquer outra coisa.\n- Python: sempre `C:\\Python314\\python.exe`.\n- ⛔ **Só roda quando o usuário pedir** (2026-10-09): não rodar `graphify update .` sozinho (nem no\n  início da conversa, nem depois de commits) e não ler o `GRAPH_REPORT.md` antes de responder."}, {"arquivo": "visualizador-regras.md", "tituloArquivo": "👁️ Visualizador de regras e tarefas (`.claude/rules/index.html`)", "categoria": "⚪ Ferramentas", "assunto": "`index.html` desta pasta: só visualizador; regenerar a cada mudança aqui ou em `tasks/`", "ordem": 18, "titulo": "O que é", "tipo": "Obrigatória", "texto": "- `.claude/rules/index.html` é **só um visualizador** para o professor ler as regras e o quadro de\n  tarefas em cards (aba **REGRAS**, por categoria e tipo; aba **TASKS**, com status, frentes e\n  \"Aguardando o usuário\").\n- ⛔ **Não é página do projeto:** não recebe header, login nem dados do banco, e nenhuma página o\n  usa como componente. O único acesso pelo site é o item **Regras** do menu do Professor\n  Administrador (`js/header-usuario.js`), que o abre em **nova aba**.\n- ⛔ **Não editar à mão:** o arquivo é gerado e qualquer edição se perde na próxima geração."}, {"arquivo": "visualizador-regras.md", "tituloArquivo": "👁️ Visualizador de regras e tarefas (`.claude/rules/index.html`)", "categoria": "⚪ Ferramentas", "assunto": "`index.html` desta pasta: só visualizador; regenerar a cada mudança aqui ou em `tasks/`", "ordem": 18, "titulo": "Atualizar SEMPRE junto", "tipo": "Obrigatória", "texto": "Toda vez que mudar **qualquer arquivo de `.claude/rules/`** ou o **quadro** (`tasks/STATUS.md`,\n`tasks/TASKS.md`, `tasks/etapas/`), regenerar e commitar o `index.html` **no mesmo commit**:\n\n```bash\npython scripts/regras/gerar_visualizador_regras.py\ngit add .claude/rules/index.html\n```\n\nO topo da página mostra a data e hora da geração. Se ela for mais antiga que o último commit nas\nregras, o visualizador está desatualizado."}, {"arquivo": "visualizador-regras.md", "tituloArquivo": "👁️ Visualizador de regras e tarefas (`.claude/rules/index.html`)", "categoria": "⚪ Ferramentas", "assunto": "`index.html` desta pasta: só visualizador; regenerar a cada mudança aqui ou em `tasks/`", "ordem": 18, "titulo": "Como funciona", "tipo": "Obrigatória", "texto": "| Parte | Onde |\n|-------|------|\n| Gerador | `scripts/regras/gerar_visualizador_regras.py` |\n| Leitura das regras (seções `##`, categoria pelo `INDEX.md`, tipo) | `scripts/regras/visualizador/leitor_regras.py` |\n| Leitura do quadro (tabela \"📌 Tarefas\", `TASKS.md`, etapas citadas) | `scripts/regras/visualizador/leitor_tarefas.py` |\n| Página (HTML, CSS e JS que o gerador junta num arquivo só) | `scripts/regras/visualizador/` |\n\n- O conteúdo vai **embu   <script>// Renderizador de Markdown enxuto (títulos, listas, tabelas, código, citação e trechos em linha),
// suficiente para os arquivos de regras e do quadro. Escapa todo o HTML antes de formatar.

const PADRAO_CERCA_CODIGO = /^\s*```/;
const PADRAO_TITULO_MD = /^(#{1,6})\s+(.*)$/;
const PADRAO_ITEM_LISTA = /^\s*(?:[-*+]|\d+[.)])\s+(.*)$/;
const PADRAO_LINHA_TABELA = /^\s*\|.*\|\s*$/;
const PADRAO_SEPARADOR_TABELA = /^\s*\|?\s*:?-{2,}/;
const PADRAO_REGUA = /^\s*(-{3,}|\*{3,})\s*$/;
const NIVEL_MINIMO_TITULO = 2;

/**
 * Escapa os caracteres especiais de HTML.
 * @param {string} texto - Texto bruto.
 * @returns {string} Texto seguro para innerHTML.
 */
function escaparHtml(texto) {
  return String(texto)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

/**
 * Formata os trechos em linha: código, negrito, itálico, riscado e links.
 * @param {string} texto - Texto de uma linha.
 * @returns {string} HTML da linha.
 */
function formatarEmLinha(texto) {
  const trechosCodigo = [];
  let html = escaparHtml(texto).replace(/`([^`]+)`/g, (_, codigo) => {
    trechosCodigo.push(codigo);
    return "\u0000" + (trechosCodigo.length - 1) + "\u0000";
  });
  html = html
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/~~(.+?)~~/g, "<del>$1</del>")
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<span title="$2">$1</span>');
  return html.replace(/\u0000(\d+)\u0000/g, (_, indice) => "<code>" + trechosCodigo[indice] + "</code>");
}

/**
 * Separa as células de uma linha de tabela, respeitando `|` dentro de crases.
 * @param {string} linha - Linha da tabela.
 * @returns {string[]} Células.
 */
function dividirCelulasMd(linha) {
  const celulas = [];
  let atual = "";
  let dentroDeCrase = false;
  for (const caractere of linha.trim().replace(/^\||\|$/g, "")) {
    if (caractere === "`") dentroDeCrase = !dentroDeCrase;
    const fechaCelula = caractere === "|" && !dentroDeCrase && !atual.endsWith("\\");
    if (fechaCelula) {
      celulas.push(atual.trim());
      atual = "";
      continue;
    }
    atual += caractere;
  }
  celulas.push(atual.trim());
  return celulas;
}

/**
 * Monta uma tabela HTML a partir das linhas Markdown.
 * @param {string[]} linhas - Cabeçalho, separador e linhas de dados.
 * @returns {string} HTML da tabela.
 */
function montarTabelaMd(linhas) {
  const cabecalho = dividirCelulasMd(linhas[0]).map((celula) => "<th>" + formatarEmLinha(celula) + "</th>");
  const corpo = linhas.slice(2).map((linha) => {
    const celulas = dividirCelulasMd(linha).map((celula) => "<td>" + formatarEmLinha(celula) + "</td>");
    return "<tr>" + celulas.join("") + "</tr>";
  });
  return '<div class="tabela-rolagem"><table><thead><tr>' + cabecalho.join("") +
    "</tr></thead><tbody>" + corpo.join("") + "</tbody></table></div>";
}

/**
 * Lê um bloco de linhas consecutivas que obedecem a uma condição.
 * @param {{linhas: string[], inicio: number, condicao: Function}} leitura - Linhas, posição e teste.
 * @returns {{bloco: string[], fim: number}} Linhas do bloco e a posição seguinte.
 */
function lerBlocoMd(leitura) {
  const { linhas, inicio, condicao } = leitura;
  let fim = inicio;
  while (fim < linhas.length && condicao(linhas[fim])) fim += 1;
  return { bloco: linhas.slice(inicio, fim), fim };
}

/**
 * Converte o bloco que começa na linha indicada e diz onde ele termina.
 * @param {string[]} linhas - Todas as linhas do texto.
 * @param {number} inicio - Linha atual.
 * @returns {{html: string, fim: number}} HTML do bloco e a próxima linha a ler.
 */
function converterBlocoMd(linhas, inicio) {
  const linha = linhas[inicio];
  if (PADRAO_CERCA_CODIGO.test(linha)) {
    const { bloco, fim } = lerBlocoMd({ linhas, inicio: inicio + 1, condicao: (item) => !PADRAO_CERCA_CODIGO.test(item) });
    return { html: "<pre><code>" + escaparHtml(bloco.join("\n")) + "</code></pre>", fim: fim + 1 };
  }
  const titulo = linha.match(PADRAO_TITULO_MD);
  if (titulo) {
    const nivel = Math.max(titulo[1].length, NIVEL_MINIMO_TITULO);
    return { html: `<h${nivel}>${formatarEmLinha(titulo[2])}</h${nivel}>`, fim: inicio + 1 };
  }
  if (PADRAO_REGUA.test(linha)) return { html: "<hr>", fim: inicio + 1 };
  const ehTabela = PADRAO_LINHA_TABELA.test(linha) && PADRAO_SEPARADOR_TABELA.test(linhas[inicio + 1] || "");
  if (ehTabela) {
    const { bloco, fim } = lerBlocoMd({ linhas, inicio, condicao: (item) => PADRAO_LINHA_TABELA.test(item) });
    return { html: montarTabelaMd(bloco), fim };
  }
  return converterBlocoTextoMd(linhas, inicio);
}

/**
 * Converte citação, lista ou parágrafo.
 * @param {string[]} linhas - Todas as linhas do texto.
 * @param {number} inicio - Linha atual.
 * @returns {{html: string, fim: number}} HTML do bloco e a próxima linha a ler.
 */
function converterBlocoTextoMd(linhas, inicio) {
  if (linhas[inicio].trim().startsWith(">")) {
    const { bloco, fim } = lerBlocoMd({ linhas, inicio, condicao: (item) => item.trim().startsWith(">") });
    const texto = bloco.map((item) => item.trim().replace(/^>\s?/, "")).join("\n");
    return { html: "<blockquote>" + markdownParaHtml(texto) + "</blockquote>", fim };
  }
  if (PADRAO_ITEM_LISTA.test(linhas[inicio])) {
    const continuaLista = (item) => PADRAO_ITEM_LISTA.test(item) || /^\s{2,}\S/.test(item);
    const { bloco, fim } = lerBlocoMd({ linhas, inicio, condicao: continuaLista });
    const itens = bloco.map((item) => {
      const conteudo = item.match(PADRAO_ITEM_LISTA)?.[1] ?? item.trim();
      return "<li>" + formatarEmLinha(conteudo) + "</li>";
    });
    return { html: "<ul>" + itens.join("") + "</ul>", fim };
  }
  const ehParagrafo = (item) => item.trim() !== "" && !PADRAO_TITULO_MD.test(item) &&
    !PADRAO_CERCA_CODIGO.test(item) && !PADRAO_LINHA_TABELA.test(item) && !PADRAO_ITEM_LISTA.test(item);
  const { bloco, fim } = lerBlocoMd({ linhas, inicio, condicao: ehParagrafo });
  if (!bloco.length) {
    const linhaSolta = linhas[inicio].trim();
    return { html: linhaSolta ? "<p>" + formatarEmLinha(linhaSolta) + "</p>" : "", fim: inicio + 1 };
  }
  return { html: "<p>" + bloco.map(formatarEmLinha).join("<br>") + "</p>", fim };
}

/**
 * Converte um texto Markdown em HTML.
 * @param {string} texto - Markdown.
 * @returns {string} HTML.
 */
function markdownParaHtml(texto) {
  const linhas = String(texto || "").split(/\r?\n/);
  const partes = [];
  let posicao = 0;
  while (posicao < linhas.length) {
    const { html, fim } = converterBlocoMd(linhas, posicao);
    partes.push(html);
    posicao = fim;
  }
  return partes.join("\n");
}


// Visualizador de regras e tarefas: abas, cartões, filtros e modal. Os dados vêm embutidos no
// <script id="dados"> pelo gerador scripts/regras/gerar_visualizador_regras.py.

const TODOS = "Todos";
const TAMANHO_RESUMO_CARTAO = 170;
const ORDEM_SITUACOES = ["Em andamento", "Aguardando", "Pendente", "Cancelada/Bloqueada", "Concluída"];
const COLUNAS_FRENTE = { titulo: "Frente (ambiente · branch)", situacao: "Situação" };
const DADOS = JSON.parse(document.getElementById("dados").textContent);
const estadoFiltros = { categoria: TODOS, tipo: TODOS, situacao: TODOS, buscaRegras: "", buscaTasks: "" };

/**
 * Transforma um texto em sufixo de classe CSS (sem acentos, espaços ou barras).
 * @param {string} texto - Texto original.
 * @returns {string} Sufixo em kebab-case.
 */
function paraClasse(texto) {
  return String(texto).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").replace("cancelada-bloqueada", "canceladabloqueada");
}

/**
 * Resume um Markdown em texto corrido para o cartão.
 * @param {string} texto - Markdown.
 * @returns {string} Começo do texto sem marcações.
 */
function resumirTexto(texto) {
  const limpo = String(texto || "").replace(/```[\s\S]*?```/g, " ").replace(/[#>*`|_~-]+/g, " ")
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/\s+/g, " ").trim();
  if (limpo.length <= TAMANHO_RESUMO_CARTAO) return limpo;
  return limpo.slice(0, TAMANHO_RESUMO_CARTAO).trimEnd() + "…";
}

/**
 * Cria um elemento com classe e texto.
 * @param {string} tag - Nome da tag.
 * @param {string} classe - Classes CSS.
 * @param {string} [texto] - Texto do elemento.
 * @returns {HTMLElement} Elemento criado.
 */
function criarElemento(tag, classe, texto = "") {
  const elemento = document.createElement(tag);
  elemento.className = classe;
  elemento.textContent = texto;
  return elemento;
}

/**
 * Cria uma etiqueta colorida.
 * @param {string} texto - Texto da etiqueta.
 * @param {string} [classeCor] - Classe que define a cor.
 * @returns {HTMLElement} Etiqueta.
 */
function criarEtiqueta(texto, classeCor = "") {
  return criarElemento("span", ("etiqueta " + classeCor).trim(), texto);
}

/**
 * Abre o modal com título, etiquetas e conteúdo Markdown.
 * @param {{titulo: string, etiquetas: HTMLElement[], markdown: string}} conteudo - O que mostrar.
 */
function abrirModal(conteudo) {
  document.getElementById("modal-titulo").textContent = conteudo.titulo;
  document.getElementById("modal-etiquetas").replaceChildren(...conteudo.etiquetas);
  document.getElementById("modal-corpo").innerHTML = markdownParaHtml(conteudo.markdown);
  document.getElementById("modal").showModal();
}

/**
 * Cria um cartão clicável.
 * @param {{titulo: string, texto: string, classe: string, etiquetas: HTMLElement[]}} dados - Conteúdo.
 * @param {Function} aoClicar - Ação ao clicar.
 * @returns {HTMLButtonElement} Cartão.
 */
function criarCartao(dados, aoClicar) {
  const cartao = criarElemento("button", "cartao " + dados.classe);
  cartao.type = "button";
  const rodape = criarElemento("div", "cartao__rodape");
  rodape.append(...dados.etiquetas);
  cartao.append(criarElemento("span", "cartao__titulo", dados.titulo),
    criarElemento("span", "cartao__texto", dados.texto), rodape);
  cartao.addEventListener("click", aoClicar);
  return cartao;
}

/**
 * Cria a barra de chips de um filtro.
 * @param {{idDestino: string, opcoes: string[], chave: string}} filtro - Onde, quais opções e qual estado.
 * @param {Function} aoMudar - Redesenho a chamar depois da escolha.
 */
function criarChips(filtro, aoMudar) {
  const destino = document.getElementById(filtro.idDestino);
  const opcoes = [TODOS, ...filtro.opcoes];
  const chips = opcoes.map((opcao) => {
    const chip = criarElemento("button", "chip", opcao);
    chip.type = "button";
    chip.classList.toggle("chip--ativo", opcao === estadoFiltros[filtro.chave]);
    chip.addEventListener("click", () => {
      estadoFiltros[filtro.chave] = opcao;
      chips.forEach((outro) => outro.classList.toggle("chip--ativo", outro === chip));
      aoMudar();
    });
    return chip;
  });
  destino.replaceChildren(...chips);
}

/**
 * Lista os valores distintos de um campo, na ordem em que aparecem.
 * @param {Object[]} itens - Registros.
 * @param {string} campo - Nome do campo.
 * @returns {string[]} Valores sem repetição.
 */
function valoresDistintos(itens, campo) {
  return [...new Set(itens.map((item) => item[campo]).filter(Boolean))];
}

/**
 * Diz se o texto do registro contém a busca (sem diferenciar maiúsculas).
 * @param {Object} registro - Registro com campos de texto.
 * @param {string} busca - Texto procurado.
 * @returns {boolean} Verdadeiro se combina ou se a busca está vazia.
 */
function combinaBusca(registro, busca) {
  if (!busca) return true;
  return JSON.stringify(registro).toLowerCase().includes(busca.toLowerCase());
}


// Aba REGRAS: seções dos arquivos de .claude/rules/ em cartões, agrupadas por categoria e arquivo.

/**
 * Abre o modal com o texto completo de uma seção de regra.
 * @param {Object} secao - Seção (arquivo, título, categoria, tipo, texto).
 */
function abrirRegra(secao) {
  abrirModal({
    titulo: secao.titulo,
    etiquetas: [
      criarEtiqueta(secao.categoria),
      criarEtiqueta(secao.tipo, "tipo--" + paraClasse(secao.tipo)),
      criarEtiqueta(secao.arquivo),
    ],
    markdown: secao.texto,
  });
}

/**
 * Cria o cartão de uma seção de regra.
 * @param {Object} secao - Seção da regra.
 * @returns {HTMLButtonElement} Cartão.
 */
function criarCartaoRegra(secao) {
  const classeTipo = "tipo--" + paraClasse(secao.tipo);
  return criarCartao({
    titulo: secao.titulo,
    texto: resumirTexto(secao.texto),
    classe: classeTipo,
    etiquetas: [criarEtiqueta(secao.tipo, classeTipo), criarEtiqueta(secao.arquivo)],
  }, () => abrirRegra(secao));
}

/**
 * Filtra as seções pelo estado atual (categoria, tipo e busca).
 * @returns {Object[]} Seções visíveis.
 */
function filtrarRegras() {
  return DADOS.regras.filter((secao) => {
    const categoriaCombina = estadoFiltros.categoria === TODOS || secao.categoria === estadoFiltros.categoria;
    const tipoCombina = estadoFiltros.tipo === TODOS || secao.tipo === estadoFiltros.tipo;
    return categoriaCombina && tipoCombina && combinaBusca(secao, estadoFiltros.buscaRegras);
  });
}

/**
 * Agrupa seções por uma chave, mantendo a ordem de chegada.
 * @param {Object[]} itens - Registros.
 * @param {string} campo - Campo usado como chave.
 * @returns {Map<string, Object[]>} Grupos.
 */
function agruparPor(itens, campo) {
  const grupos = new Map();
  itens.forEach((item) => {
    if (!grupos.has(item[campo])) grupos.set(item[campo], []);
    grupos.get(item[campo]).push(item);
  });
  return grupos;
}

/**
 * Monta o bloco de um arquivo: nome, assunto e a grade de cartões.
 * @param {string} arquivo - Nome do arquivo.
 * @param {Object[]} secoes - Seções desse arquivo.
 * @returns {HTMLElement} Bloco do arquivo.
 */
function montarBlocoArquivo(arquivo, secoes) {
  const bloco = criarElemento("div", "grupo__bloco");
  const titulo = criarElemento("p", "grupo__arquivo");
  const nome = criarElemento("code", "", arquivo);
  const assunto = secoes[0].assunto || secoes[0].tituloArquivo;
  titulo.append(nome, document.createTextNode(" — " + assunto));
  const grade = criarElemento("div", "grade");
  grade.append(...secoes.map(criarCartaoRegra));
  bloco.append(titulo, grade);
  return bloco;
}

/**
 * Redesenha a lista de regras conforme os filtros.
 */
function desenharRegras() {
  const visiveis = filtrarRegras();
  const destino = document.getElementById("lista-regras");
  document.getElementById("contagem-regras").textContent =
    `${visiveis.length} de ${DADOS.regras.length} seções de regras`;
  if (!visiveis.length) {
    destino.replaceChildren(criarElemento("p", "vazio", "Nenhuma regra encontrada."));
    return;
  }
  const grupos = [...agruparPor(visiveis, "categoria")].map(([categoria, secoes]) => {
    const grupo = criarElemento("section", "grupo");
    grupo.append(criarElemento("h2", "grupo__titulo", categoria));
    agruparPor(secoes, "arquivo").forEach((doArquivo, arquivo) => {
      grupo.append(montarBlocoArquivo(arquivo, doArquivo));
    });
    return grupo;
  });
  destino.replaceChildren(...grupos);
}

/**
 * Prepara a aba REGRAS: chips de categoria e tipo, busca e primeira renderização.
 */
function iniciarAbaRegras() {
  criarChips({ idDestino: "filtro-categorias", opcoes: valoresDistintos(DADOS.regras, "categoria"),
    chave: "categoria" }, desenharRegras);
  criarChips({ idDestino: "filtro-tipos", opcoes: valoresDistintos(DADOS.regras, "tipo"),
    chave: "tipo" }, desenharRegras);
  document.getElementById("busca-regras").addEventListener("input", (evento) => {
    estadoFiltros.buscaRegras = evento.target.value.trim();
    desenharRegras();
  });
  desenharRegras();
}


// Aba TASKS: tarefas do tasks/STATUS.md (com bloco do TASKS.md e etapas), frentes e pendências.

/**
 * Monta o Markdown completo de uma tarefa para o modal.
 * @param {Object} tarefa - Linha da tabela de tarefas com bloco e etapas.
 * @returns {string} Markdown do detalhamento.
 */
function montarMarkdownTarefa(tarefa) {
  const resumo = [
    "| Campo | Valor |", "|---|---|",
    `| Status | ${tarefa["Status"] || "—"} |`,
    `| Próximo passo | ${tarefa["Próximo passo"] || "—"} |`,
    `| Em uso por | ${tarefa["Em uso por"] || "—"} |`,
  ].join("\n");
  const partes = ["## Situação no quadro", resumo];
  if (tarefa.bloco) partes.push("## Descrição (TASKS.md)", tarefa.bloco);
  tarefa.etapas.forEach((etapa) => partes.push("---", etapa.texto));
  if (!tarefa.bloco && !tarefa.etapas.length) partes.push("*Sem bloco no TASKS.md nem etapa citada.*");
  return partes.join("\n\n");
}

/**
 * Abre o modal da tarefa.
 * @param {Object} tarefa - Tarefa do quadro.
 */
function abrirTarefa(tarefa) {
  const classe = "situacao--" + paraClasse(tarefa.situacao);
  abrirModal({
    titulo: `${tarefa["Tarefa"]} — ${tarefa["Descrição curta"]}`,
    etiquetas: [criarEtiqueta(tarefa.situacao, classe),
      ...tarefa.etapas.map((etapa) => criarEtiqueta(etapa.arquivo.replace(/\.md$/, "")))],
    markdown: montarMarkdownTarefa(tarefa),
  });
}

/**
 * Cria o cartão de uma tarefa.
 * @param {Object} tarefa - Tarefa do quadro.
 * @returns {HTMLButtonElement} Cartão.
 */
function criarCartaoTarefa(tarefa) {
  const classe = "situacao--" + paraClasse(tarefa.situacao);
  const codigoCurto = tarefa["Tarefa"].split("-")[0];
  const etiquetas = [criarEtiqueta(codigoCurto), criarEtiqueta(tarefa.situacao, classe)];
  const emUso = tarefa["Em uso por"];
  if (emUso && emUso !== "—") etiquetas.push(criarEtiqueta("🔒 " + emUso.split(" (")[0]));
  return criarCartao({
    titulo: tarefa["Descrição curta"],
    texto: resumirTexto(tarefa["Status"] + " · Próximo: " + (tarefa["Próximo passo"] || "—")),
    classe,
    etiquetas,
  }, () => abrirTarefa(tarefa));
}

/**
 * Desenha os contadores por situação.
 */
function desenharResumoTarefas() {
  const itens = ORDEM_SITUACOES.map((situacao) => {
    const total = DADOS.tasks.tarefas.filter((tarefa) => tarefa.situacao === situacao).length;
    const item = criarElemento("div", "resumo__item situacao--" + paraClasse(situacao));
    item.append(criarElemento("span", "resumo__numero", String(total)),
      criarElemento("span", "resumo__rotulo", situacao));
    return item;
  });
  document.getElementById("resumo-tasks").replaceChildren(...itens);
}

/**
 * Redesenha a lista de tarefas conforme a situação e a busca.
 */
function desenharTarefas() {
  const visiveis = DADOS.tasks.tarefas.filter((tarefa) => {
    const situacaoCombina = estadoFiltros.situacao === TODOS || tarefa.situacao === estadoFiltros.situacao;
    return situacaoCombina && combinaBusca(tarefa, estadoFiltros.buscaTasks);
  });
  const ordenadas = [...visiveis].sort((a, b) =>
    ORDEM_SITUACOES.indexOf(a.situacao) - ORDEM_SITUACOES.indexOf(b.situacao));
  document.getElementById("contagem-tasks").textContent =
    `${visiveis.length} de ${DADOS.tasks.tarefas.length} tarefas`;
  const destino = document.getElementById("lista-tasks");
  if (!ordenadas.length) {
    destino.replaceChildren(criarElemento("p", "vazio", "Nenhuma tarefa encontrada."));
    return;
  }
  destino.replaceChildren(...ordenadas.map(criarCartaoTarefa));
}

/**
 * Desenha as frentes de trabalho como cartões que abrem o detalhe da frente.
 */
function desenharFrentes() {
  const cartoes = DADOS.tasks.frentes.map((frente) => {
    const situacao = frente[COLUNAS_FRENTE.situacao] || "";
    const markdown = Object.entries(frente).map(([campo, valor]) => `### ${campo}\n\n${valor || "—"}`).join("\n\n");
    return criarCartao({
      titulo: frente[COLUNAS_FRENTE.titulo] || "Frente",
      texto: resumirTexto(frente["Próximo passo"] || ""),
      classe: "situacao--" + paraClasse(situacao.includes("✅") ? "Concluída" : "Em andamento"),
      etiquetas: [criarEtiqueta(situacao), criarEtiqueta(frente["Atualizado em"] || "")],
    }, () => abrirModal({ titulo: frente[COLUNAS_FRENTE.titulo], etiquetas: [criarEtiqueta(situacao)], markdown }));
  });
  const destino = document.getElementById("lista-frentes");
  destino.replaceChildren(...(cartoes.length ? cartoes : [criarElemento("p", "vazio", "Nenhuma frente.")]));
}

/**
 * Desenha a tabela "Aguardando o usuário".
 */
function desenharAguardando() {
  const linhas = DADOS.tasks.aguardando;
  const destino = document.getElementById("lista-aguardando");
  if (!linhas.length) {
    destino.replaceChildren(criarElemento("p", "vazio", "Nada aguardando o usuário."));
    return;
  }
  const colunas = Object.keys(linhas[0]);
  const markdown = ["| " + colunas.join(" | ") + " |", "|" + colunas.map(() => "---").join("|") + "|",
    ...linhas.map((linha) => "| " + colunas.map((coluna) => linha[coluna] || "").join(" | ") + " |")].join("\n");
  destino.innerHTML = markdownParaHtml(markdown);
}

/**
 * Prepara a aba TASKS.
 */
function iniciarAbaTasks() {
  criarChips({ idDestino: "filtro-situacoes", opcoes: ORDEM_SITUACOES, chave: "situacao" }, desenharTarefas);
  document.getElementById("busca-tasks").addEventListener("input", (evento) => {
    estadoFiltros.buscaTasks = evento.target.value.trim();
    desenharTarefas();
  });
  desenharResumoTarefas();
  desenharTarefas();
  desenharFrentes();
  desenharAguardando();
}


// Inicialização: data de geração, troca de abas (lembrada na URL com #regras / #tasks) e modal.

const ABA_PADRAO = "regras";

/**
 * Mostra a aba pedida e marca o botão correspondente.
 * @param {string} aba - "regras" ou "tasks".
 */
function mostrarAba(aba) {
  document.querySelectorAll("[data-aba]").forEach((botao) => {
    const ativa = botao.dataset.aba === aba;
    botao.classList.toggle("abas__botao--ativa", ativa);
    botao.setAttribute("aria-selected", String(ativa));
  });
  document.getElementById("painel-regras").hidden = aba !== "regras";
  document.getElementById("painel-tasks").hidden = aba !== "tasks";
}

/**
 * Liga os botões das abas e abre a aba indicada no endereço (#tasks), se houver.
 */
function iniciarAbas() {
  document.querySelectorAll("[data-aba]").forEach((botao) => {
    botao.addEventListener("click", () => {
      history.replaceState(null, "", "#" + botao.dataset.aba);
      mostrarAba(botao.dataset.aba);
    });
  });
  const abaDoEndereco = location.hash.replace("#", "");
  mostrarAba(["regras", "tasks"].includes(abaDoEndereco) ? abaDoEndereco : ABA_PADRAO);
}

/**
 * Liga o fechamento do modal: botão ✕, clique fora da caixa e tecla Esc (nativa do dialog).
 */
function iniciarModal() {
  const modal = document.getElementById("modal");
  document.getElementById("modal-fechar").addEventListener("click", () => modal.close());
  modal.addEventListener("click", (evento) => {
    if (evento.target === modal) modal.close();
  });
}

document.getElementById("data-geracao").textContent = DADOS.geradoEm;
iniciarAbas();
iniciarModal();
iniciarAbaRegras();
iniciarAbaTasks();
</script>
