: 0, "titulo": "1. Sincronizar", "tipo": "Obrigatória", "texto": "Trazer a `main` antes de ler qualquer coisa: `git fetch --all --prune` + `git pull --rebase origin\nmain` (comandos e proibições: `git-quick.md`)."}, {"arquivo": "essentials.md", "tituloArquivo": "⚡ Essentials — Checklist de início de sessão", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Checklist de início: sincronizar, o que ler e em que ordem", "ordem": 0, "titulo": "2. Ler, nesta ordem", "tipo": "Obrigatória", "texto": "| Arquivo | Para quê |\n|---------|----------|\n| `CLAUDE.md` → `AGENTS.md` | Regras do projeto (precedência máxima) |\n| `tasks/STATUS.md` | Quadro: frentes, tarefas e reservas (`tasks/quadro.md`) |\n| Etapa da tarefa da sua frente | Próximo passo — retomar de onde parou (`tasks/ciclo-da-task.md`) |\n| `tasks/RECADOS.md` | Recados de outras frentes para você ou `todas` |\n| `database/SEEDS-APLICADOS.md` | Seeds em dia antes de tarefa nova (`seeds.md`) |\n| `docs/` e `bugs/` | Orientação do que vai editar (`docs-antes-de-editar.md`) |"}, {"arquivo": "essentials.md", "tituloArquivo": "⚡ Essentials — Checklist de início de sessão", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Checklist de início: sincronizar, o que ler e em que ordem", "ordem": 0, "titulo": "3. Checklist", "tipo": "Fluxo", "texto": "```\n☐ Trouxe a main (fetch + pull --rebase)?\n☐ Li o STATUS.md, a etapa da minha frente e os recados?\n☐ Seeds em dia (ou exceção de seeds.md)?\n☐ Li a orientação em docs/ do que vou mexer?\n☐ Sei se a tarefa é pequena ou grande (tasks/ciclo-da-task.md)?\n```\n\n---\n\n**Data e hora:** sempre de Brasília. No Windows local, `date` ou `Get-Date` (o relógio já está em\nBrasília) — `TZ=America/Sao_Paulo date` no Git Bash sai em UTC (3 h a mais). Na nuvem:\n`TZ=America/Sao_Paulo date`."}, {"arquivo": "git-quick.md", "tituloArquivo": "🔀 Git Quick — Commit e push", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Tudo na `main`; quando commitar; commit + push; Git × site; proibições", "ordem": 1, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Único lugar das regras de git do projeto. Vale para **local e nuvem** e para todas as IAs."}, {"arquivo": "git-quick.md", "tituloArquivo": "🔀 Git Quick — Commit e push", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Tudo na `main`; quando commitar; commit + push; Git × site; proibições", "ordem": 1, "titulo": "Tudo na `main`", "tipo": "Obrigatória", "texto": "- Trabalho, quadro e regras vão direto para a **`main`** — também nas sessões de nuvem, mesmo que\n  a ferramenta indique outra branch. ⛔ Sem branches paralelas, sem `git worktree`, sem PR para\n  entregar tarefa.\n- Push para a `main` recusado por **permissão** → parar e avisar o usuário; não publicar em outra\n  branch como alternativa."}, {"arquivo": "git-quick.md", "tituloArquivo": "🔀 Git Quick — Commit e push", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Tudo na `main`; quando commitar; commit + push; Git × site; proibições", "ordem": 1, "titulo": "Quando commitar", "tipo": "Obrigatória", "texto": "| Momento | O que vai no commit |\n|---------|---------------------|\n| Reserva da tarefa (`tasks/frentes-e-reserva.md`) | Só o quadro — commit + push imediatos |\n| **Fim da tarefa** | Arquivos da tarefa + quadro (`tasks/STATUS.md` e a etapa) + visualizador regenerado — **1 commit + push** |\n| Usuário pede \"faça commit agora\" | Na hora, mesmo no meio da tarefa |\n\n- Usuário diz \"só commit, sem push\" → respeitar.\n- Executar os comandos de git **direto, sem perguntar**."}, {"arquivo": "git-quick.md", "tituloArquivo": "🔀 Git Quick — Commit e push", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Tudo na `main`; quando commitar; commit + push; Git × site; proibições", "ordem": 1, "titulo": "Fluxo", "tipo": "Fluxo", "texto": "```bash\ngit fetch --all --prune          # sem isso o git status mente\ngit pull --rebase origin main    # nunca pull sem --rebase (gera merge)\npython scripts/regras/gerar_visualizador_regras.py   # só no fim da tarefa (visualizador-regras.md)\ngit add <caminho1> <caminho2>    # só os arquivos da tarefa + quadro\ngit diff --cached --name-only    # conferir o que vai no commit\ngit commit -m \"feat(tema): descrição por <IA> (<frente>)\n\nCo-Authored-By: <nome do modelo em uso> <e-mail noreply do fornecedor da IA>\"\ngit push origin main\n```\n\n- Claude: `Co-Authored-By: Claude <modelo> <noreply@anthropic.com>`; outras IAs usam o nome e o\n  e-mail noreply do próprio fornecedor.\n- Push recusado porque o remoto andou → `fetch` + `pull --rebase` + reler o quadro + push de novo.\n  Conflito no `.claude/rules/index.html` → regenerar (não resolver à mão)."}, {"arquivo": "git-quick.md", "tituloArquivo": "🔀 Git Quick — Commit e push", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Tudo na `main`; quando commitar; commit + push; Git × site; proibições", "ordem": 1, "titulo": "Proibido", "tipo": "Proibição", "texto": "- ⛔ `git add .` (arrasta arquivos de outra tarefa ou de outra frente)\n- ⛔ `git push --force`\n- ⛔ `git pull` sem `--rebase` e `git merge`\n- ⛔ `git status` repetido entre comandos ou depois do commit (o git já avisa erros)\n- ⛔ Várias tarefas num commit só, ou tarefa concluída sem commit\n- ⛔ Commit/push de tarefa incompleta ou falhando"}, {"arquivo": "git-quick.md", "tituloArquivo": "🔀 Git Quick — Commit e push", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Tudo na `main`; quando commitar; commit + push; Git × site; proibições", "ordem": 1, "titulo": "O que vai para o Git e o que vai para o site", "tipo": "Proibição", "texto": "| Arquivo | Git | Site (Vercel) |\n|---------|-----|---------------|\n| `.env`, chaves, tokens, `variaveis.js` | ❌ (`.gitignore`) | ❌ |\n| Gabaritos, fontes de questões, seeds de atividades, listas de alunos e de presença | ✅ | ❌ (`.vercelignore`) |\n| Markdown, JavaScript, HTML, schema SQL | ✅ | ✅ |\n\nArquivo novo com resposta certa ou dado pessoal → conferir se o `.vercelignore` já o tira do site."}, {"arquivo": "git-quick.md", "tituloArquivo": "🔀 Git Quick — Commit e push", "categoria": "🔴 Sempre (início de sessão)", "assunto": "Tudo na `main`; quando commitar; commit + push; Git × site; proibições", "ordem": 1, "titulo": "Mensagens", "tipo": "Obrigatória", "texto": "```\nfeat(materias): gerar atividades de ITIC\nfix(banco): corrigir RLS de professor\ndocs(regras): reestruturar .claude/rules\n```"}, {"arquivo": "tasks/quadro.md", "tituloArquivo": "🗂️ Quadro de tarefas — fonte única", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "Fonte única: onde fica cada informação; modelos do `STATUS.md` e da etapa", "ordem": 2, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Esta pasta (`.claude/rules/tasks/`) serve para **qualquer projeto**: não tem nada específico de um\nprojeto. Para usar em outro, copie a pasta e crie `tasks/STATUS.md` e `tasks/etapas/` pelos\nmodelos abaixo. Ciclo da tarefa: `ciclo-da-task.md` · várias sessões: `frentes-e-reserva.md`."}, {"arquivo": "tasks/quadro.md", "tituloArquivo": "🗂️ Quadro de tarefas — fonte única", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "Fonte única: onde fica cada informação; modelos do `STATUS.md` e da etapa", "ordem": 2, "titulo": "Cada informação em um lugar só", "tipo": "Obrigatória", "texto": "| Informação | Lugar único |\n|------------|-------------|\n| Pedido, objetivo, próximo passo, escopo, riscos, itens e status de cada item | **Etapa** da tarefa: `tasks/etapas/ETAPA-NNN-<uuid8>-ASSUNTO.md` |\n| Status geral, prioridade, dependências e reserva | Linha da tarefa em \"📌 Tarefas\" do `tasks/STATUS.md` |\n| Tarefa que cada sessão está fazendo | Linha da frente em \"🧭 Frentes\" do `tasks/STATUS.md` |\n| Decisões, riscos, pendências e lições do projeto | Seções do `tasks/STATUS.md` |\n| Recados entre sessões | `tasks/RECADOS.md` (só se acrescentam linhas) |\n\n- ⛔ Não copiar para outro lugar: sem `TASKS.md`, sem plano separado em `docs/`, sem lista de\n  pendências do usuário montada à mão, sem cópia da fila em tabela de banco.\n- O que o usuário precisa fazer = itens **👀** das etapas (filtrar; não copiar).\n- O que não está no quadro não aconteceu. Histórico nunca é apagado: só se acrescentam etapas.\n- Quadro em formato antigo → migrar para este modelo levando o conteúdo, sem perder histórico.\n- Linguagem simples, que quem não é técnico entende."}, {"arquivo": "tasks/quadro.md", "tituloArquivo": "🗂️ Quadro de tarefas — fonte única", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "Fonte única: onde fica cada informação; modelos do `STATUS.md` e da etapa", "ordem": 2, "titulo": "Legenda", "tipo": "Obrigatória", "texto": "⬜ Pendente · 🔄 Em progresso · ✅ Concluído · ⛔ Bloqueado (motivo + o que destrava) ·\n👀 Aguardando o usuário"}, {"arquivo": "tasks/quadro.md", "tituloArquivo": "🗂️ Quadro de tarefas — fonte única", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "Fonte única: onde fica cada informação; modelos do `STATUS.md` e da etapa", "ordem": 2, "titulo": "Modelo do `tasks/STATUS.md`", "tipo": "Referência", "texto": "```markdown\n\n\n**Objetivo:** <1 frase> · **Partes interessadas:** <quem decide / aprova / usa>\n**Links:** [Regras](../AGENTS.md) · [Etapas](etapas/) · [Recados](RECADOS.md)\n\n## 🧭 Frentes de trabalho\n| Frente | Tarefa (etapa) | Situação | Atualizado em |\n\n## 📌 Tarefas\n| Tarefa | Título | Prioridade | Depende de | Status | Em uso por | Etapa |\n\n## Escopo do projeto\n## 🗂️ Etapas            (uma linha por etapa, criada junto com ela; nunca apagar)\n| Etapa | Assunto | Arquivo |\n## Riscos · ## Bloqueios gerais (sem tarefa) · ## Registro de decisões\n## Pendências (ficou para depois) · ## Lições aprendidas\n```\n\n- **Status** na linha da tarefa: só o emoji e 1–3 palavras (`🔄 Em execução`); o detalhe fica na\n  etapa. **Prioridade:** 🔴 Máxima · 🟠 Alta · 🟡 Média · 🟢 Baixa (definida pelo usuário).\n- Seção sem conteúdo fica com a tabela vazia (não apagar o cabeçalho)."}, {"arquivo": "tasks/quadro.md", "tituloArquivo": "🗂️ Quadro de tarefas — fonte única", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "Fonte única: onde fica cada informação; modelos do `STATUS.md` e da etapa", "ordem": 2, "titulo": "Modelo da etapa", "tipo": "Referência", "texto": "```markdown\n## Etapa NNN-<uuid8> — <título>\n\n**Tarefa:** #NN-<uuid> · **Pedido em:** AAAA-MM-DD HH:MM · **Executor:** <IA (frente)>\n**Pedido:** <palavras de quem pediu>\n**Objetivo:** <1 frase: o que e por quê>\n**Próximo passo:** NNN.x — <ação exata>\n\n### Escopo · ### Riscos · ### Decisões     ← só em tarefa grande (o plano é a etapa)\n\n| Item | Descrição | Status | Concluído em | Verificação |\n|------|-----------|--------|--------------|-------------|\n| NNN.1 | … | ⬜ Pendente | — | <como foi conferido> |\n| NNN.x | Aceite do usuário | ⬜ Pendente | — | — |\n```\n\n- Número da etapa sequencial + 8 caracteres de um UUID (evita número repetido entre sessões).\n- Itens pequenos (horas, não semanas), na ordem de execução."}, {"arquivo": "tasks/ciclo-da-task.md", "tituloArquivo": "🔁 Ciclo de uma tarefa (TASK)", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "O que vira TASK; abrir, pequena × grande (plano na etapa), executar, encerrar, retomar", "ordem": 3, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Reutilizável em qualquer projeto. Onde fica cada informação: `quadro.md`."}, {"arquivo": "tasks/ciclo-da-task.md", "tituloArquivo": "🔁 Ciclo de uma tarefa (TASK)", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "O que vira TASK; abrir, pequena × grande (plano na etapa), executar, encerrar, retomar", "ordem": 3, "titulo": "O que vira TASK", "tipo": "Obrigatória", "texto": "- ✅ Todo pedido que **muda** arquivo, banco ou configuração vira TASK **antes** de executar.\n- ❌ Pergunta, explicação ou análise que não muda nada **não** vira TASK: só responder.\n  Se a resposta levar a mudanças, a TASK nasce quando o usuário pedir."}, {"arquivo": "tasks/ciclo-da-task.md", "tituloArquivo": "🔁 Ciclo de uma tarefa (TASK)", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "O que vira TASK; abrir, pequena × grande (plano na etapa), executar, encerrar, retomar", "ordem": 3, "titulo": "1. Abrir", "tipo": "Obrigatória", "texto": "1. Sincronizar com o remoto (regras de git do projeto) e ler o `tasks/STATUS.md`.\n2. Criar a etapa (`quadro.md`), a linha em \"📌 Tarefas\" e a linha em \"🗂️ Etapas\".\n3. Reservar a tarefa (`frentes-e-reserva.md`).\n4. **Pedir detalhes ao solicitante**, numa mensagem só: objetivo e resultado esperado, escopo\n   (entra / não entra), arquivos ou partes envolvidas, critério de pronto, prazo.\n   - Não perguntar o que já está no pedido, no quadro ou no código.\n   - Pedido completo → confirmar o entendimento em 1 frase e seguir.\n   - ❌ Não assumir detalhe crítico em silêncio."}, {"arquivo": "tasks/ciclo-da-task.md", "tituloArquivo": "🔁 Ciclo de uma tarefa (TASK)", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "O que vira TASK; abrir, pequena × grande (plano na etapa), executar, encerrar, retomar", "ordem": 3, "titulo": "2. Pequena ou grande", "tipo": "Obrigatória", "texto": "| Tipo | Definição | Exige |\n|------|-----------|-------|\n| **Pequena** | Ajuste pontual em até ~3 arquivos, sem nada da linha de baixo | Etapa com itens |\n| **Grande** | Mexe em **banco**, **segurança** (login, papéis, permissões, chaves), tem **várias partes**, cria estrutura/gerador novo, faz **mudança em massa** ou **apaga dados** | Plano na **própria etapa** + **aprovação** |\n\nNa dúvida, é grande. O projeto pode definir exceções (rotinas já autorizadas).\n\n**Tarefa grande — o plano é a etapa:**\n1. Escrever na etapa: objetivo, escopo (entra / não entra), critério de pronto, premissas, riscos\n   com plano B e os itens com a verificação de cada um.\n2. Mostrar ao usuário um resumo (itens, arquivos, riscos, verificações) e perguntar se está certo.\n3. Esperar um **\"sim\" claro**; registrar a aprovação como item ✅ da etapa (quem, quando).\n4. Executar **só o escopo aprovado**. Mudança material de escopo → atualizar a etapa e pedir\n   **nova** aprovação."}, {"arquivo": "tasks/ciclo-da-task.md", "tituloArquivo": "🔁 Ciclo de uma tarefa (TASK)", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "O que vira TASK; abrir, pequena × grande (plano na etapa), executar, encerrar, retomar", "ordem": 3, "titulo": "3. Executar", "tipo": "Obrigatória", "texto": "- **Um item por vez:** só um 🔄 na etapa; terminar antes de começar outro.\n- Atualizar **na hora**: 🔄 ao começar, ✅ com data e hora ao terminar — nunca acumular.\n- **Próximo passo** da etapa sempre atualizado: é a última coisa a escrever ao parar e a primeira\n  a ler ao retomar.\n- Bloqueio → item ⛔ com motivo e o que destrava, **na hora**. Depende do usuário → item 👀.\n- Cada item com **verificação** (como foi conferido), conforme as regras de validação do projeto.\n- Decisão tomada no caminho → seção Decisões da etapa (o quê, quando, quem, por quê); se valer\n  para o projeto todo, também no \"Registro de decisões\" do `STATUS.md`."}, {"arquivo": "tasks/ciclo-da-task.md", "tituloArquivo": "🔁 Ciclo de uma tarefa (TASK)", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "O que vira TASK; abrir, pequena × grande (plano na etapa), executar, encerrar, retomar", "ordem": 3, "titulo": "4. Encerrar", "tipo": "Obrigatória", "texto": "1. Etapa: todos os itens ✅ (ou ⛔ justificados); o último é o **aceite** de quem pediu (👀 até ele\n   confirmar).\n2. Pendências que ficaram para depois → \"Pendências\" do `STATUS.md`, com motivo.\n3. Lição aprendida que vira regra → \"Lições aprendidas\" do `STATUS.md` (e a regra no lugar certo).\n4. `STATUS.md`: status da tarefa atualizado, \"Em uso por\" = `—`, linha da frente atualizada.\n5. **Um commit por tarefa** com o quadro no mesmo commit (e push, conforme a regra do projeto).\n6. Responder **apenas**: **TAREFA FINALIZADA!, AJUDO EM ALGO MAIS?** — sem resumo nem tabela\n   (perguntas e bloqueios são respondidos normalmente)."}, {"arquivo": "tasks/ciclo-da-task.md", "tituloArquivo": "🔁 Ciclo de uma tarefa (TASK)", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "O que vira TASK; abrir, pequena × grande (plano na etapa), executar, encerrar, retomar", "ordem": 3, "titulo": "Retomar (sessão nova ou que caiu)", "tipo": "Obrigatória", "texto": "1. Ler o `STATUS.md`: linha da sua frente e da tarefa reservada.\n2. Ler o **Próximo passo** da etapa; item 🔄/⬜ de tarefa aprovada → conferir o que já foi feito\n   (arquivos e commits) e **continuar de onde parou**.\n3. ❌ Não recomeçar do zero, não refazer itens ✅, não pular itens."}, {"arquivo": "tasks/frentes-e-reserva.md", "tituloArquivo": "🧭 Frentes e reserva de tarefas", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "Várias sessões/IAs: frentes, reserva, prioridade, limites, conflitos", "ordem": 4, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Reutilizável em qualquer projeto em que várias sessões ou IAs (Claude, Gemini, Grok, Copilot…)\ntrabalham no mesmo repositório e só se falam pelos arquivos. Quadro: `quadro.md`."}, {"arquivo": "tasks/frentes-e-reserva.md", "tituloArquivo": "🧭 Frentes e reserva de tarefas", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "Várias sessões/IAs: frentes, reserva, prioridade, limites, conflitos", "ordem": 4, "titulo": "Frentes", "tipo": "Obrigatória", "texto": "- Cada sessão é uma **frente**: `<ambiente> · <branch>` (ex.: `local · main`,\n  `nuvem · <nome-da-sessão>`).\n- Cada frente atualiza **só a própria linha** em \"🧭 Frentes\", ao começar e ao parar. Sem\n  pendência → `⏹️ Encerrada`.\n- O nome da IA/frente aparece na reserva, na linha da frente, no Executor da etapa e na mensagem\n  de commit (ex.: `feat(x): ... por Claude Code (local · main)`)."}, {"arquivo": "tasks/frentes-e-reserva.md", "tituloArquivo": "🧭 Frentes e reserva de tarefas", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "Várias sessões/IAs: frentes, reserva, prioridade, limites, conflitos", "ordem": 4, "titulo": "Pegar uma tarefa", "tipo": "Obrigatória", "texto": "1. Sincronizar com o remoto; **só então** ler o `STATUS.md` (sem sincronizar, o quadro mente).\n2. Escolher uma tarefa com **\"Em uso por\" = `—`** e **todas as dependências ✅**.\n3. Entre as livres, a de **maior prioridade** (🔴 → 🟠 → 🟡 → 🟢); empate = ordem do quadro.\n   🟢 Baixa só com orientação explícita do usuário.\n4. Gravar `<frente> (desde <data hora>)` em \"Em uso por\", fazer **commit + push imediatos** e só\n   então começar o trabalho.\n5. Push da reserva recusado → sincronizar, **reler** o quadro; se outra frente pegou a mesma tarefa,\n   desfazer a sua reserva e escolher outra."}, {"arquivo": "tasks/frentes-e-reserva.md", "tituloArquivo": "🧭 Frentes e reserva de tarefas", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "Várias sessões/IAs: frentes, reserva, prioridade, limites, conflitos", "ordem": 4, "titulo": "Limites", "tipo": "Proibição", "texto": "- **1 tarefa reservada por frente.** Só pega a próxima depois de entregar ou liberar a atual.\n- ⛔ Nunca mexer na reserva, na linha de frente ou na etapa de outra frente. Reserva \"parada\" não é\n  abandonada: quem libera é **o usuário** (ou quem ele autorizar).\n- Tarefa grande demais → dividir em tarefas menores antes de começar, cada uma com prioridade\n  (herda a da mãe, ou 🟡) e dependências declaradas.\n- A prioridade é **do usuário**; a IA não muda a de tarefas existentes sem pedido.\n- Scripts e rascunhos temporários na **pasta da própria sessão**, nunca em pasta compartilhada\n  nem no repositório."}, {"arquivo": "tasks/frentes-e-reserva.md", "tituloArquivo": "🧭 Frentes e reserva de tarefas", "categoria": "🗂️ Tarefas — pasta tasks/, reutilizável em outros projetos", "assunto": "Várias sessões/IAs: frentes, reserva, prioridade, limites, conflitos", "ordem": 4, "titulo": "Conflitos", "tipo": "Obrigatória", "texto": "- Conflito no `STATUS.md` ao sincronizar: manter as mudanças das duas frentes (cada uma só mexe\n  nas próprias linhas) e reler antes de seguir.\n- Arquivo **gerado** em conflito (ex.: visualizador do quadro): não resolver à mão — rodar o\n  gerador de novo depois de sincronizar.\n- Recado para outra frente (ou para todas) → `tasks/RECADOS.md`; ler os recados ao começar."}, {"arquivo": "multiplas-ias.md", "tituloArquivo": "🤖 Várias IAs neste projeto", "categoria": "🟠 Coordenar neste projeto", "assunto": "Nome das frentes; banco só pelo Claude Code local", "ordem": 5, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "As regras gerais de frentes, reserva, prioridade e conflitos estão em\n[`tasks/frentes-e-reserva.md`](tasks/frentes-e-reserva.md) (valem para todas as IAs). Aqui fica só\no que é **deste projeto**."}, {"arquivo": "multiplas-ias.md", "tituloArquivo": "🤖 Várias IAs neste projeto", "categoria": "🟠 Coordenar neste projeto", "assunto": "Nome das frentes; banco só pelo Claude Code local", "ordem": 5, "titulo": "1. Nome das frentes", "tipo": "Obrigatória", "texto": "- **Local:** `local · main` (máquina do usuário).\n- **Nuvem:** `nuvem · <nome-da-sessão>` — também trabalha na `main` (`git-quick.md`), mesmo que a\n  ferramenta indique outra branch."}, {"arquivo": "multiplas-ias.md", "tituloArquivo": "🤖 Várias IAs neste projeto", "categoria": "🟠 Coordenar neste projeto", "assunto": "Nome das frentes; banco só pelo Claude Code local", "ordem": 5, "titulo": "2. Banco de dados: só o Claude Code local", "tipo": "Obrigatória", "texto": "- Só o **Claude Code local** (máquina do usuário, com o conector do Supabase) pega tarefa de banco:\n  SQL, schema, trigger, função, RLS, migração, seeds, consultas e validação contra o banco real.\n- ⛔ Sessões de nuvem e outras IAs não pegam essas tarefas; se a tarefa tiver parte sem banco\n  (frontend, documentação), essa parte vira item ou tarefa separada.\n- Frente sem banco que encontrar seed pendente: segue o que diz `seeds.md` (não fica travada).\n- Mudança em banco de produção exige autorização do usuário, exceto o ciclo de seeds já autorizado\n  em `seeds.md`."}, {"arquivo": "docs-antes-de-editar.md", "tituloArquivo": "📚 Ler a orientação em `docs/` antes de editar", "categoria": "🟠 Coordenar neste projeto", "assunto": "Ler a orientação em `docs/` antes de mexer em um arquivo", "ordem": 6, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "**Antes de modificar um arquivo**, procure a orientação dele e leia por completo."}, {"arquivo": "docs-antes-de-editar.md", "tituloArquivo": "📚 Ler a orientação em `docs/` antes de editar", "categoria": "🟠 Coordenar neste projeto", "assunto": "Ler a orientação em `docs/` antes de mexer em um arquivo", "ordem": 6, "titulo": "Onde procurar", "tipo": "Referência", "texto": "| Vai mexer em | Leia antes |\n|--------------|-----------|\n| Módulo de `js/` (`aulas`, `curso`, `materia`, `unidade`…) | `docs/ORIENTACAO_JS_<MODULO>.md` |\n| Login / autenticação ⚠️ | `docs/ORIENTACAO_JS_LOGIN.md` e `docs/ORIENTACAO_USUARIO.md` |\n| Supabase (queries, headers, RLS, JWT) ⚠️ | `docs/ORIENTACAO_JS_SUPABASE.md` |\n| Banco de dados | `docs/database.md` (manter `docs/relatorio_verificacao_database.html` sincronizado) |\n| Bug já identificado | `bugs/bug-<nome>.md` |\n| Demais arquivos (`assets/js/`, páginas, geradores) | Cabeçalho do próprio arquivo + regra do assunto em `docs/regras/` (`materias.md`, `atividades.md`, `apostilas.md`, `codigo.md`, `assets-e-geradores.md`…) |"}, {"arquivo": "docs-antes-de-editar.md", "tituloArquivo": "📚 Ler a orientação em `docs/` antes de editar", "categoria": "🟠 Coordenar neste projeto", "assunto": "Ler a orientação em `docs/` antes de mexer em um arquivo", "ordem": 6, "titulo": "Quando avisar o usuário", "tipo": "Obrigatória", "texto": "- Módulo de `js/` sem orientação (hoje: `menu.js` e `header-usuario.js`) → avisar antes de editar.\n- Para os demais arquivos não há orientação própria: não precisa avisar."}, {"arquivo": "docs-antes-de-editar.md", "tituloArquivo": "📚 Ler a orientação em `docs/` antes de editar", "categoria": "🟠 Coordenar neste projeto", "assunto": "Ler a orientação em `docs/` antes de mexer em um arquivo", "ordem": 6, "titulo": "Checklist", "tipo": "Fluxo", "texto": "```\n☐ Identifiquei o arquivo a modificar\n☐ Achei a orientação correspondente (ou avisei, se for módulo de js/ sem orientação)\n☐ Li a orientação inteira e apliquei as regras dela\n```\n\nSem ler a orientação, é fácil violar regras críticas (RLS, JWT, segurança)."}, {"arquivo": "codigo-solid.md", "tituloArquivo": "🧱 Código — Princípios SOLID", "categoria": "🟡 Código e validação", "assunto": "SOLID e aplicação em JS, Python, HTML e CSS", "ordem": 7, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Todo arquivo de programação criado ou modificado (JavaScript, Python, HTML, CSS…) aplica SOLID,\nde forma **pragmática**: sem abstração desnecessária em script pequeno. Em código existente, seguir\no padrão do projeto e aplicar SOLID nas partes criadas ou alteradas.\nLimites, nomes e legibilidade: `codigo-limites-nomes.md`."}, {"arquivo": "codigo-solid.md", "tituloArquivo": "🧱 Código — Princípios SOLID", "categoria": "🟡 Código e validação", "assunto": "SOLID e aplicação em JS, Python, HTML e CSS", "ordem": 7, "titulo": "Os 5 princípios", "tipo": "Obrigatória", "texto": "| Letra | Princípio | Regra prática |\n|-------|-----------|---------------|\n| **S** | Single Responsibility | Cada função/classe/módulo/arquivo tem **uma** responsabilidade |\n| **O** | Open/Closed | Estender sem modificar: mapas de estratégia, composição — não `if/else` crescente |\n| **L** | Liskov Substitution | Implementações substituem a base sem quebrar o contrato |\n| **I** | Interface Segregation | Módulos pequenos e específicos; ninguém depende do que não usa |\n| **D** | Dependency Inversion | Depender de abstrações; **injetar** cliente de banco, API, storage |"}, {"arquivo": "codigo-solid.md", "tituloArquivo": "🧱 Código — Princípios SOLID", "categoria": "🟡 Código e validação", "assunto": "SOLID e aplicação em JS, Python, HTML e CSS", "ordem": 7, "titulo": "Por tecnologia", "tipo": "Obrigatória", "texto": "**JavaScript / Python**\n- ✅ Separar regra de negócio, acesso a dados (repository/service) e UI/DOM\n- ✅ Injetar dependências por construtor ou parâmetro (cliente Supabase, `fetch`, repositório)\n- ✅ Trocar cadeias de `if/switch` por tipo por mapas de estratégia ou polimorfismo\n- ✅ Um arquivo por responsabilidade (`aula.servico.js`, `aula.repositorio.js`, `aula.tela.js`)\n- ✅ Python: `abc.ABC`/`Protocol` quando houver mais de uma implementação\n- ❌ Arquivo \"faz-tudo\" (validação + banco + DOM + formatação juntos)\n\n**HTML**\n- ✅ Estrutura semântica (`header`, `main`, `section`, `article`, `nav`, `footer`)\n- ✅ Sem `style=\"\"` e sem JavaScript inline (`onclick`)\n- ✅ Blocos reutilizáveis e independentes\n\n**CSS**\n- ✅ Classes de responsabilidade única (layout ≠ tema ≠ componente ≠ utilitário)\n- ✅ Estender por modificador (BEM: `.cartao--destaque`) em vez de editar a classe base\n- ✅ Tokens em `:root { --cor-primaria }`; componentes usam tokens, não valores fixos\n- ❌ Seletores acoplados à estrutura (`div > ul > li > a`) e `!important` desnecessário"}, {"arquivo": "codigo-solid.md", "tituloArquivo": "🧱 Código — Princípios SOLID", "categoria": "🟡 Código e validação", "assunto": "SOLID e aplicação em JS, Python, HTML e CSS", "ordem": 7, "titulo": "Checklist SOLID", "tipo": "Fluxo", "texto": "```\n☐ Cada função/classe/arquivo tem uma única responsabilidade?\n☐ Dá para adicionar um caso novo sem alterar código existente?\n☐ Implementações podem ser trocadas sem quebrar quem as usa?\n☐ Módulos enxutos?\n☐ Dependências externas injetadas, não instanciadas no meio da lógica?\n☐ HTML, CSS e JS separados?\n```"}, {"arquivo": "codigo-limites-nomes.md", "tituloArquivo": "📏 Código — Limites, nomes e legibilidade", "categoria": "🟡 Código e validação", "assunto": "Limites (arquivo, função, linha), constantes, nomes em português, legibilidade", "ordem": 8, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Complementa `codigo-solid.md`. Vale para todas as linguagens."}, {"arquivo": "codigo-limites-nomes.md", "tituloArquivo": "📏 Código — Limites, nomes e legibilidade", "categoria": "🟡 Código e validação", "assunto": "Limites (arquivo, função, linha), constantes, nomes em português, legibilidade", "ordem": 8, "titulo": "Limites obrigatórios", "tipo": "Obrigatória", "texto": "| Regra | Exigência |\n|-------|-----------|\n| Arquivo | Máx. **1000 linhas** — passou, dividir por responsabilidade |\n| Função | Máx. **45 linhas** — passou, extrair funções menores |\n| Parâmetros | Máx. **3** — acima disso, receber um objeto (`criarAula({ titulo, data, turma })`) |\n| Aninhamento | Máx. **2 níveis** de `if`/`for`/`while` — usar return early ou extrair função |\n| Linha | Máx. **100 caracteres** |\n| Documentação | **Toda função** com JSDoc/docstring: objetivo, parâmetros, retorno, exceções |\n| Constantes | Valores fixos (URLs, tabelas, mensagens, limites, chaves, cores) viram **constantes nomeadas**: no bloco do topo do arquivo, ou no arquivo de constantes/configuração do módulo quando ele existir; cores e medidas em `:root` no CSS. Proibido número/string mágica no meio do código |\n| Formatação | Prettier + ESLint (JS/HTML/CSS) e Black + Ruff (Python) **onde houver configuração**; sem configuração (caso atual do projeto), seguir o estilo do próprio arquivo e o limite de 100 caracteres |"}, {"arquivo": "codigo-limites-nomes.md", "tituloArquivo": "📏 Código — Limites, nomes e legibilidade", "categoria": "🟡 Código e validação", "assunto": "Limites (arquivo, função, linha), constantes, nomes em português, legibilidade", "ordem": 8, "titulo": "Legibilidade", "tipo": "Obrigatória", "texto": "- **Return early:** validações e erros no início da função.\n- **Condições nomeadas:** `const podeInscrever = idade >= 16 && matriculado;`\n- **Sem abreviações:** `quantidade`, não `qtd` (exceto `i`, `j` de laço).\n- **Sem ternário aninhado** (`a ? b : c ? d : e`) — usar `if` com return ou mapa.\n- **Comentários** explicam o porquê; sem código comentado ou morto (o Git guarda o histórico).\n- `const` por padrão, `let` só se reatribuir, **nunca `var`**; funções puras quando possível.\n- `async/await` em vez de `.then()`; erros com `try/catch` consistente.\n- Ordem no arquivo: imports → constantes → auxiliares → principais → inicialização/export."}, {"arquivo": "codigo-limites-nomes.md", "tituloArquivo": "📏 Código — Limites, nomes e legibilidade", "categoria": "🟡 Código e validação", "assunto": "Limites (arquivo, função, linha), constantes, nomes em português, legibilidade", "ordem": 8, "titulo": "Nomes em português (sem acentos)", "tipo": "Obrigatória", "texto": "| Elemento | JavaScript | Python | CSS |\n|----------|-----------|--------|-----|\n| Variável | `totalAlunos` | `total_alunos` | — |\n| Função | `buscarAulas()` | `buscar_aulas()` | — |\n| Classe | `AulaRepositorio` | `AulaRepositorio` | `.lista-aulas` |\n| Constante | `LIMITE_ALUNOS` | `LIMITE_ALUNOS` | `--cor-destaque` |\n| Booleano | `estaAtivo`, `temNota`, `podeEditar` | `esta_ativo` | — |\n\nEm inglês só: palavras reservadas, APIs/bibliotecas (`fetch`, `querySelector`), colunas e tabelas\njá existentes no banco e padrões consolidados do projeto. ❌ Não misturar (`getAlunos`, `userNome`)."}, {"arquivo": "codigo-limites-nomes.md", "tituloArquivo": "📏 Código — Limites, nomes e legibilidade", "categoria": "🟡 Código e validação", "assunto": "Limites (arquivo, função, linha), constantes, nomes em português, legibilidade", "ordem": 8, "titulo": "Exemplo", "tipo": "Referência", "texto": "```js\n/**\n * Retorna a situação do aluno conforme a nota final.\n * @param {{matriculado: boolean, bloqueado: boolean, nota: number}} aluno\n * @returns {string|null} Situação, ou null se não puder ser avaliado.\n */\nfunction obterSituacao(aluno) {\n  if (!aluno) return null;\n\n  const podeSerAvaliado = aluno.matriculado && !aluno.bloqueado;\n  if (!podeSerAvaliado) return null;\n\n  if (aluno.nota >= NOTA_MINIMA_APROVACAO) return SITUACAO_APROVADO;\n  if (aluno.nota >= NOTA_MINIMA_RECUPERACAO) return SITUACAO_RECUPERACAO;\n  return SITUACAO_REPROVADO;\n}\n```"}, {"arquivo": "codigo-limites-nomes.md", "tituloArquivo": "📏 Código — Limites, nomes e legibilidade", "categoria": "🟡 Código e validação", "assunto": "Limites (arquivo, função, linha), constantes, nomes em português, legibilidade", "ordem": 8, "titulo": "Checklist", "tipo": "Fluxo", "texto": "```\n☐ Arquivo ≤ 1000 linhas, função ≤ 45, linha ≤ 100?\n☐ Toda função documentada?\n☐ Return early, ≤ 3 parâmetros, ≤ 2 níveis de aninhamento?\n☐ Sem número/string mágica (tudo em constante nomeada)?\n☐ Nomes em português, sem abreviação e sem ternário aninhado?\n☐ const/let, async/await, no estilo do arquivo (ou formatador, onde houver configuração)?\n```"}, {"arquivo": "testes-validacao.md", "tituloArquivo": "🧪 Testes e validação", "categoria": "🟡 Código e validação", "assunto": "Nunca abrir navegador; nunca escrever testes (exceto bug)", "ordem": 9, "titulo": "🚫 Nunca abrir navegador (2026-09-30)", "tipo": "Proibição", "texto": "- ⛔ Nada de Browser pane/preview (`preview_start`, `navigate`, `screenshot`…), computer-use,\n  Playwright, Puppeteer, `start chrome`/`Start-Process` de páginas.\n- ⛔ Não iniciar servidor de desenvolvimento para validar.\n- ✅ Validar só por **leitura do código**, `node --check`, **consultas ao banco** e terminal.\n- Vale mesmo quando o ambiente sugerir \"verificar no navegador\". Se algo só puder ser confirmado\n  no navegador, **avisar o usuário** para testar."}, {"arquivo": "testes-validacao.md", "tituloArquivo": "🧪 Testes e validação", "categoria": "🟡 Código e validação", "assunto": "Nunca abrir navegador; nunca escrever testes (exceto bug)", "ordem": 9, "titulo": "🚨 Nunca escrever testes automatizados", "tipo": "Proibição", "texto": "Regra **permanente**. Única exceção: a tarefa é **corrigir um bug** (aí um teste que reproduza a\nfalha é bem-vindo).\n\n- ❌ Criar `*.test.js`, `*.spec.js`, `test_*.py` ou equivalentes\n- ❌ \"Escrever testes\" como passo de plano\n- ❌ Testes \"de brinde\" junto com uma feature\n- ❌ Seguir skills de TDD que mandem testar antes\n- Vale mesmo que o repositório já tenha suíte configurada."}, {"arquivo": "testes-validacao.md", "tituloArquivo": "🧪 Testes e validação", "categoria": "🟡 Código e validação", "assunto": "Nunca abrir navegador; nunca escrever testes (exceto bug)", "ordem": 9, "titulo": "Quando rodar testes existentes", "tipo": "Obrigatória", "texto": "Só se houver erro específico a verificar, o usuário pedir, ou para diagnosticar um bug.\nNão rodar só para \"validar visualmente\"."}, {"arquivo": "security-banco.md", "tituloArquivo": "🔐 Security & Banco — RLS, JWT, Gabarito", "categoria": "🟢 Banco e segurança", "assunto": "RLS + JWT, onde o gabarito pode estar, SQL idempotente", "ordem": 10, "titulo": "RLS + JWT — OBRIGATÓRIO", "tipo": "Obrigatória", "texto": "```javascript\n// ✅ CORRETO — JWT do usuário logado\nconst session = await supabase.auth.getSession();\nif (session?.data?.session?.access_token) {\n  headers.Authorization = \"Bearer \" + session.data.session.access_token;\n}\n\n// ❌ ERRADO — Sem JWT ou chave service_role\n```\n\n```sql\n-- ✅ CORRETO — RLS na tabela\nALTER TABLE \"usuario\" ENABLE ROW LEVEL SECURITY;\nCREATE POLICY \"usuarios_veem_seus_dados\"\nON \"usuario\" FOR SELECT TO authenticated\nUSING (id = auth.uid());\n```"}, {"arquivo": "security-banco.md", "tituloArquivo": "🔐 Security & Banco — RLS, JWT, Gabarito", "categoria": "🟢 Banco e segurança", "assunto": "RLS + JWT, onde o gabarito pode estar, SQL idempotente", "ordem": 10, "titulo": "Gabarito — o aluno nunca vê", "tipo": "Proibição", "texto": "| Local | Gabarito? | Por quê |\n|-------|-----------|---------|\n| Banco (tabela) | ✅ SIM | RLS controla quem lê |\n| Fontes `.md` e seeds com resposta | ✅ Só no Git | Fora do site pelo `.vercelignore` (`git-quick.md`) |\n| Página HTML / site | ❌ NÃO | Aluno vê o código |\n| PDF do aluno | ❌ NÃO | Vai para o aluno |\n| `localStorage` | ❌ NÃO | Console expõe |\n\nDepois da migração #25 (`atividades-banco.md`), as questões e o gabarito ficam **só no banco**."}, {"arquivo": "security-banco.md", "tituloArquivo": "🔐 Security & Banco — RLS, JWT, Gabarito", "categoria": "🟢 Banco e segurança", "assunto": "RLS + JWT, onde o gabarito pode estar, SQL idempotente", "ordem": 10, "titulo": "Schema — Sempre Idempotente", "tipo": "Obrigatória", "texto": "```sql\n-- ✅ CORRETO\nCREATE TABLE IF NOT EXISTS \"usuario\" (...)\nDROP POLICY IF EXISTS \"nome\" ON \"usuario\";\nALTER TABLE \"usuario\" ENABLE ROW LEVEL SECURITY;\n\n-- ❌ ERRADO — Apaga dados (só com pedido do usuário e backup)\nDELETE FROM usuario WHERE ...;\nDROP TABLE usuario;\n```\n\nApagar linhas, tabelas ou colunas em massa (com pedido do usuário): preparar o SQL e deixar o\nprofessor executar no SQL Editor — o classificador do Claude Code bloqueia esse comando pelo\nconector. O que não apaga dados pode ir pelo conector.\n\n---\n\n**Ver também:** `docs/regras/usuarios-turmas-paginas-professor.md` · hierarquia das tabelas:\n`materias-global.md`"}, {"arquivo": "seeds.md", "tituloArquivo": "🌱 Seeds — Banco de dados", "categoria": "🟢 Banco e segurança", "assunto": "Ciclo dos seeds, exceções e `database/SEEDS-APLICADOS.md`", "ordem": 11, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "**Registro único:** `database/SEEDS-APLICADOS.md`. Passo a passo completo: `scripts/seeds/README.md`.\nTarefa de banco = só o **Claude Code local** (`multiplas-ias.md`)."}, {"arquivo": "seeds.md", "tituloArquivo": "🌱 Seeds — Banco de dados", "categoria": "🟢 Banco e segurança", "assunto": "Ciclo dos seeds, exceções e `database/SEEDS-APLICADOS.md`", "ordem": 11, "titulo": "Ciclo", "tipo": "Fluxo", "texto": "| Status | Significado | Próxima ação |\n|--------|-------------|--------------|\n| **PENDENTE** | `.sql` gerado, nunca rodado | Aplicar no Supabase |\n| **APLICADO** | Rodado, ainda não conferido (ou md5 não bateu) | Conferir md5 |\n| **CONCLUÍDO** | Rodado e conferido ✅ | — |\n| **SUBSTITUÍDO** | Não será usado (outro seed já CONCLUÍDO) ✅ | — |"}, {"arquivo": "seeds.md", "tituloArquivo": "🌱 Seeds — Banco de dados", "categoria": "🟢 Banco e segurança", "assunto": "Ciclo dos seeds, exceções e `database/SEEDS-APLICADOS.md`", "ordem": 11, "titulo": "Antes de QUALQUER tarefa nova", "tipo": "Obrigatória", "texto": "Todo seed precisa estar **CONCLUÍDO** ou **SUBSTITUÍDO**. Se houver PENDENTE ou APLICADO:\naplicar → conferir md5 → registrar CONCLUÍDO → só então a tarefa nova. Exceções (decididas em\n2026-10-13), em que se segue sem travar:\n\n| Situação | O que fazer |\n|----------|-------------|\n| Frente **sem banco** (nuvem, outras IAs — `multiplas-ias.md`) | Não aplica; deixa recado em `tasks/RECADOS.md` para a frente local e segue com tarefa sem banco |\n| Seed de tarefa **reservada por outra frente** | Fica com a frente dona (item da etapa dela) |\n| Seed que depende de **ação ou decisão do usuário** | Item 👀 na etapa da tarefa dona |\n\nO ciclo de seeds **não é tarefa grande**: não precisa de plano nem de aprovação (autorização\npermanente abaixo)."}, {"arquivo": "seeds.md", "tituloArquivo": "🌱 Seeds — Banco de dados", "categoria": "🟢 Banco e segurança", "assunto": "Ciclo dos seeds, exceções e `database/SEEDS-APLICADOS.md`", "ordem": 11, "titulo": "Scripts (nunca montar à mão)", "tipo": "Proibição", "texto": "Rodar na raiz do repositório. Python no Windows: `C:\\Python314\\python.exe`; na nuvem: `python3`.\nRascunhos (lotes, JSON) ficam na pasta temporária da sessão, nunca no repositório.\n\n```bash\npython scripts/seeds/dividir_seed.py database/<seed>.sql <pasta-lotes>\npython scripts/seeds/comparar_md5.py <pasta-lotes>/esperado.json <pasta-lotes>/resultado.json\npython scripts/seeds/registrar_seed.py <seed>.sql CONCLUÍDO \"<observação com ids>\"\n```\n\n- O lote só **acrescenta** itens. Se a atividade já tiver itens diferentes no banco, avisar o\n  usuário (apagar exige pedido e backup)."}, {"arquivo": "seeds.md", "tituloArquivo": "🌱 Seeds — Banco de dados", "categoria": "🟢 Banco e segurança", "assunto": "Ciclo dos seeds, exceções e `database/SEEDS-APLICADOS.md`", "ordem": 11, "titulo": "Autorização permanente (desde 2026-10-09)", "tipo": "Obrigatória", "texto": "Sem perguntar de novo: aplicar PENDENTE, conferir APLICADO, marcar CONCLUÍDO, registrar e fazer\ncommit + push. Qualquer outra mudança no banco de produção continua exigindo autorização."}, {"arquivo": "materias-global.md", "tituloArquivo": "📚 Matérias — Regra Global", "categoria": "🔵 Conteúdo das matérias", "assunto": "Estrutura de pasta, 1 aula = 4 h, fontes do conteúdo, hierarquia, critério de pronto", "ordem": 12, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Vale para todas as matérias (substituiu a antiga \"matéria modelo ITIC\"). Detalhes com exemplos:\n`docs/regras/materias.md`."}, {"arquivo": "materias-global.md", "tituloArquivo": "📚 Matérias — Regra Global", "categoria": "🔵 Conteúdo das matérias", "assunto": "Estrutura de pasta, 1 aula = 4 h, fontes do conteúdo, hierarquia, critério de pronto", "ordem": 12, "titulo": "Estrutura de pasta (com os 5 status)", "tipo": "Obrigatória", "texto": "```\nMATERIAIS/<CURSO>/<MATERIA>/\n├── EMENTA-CHALKIE-AI.md            ← fonte do conteúdo\n├── materia.json                    ← dados da ementa e plano das aulas (`apostilas.md`)\n├── STATUS-EMENTAS.md               ← status 1\n├── STATUS_MATERIA.md               ← status 2\n├── CONTEUDO/\n│   └── AULA-NN-DESCRICAO-CURTA.md  ← uma aula por arquivo\n├── AULAS/STATUS-AULAS.md           ← status 3\n├── ATIVIDADES/STATUS-ATIVIDADES.md ← status 4 (atividades: `atividades-banco.md`)\n├── APOSTILA/\n│   ├── APOSTILA-<MATERIA>.md + .html\n│   └── STATUS-APOSTILA.md          ← status 5\n└── DOCUMENTACAO/\n```\n\nOs nomes acima são os reais (inclusive `STATUS_MATERIA.md` com sublinhado)."}, {"arquivo": "materias-global.md", "tituloArquivo": "📚 Matérias — Regra Global", "categoria": "🔵 Conteúdo das matérias", "assunto": "Estrutura de pasta, 1 aula = 4 h, fontes do conteúdo, hierarquia, critério de pronto", "ordem": 12, "titulo": "1 aula = 4 horas", "tipo": "Obrigatória", "texto": "- 1 aula a cada 4 h da carga horária da ementa (arredondando para cima).\n- Arquivo `CONTEUDO/AULA-NN-DESCRICAO-CURTA.md`; as partes da aula estão em\n  `docs/regras/materias.md` §3. O plano de cada aula (tema, domínios, capacidades…) fica só no\n  `materia.json`."}, {"arquivo": "materias-global.md", "tituloArquivo": "📚 Matérias — Regra Global", "categoria": "🔵 Conteúdo das matérias", "assunto": "Estrutura de pasta, 1 aula = 4 h, fontes do conteúdo, hierarquia, critério de pronto", "ordem": 12, "titulo": "Fontes do conteúdo", "tipo": "Proibição", "texto": "- ✅ `EMENTA-CHALKIE-AI.md` (principal) e os Markdowns da matéria; ementa da UC no curso vence a\n  da matéria.\n- ❌ Nunca ler de PDF.\n- ❌ Nunca usar conteúdo, bibliografia ou capacidade de outra UC.\n- ❌ Nunca usar matéria semelhante como base sem pedir ao usuário. Matéria semelhante é **outra\n  linha** da tabela `materia` (não reaproveitar a linha)."}, {"arquivo": "materias-global.md", "tituloArquivo": "📚 Matérias — Regra Global", "categoria": "🔵 Conteúdo das matérias", "assunto": "Estrutura de pasta, 1 aula = 4 h, fontes do conteúdo, hierarquia, critério de pronto", "ordem": 12, "titulo": "Hierarquia no banco", "tipo": "Obrigatória", "texto": "```\ncurso → materia → aulas → atividade → resposta\n```"}, {"arquivo": "materias-global.md", "tituloArquivo": "📚 Matérias — Regra Global", "categoria": "🔵 Conteúdo das matérias", "assunto": "Estrutura de pasta, 1 aula = 4 h, fontes do conteúdo, hierarquia, critério de pronto", "ordem": 12, "titulo": "Critério de pronto", "tipo": "Obrigatória", "texto": "✅ Aulas em `CONTEUDO/` · ✅ Atividades no banco · ✅ Apostila (Markdown 100% + HTML) ·\n✅ Seeds CONCLUÍDO · ✅ Os 5 status em ✅"}, {"arquivo": "apostilas.md", "tituloArquivo": "📘 Apostilas e dados da ementa (`materia.json`)", "categoria": "🔵 Conteúdo das matérias", "assunto": "`materia.json`, fluxo da apostila, identificação, PDF", "ordem": 13, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Estrutura de pastas da matéria: `materias-global.md`. Detalhes: `docs/regras/apostilas.md`."}, {"arquivo": "apostilas.md", "tituloArquivo": "📘 Apostilas e dados da ementa (`materia.json`)", "categoria": "🔵 Conteúdo das matérias", "assunto": "`materia.json`, fluxo da apostila, identificação, PDF", "ordem": 13, "titulo": "Antes de gerar", "tipo": "Obrigatória", "texto": "- Ler a **ementa da matéria** e a da **UC no curso** (a do curso vence). Fontes permitidas e\n  proibidas: `materias-global.md` (\"Fontes do conteúdo\")."}, {"arquivo": "apostilas.md", "tituloArquivo": "📘 Apostilas e dados da ementa (`materia.json`)", "categoria": "🔵 Conteúdo das matérias", "assunto": "`materia.json`, fluxo da apostila, identificação, PDF", "ordem": 13, "titulo": "`materia.json` — arquivo único de dados da matéria", "tipo": "Obrigatória", "texto": "- Fica em `<MATERIA>/materia.json` (substituiu `atividades.json` e `apostila.json`).\n- Contém as **capacidades** (básicas e socioemocionais) e os **conhecimentos** (domínios e\n  conteúdos) da ementa, sem repetir dados em outro JSON.\n- Traz o **plano de aulas: 1 aula de 4 horas = 1 capítulo** (tema, domínios, capacidades, conteúdos\n  oficiais × detalhamento didático, indicadores, situação-problema, atividade, estratégias).\n- Todos os geradores leem dele (`assets/gerador-materia/materia.py`)."}, {"arquivo": "apostilas.md", "tituloArquivo": "📘 Apostilas e dados da ementa (`materia.json`)", "categoria": "🔵 Conteúdo das matérias", "assunto": "`materia.json`, fluxo da apostila, identificação, PDF", "ordem": 13, "titulo": "Fluxo da apostila", "tipo": "Fluxo", "texto": "1. Capítulos em Markdown — **um por vez, com validação do usuário**.\n2. Mínimo de **5 exercícios por capítulo**.\n3. **Markdown completo** em `<MATERIA>/APOSTILA/APOSTILA-<MATERIA>.md` (o usuário compara e\n   acrescenta dados).\n4. Só no final o **HTML**, gerado a partir do Markdown completo."}, {"arquivo": "apostilas.md", "tituloArquivo": "📘 Apostilas e dados da ementa (`materia.json`)", "categoria": "🔵 Conteúdo das matérias", "assunto": "`materia.json`, fluxo da apostila, identificação, PDF", "ordem": 13, "titulo": "Identificação (2026-10-07)", "tipo": "Obrigatória", "texto": "- Toda apostila mostra **autor, versão, data e hora** (capa e rodapé do HTML/PDF e cabeçalho do\n  Markdown completo).\n- Autor e versão no `materia.json` (`autor_apostila`, `versao_apostila`); data e hora = geração do\n  HTML. Autor padrão: **Gelvazio Camargo**.\n- Mudou o conteúdo → subir a versão (ajuste 1.0 → 1.1; mudança grande → 2.0)."}, {"arquivo": "apostilas.md", "tituloArquivo": "📘 Apostilas e dados da ementa (`materia.json`)", "categoria": "🔵 Conteúdo das matérias", "assunto": "`materia.json`, fluxo da apostila, identificação, PDF", "ordem": 13, "titulo": "PDF (2026-10-08, todas as apostilas)", "tipo": "Obrigatória", "texto": "- Rodapé de toda folha: **\"Página N de T\"** — apostila completa usa a numeração da apostila;\n  exportação parcial (ex.: só exercícios) numera as folhas exportadas (\"Página 1 de 2\").\n  Código: `assets/js/apostila.js` (`numerarPaginas`, `numerarPaginasExportadas`).\n- A **faixa azul vertical** da esquerda aparece só na tela; no PDF não sai (`@media print` em\n  `assets/css/apostila.css`), mantendo as margens para a paginação não mudar."}, {"arquivo": "atividades-banco.md", "tituloArquivo": "🗃️ Atividades — Banco, layout global, sem HTML", "categoria": "🔵 Conteúdo das matérias", "assunto": "Alvo da migração #25, tamanho padrão, \"você como aluno consultor\"", "ordem": 14, "titulo": "⚠️ Situação: alvo da migração #25 (ainda pendente)", "tipo": "Obrigatória", "texto": "O modelo abaixo foi decidido em 2026-10-11 e é o **alvo** da tarefa #25 (Etapa 143-d30a9c4d),\nque ainda não foi feita. **Até a migração terminar, vale o jeito atual** descrito em\n`docs/regras/atividades.md` (páginas e fontes por aula). ⛔ Não criar página nova por aula fora do\nplano da #25."}, {"arquivo": "atividades-banco.md", "tituloArquivo": "🗃️ Atividades — Banco, layout global, sem HTML", "categoria": "🔵 Conteúdo das matérias", "assunto": "Alvo da migração #25, tamanho padrão, \"você como aluno consultor\"", "ordem": 14, "titulo": "Alvo: questões só no banco", "tipo": "Obrigatória", "texto": "Enunciado, alternativas, gabarito e tópicos ficam **só no banco**. A página busca pelo id da\natividade e monta tudo na hora. Nada de questão em arquivo (`.md`, `.html`, `.json`) nem em\n`localStorage`. Onde o gabarito pode estar: `security-banco.md`."}, {"arquivo": "atividades-banco.md", "tituloArquivo": "🗃️ Atividades — Banco, layout global, sem HTML", "categoria": "🔵 Conteúdo das matérias", "assunto": "Alvo da migração #25, tamanho padrão, \"você como aluno consultor\"", "ordem": 14, "titulo": "Alvo: layout global", "tipo": "Obrigatória", "texto": "Uma página por tipo, para todas as matérias, que recebe o **id da atividade** (ex.:\n`atividade-objetiva.html` e `atividade-pratica.html`, criadas na #25).\n\nRecursos que toda atividade já tem (não replicar por matéria): progresso da turma, gráficos,\ncálculo de nota, mínimo de questões, correção por IA (discursiva), gabarito por turma, PDF SENAI."}, {"arquivo": "atividades-banco.md", "tituloArquivo": "🗃️ Atividades — Banco, layout global, sem HTML", "categoria": "🔵 Conteúdo das matérias", "assunto": "Alvo da migração #25, tamanho padrão, \"você como aluno consultor\"", "ordem": 14, "titulo": "Alvo: pasta da matéria só com Markdown", "tipo": "Obrigatória", "texto": "```\nMATERIAIS/<CURSO>/<MATERIA>/ATIVIDADES/\n└── STATUS-ATIVIDADES.md      (sem HTML; índice gerado por script a partir do banco)\n```"}, {"arquivo": "atividades-banco.md", "tituloArquivo": "🗃️ Atividades — Banco, layout global, sem HTML", "categoria": "🔵 Conteúdo das matérias", "assunto": "Alvo da migração #25, tamanho padrão, \"você como aluno consultor\"", "ordem": 14, "titulo": "Tamanho padrão (vale já)", "tipo": "Obrigatória", "texto": "| Tipo | Tamanho |\n|------|---------|\n| Objetiva | 50 questões |\n| Prática | 10 questões × 3 tópicos |\n| Avaliação | Conforme a ementa |"}, {"arquivo": "atividades-banco.md", "tituloArquivo": "🗃️ Atividades — Banco, layout global, sem HTML", "categoria": "🔵 Conteúdo das matérias", "assunto": "Alvo da migração #25, tamanho padrão, \"você como aluno consultor\"", "ordem": 14, "titulo": "Contexto: \"Você como aluno consultor\" (2026-10-08, vale já)", "tipo": "Obrigatória", "texto": "Vale para **toda atividade** (objetiva, prática, discursiva, avaliação, situação-problema, Excel,\nWord…).\n\n- ⛔ **Não criar empresa fictícia** (\"a empresa X Ltda.\", \"a Distribuidora Y\"…).\n- ✅ O enunciado coloca o aluno como **consultor** que analisa a situação e resolve o problema:\n  \"Você, como aluno consultor, foi chamado para organizar o controle de estoque de um\n  almoxarifado…\".\n- ✅ O contexto profissional do curso continua (almoxarifado, logística, escritório…), sem nome de\n  empresa inventada."}, {"arquivo": "faixa-materias-ensalado.md", "tituloArquivo": "🎚️ Faixa de matérias: SOMENTE ENSALADO / VER TODAS MATÉRIAS", "categoria": "🔵 Conteúdo das matérias", "assunto": "Botões SOMENTE ENSALADO / VER TODAS e ON/OFF", "ordem": 15, "titulo": "Visão geral", "tipo": "Obrigatória", "texto": "Registrada em 2026-10-08 23:42:02. Vale para qualquer faixa **\"Matérias — <CURSO> ador de regras e tarefas (`.claude/rules/index.html`)", "categoria": "⚪ Ferramentas", "assunto": "`index.html` desta pasta: só visualizador; quando regenerar", "ordem": 17, "titulo": "O que é", "tipo": "Obrigatória", "texto": "- `.claude/rules/index.html` é **só um visualizador** para o professor ler as regras e o quadro de\n  tarefas em cards (aba **REGRAS**, por categoria e tipo; aba **TASKS**, com status, frentes e\n  \"Aguardando o usuário\"). A aba TASKS substitui a antiga página `tasks.html` (desativada em\n  2026-10-13, junto com a fila `tasks` do banco).\n- ⛔ **Não é página do projeto:** não recebe header, login nem dados do banco, e nenhuma página o\n  usa como componente. O único acesso pelo site é o item **Regras** do menu do Professor\n  Administrador (`js/header-usuario.js`), que o abre em **nova aba**.\n- ⛔ **Não editar à mão:** o arquivo é gerado e qualquer edição se perde na próxima geração."}, {"arquivo": "visualizador-regras.md", "tituloArquivo": "👁️ Visualizador de regras e tarefas (`.claude/rules/index.html`)", "categoria": "⚪ Ferramentas", "assunto": "`index.html` desta pasta: só visualizador; quando regenerar", "ordem": 17, "titulo": "Quando regenerar", "tipo": "Obrigatória", "texto": "Regenerar e commitar o `index.html` **no mesmo commit** quando:\n- mudar **qualquer arquivo de `.claude/rules/`** (inclusive `tasks/`);\n- **encerrar uma tarefa** (o quadro mudou).\n\nNão regenerar na reserva nem a cada item: com várias frentes, todas mexeriam no mesmo arquivo\ngerado e o `pull --rebase` daria conflito a toda hora. Conflito no `index.html` → regenerar depois\ndo rebase (nunca resolver à mão).\n\n```bash\npython scripts/regras/gerar_visualizador_regras.py\ngit add .claude/rules/index.html\n```\n\nO topo da página mostra a data e hora da geração (a aba TASKS pode estar atrás do quadro entre\numa entrega e outra; a fonte é sempre o `tasks/STATUS.md`)."}, {"arquivo": "visualizador-regras.md", "tituloArquivo": "👁️ Visualizador de regras e tarefas (`.c   <script>// Renderizador de Markdown enxuto (títulos, listas, tabelas, código, citação e trechos em linha),
// suficiente para os arquivos de regras e do quadro. Escapa todo o HTML antes de formatar.

const PADRAO_CERCA_CODIGO = /^\s*```/;
const PADRAO_TITULO_MD = /^(#{1,6})\s+(.*)$/;
const PADRAO_ITEM_LISTA = /^\s*(?:[-*+]|\d+[.)])\s+(.*)$/;
const PADRAO_LINHA_TABELA = /^\s*\|.*\|\s*$/;
const PADRAO_SEPARADOR_TABELA = /^\s*\|?\s*:?-{2,}/;
const PADRAO_REGUA = /^\s*(-{3,}|\*{3,})\s*$/;
const NIVEL_MINIMO_TITULO = 2;

/**
 * Escapa os caracteres especiais de HTML.
 * @param {string} texto - Texto bruto.
 * @returns {string} Texto seguro para innerHTML.
 */
function escaparHtml(texto) {
  return String(texto)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

/**
 * Formata os trechos em linha: código, negrito, itálico, riscado e links.
 * @param {string} texto - Texto de uma linha.
 * @returns {string} HTML da linha.
 */
function formatarEmLinha(texto) {
  const trechosCodigo = [];
  let html = escaparHtml(texto).replace(/`([^`]+)`/g, (_, codigo) => {
    trechosCodigo.push(codigo);
    return "\u0000" + (trechosCodigo.length - 1) + "\u0000";
  });
  html = html
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/~~(.+?)~~/g, "<del>$1</del>")
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<span title="$2">$1</span>');
  return html.replace(/\u0000(\d+)\u0000/g, (_, indice) => "<code>" + trechosCodigo[indice] + "</code>");
}

/**
 * Separa as células de uma linha de tabela, respeitando `|` dentro de crases.
 * @param {string} linha - Linha da tabela.
 * @returns {string[]} Células.
 */
function dividirCelulasMd(linha) {
  const celulas = [];
  let atual = "";
  let dentroDeCrase = false;
  for (const caractere of linha.trim().replace(/^\||\|$/g, "")) {
    if (caractere === "`") dentroDeCrase = !dentroDeCrase;
    const fechaCelula = caractere === "|" && !dentroDeCrase && !atual.endsWith("\\");
    if (fechaCelula) {
      celulas.push(atual.trim());
      atual = "";
      continue;
    }
    atual += caractere;
  }
  celulas.push(atual.trim());
  return celulas;
}

/**
 * Monta uma tabela HTML a partir das linhas Markdown.
 * @param {string[]} linhas - Cabeçalho, separador e linhas de dados.
 * @returns {string} HTML da tabela.
 */
function montarTabelaMd(linhas) {
  const cabecalho = dividirCelulasMd(linhas[0]).map((celula) => "<th>" + formatarEmLinha(celula) + "</th>");
  const corpo = linhas.slice(2).map((linha) => {
    const celulas = dividirCelulasMd(linha).map((celula) => "<td>" + formatarEmLinha(celula) + "</td>");
    return "<tr>" + celulas.join("") + "</tr>";
  });
  return '<div class="tabela-rolagem"><table><thead><tr>' + cabecalho.join("") +
    "</tr></thead><tbody>" + corpo.join("") + "</tbody></table></div>";
}

/**
 * Lê um bloco de linhas consecutivas que obedecem a uma condição.
 * @param {{linhas: string[], inicio: number, condicao: Function}} leitura - Linhas, posição e teste.
 * @returns {{bloco: string[], fim: number}} Linhas do bloco e a posição seguinte.
 */
function lerBlocoMd(leitura) {
  const { linhas, inicio, condicao } = leitura;
  let fim = inicio;
  while (fim < linhas.length && condicao(linhas[fim])) fim += 1;
  return { bloco: linhas.slice(inicio, fim), fim };
}

/**
 * Converte o bloco que começa na linha indicada e diz onde ele termina.
 * @param {string[]} linhas - Todas as linhas do texto.
 * @param {number} inicio - Linha atual.
 * @returns {{html: string, fim: number}} HTML do bloco e a próxima linha a ler.
 */
function converterBlocoMd(linhas, inicio) {
  const linha = linhas[inicio];
  if (PADRAO_CERCA_CODIGO.test(linha)) {
    const { bloco, fim } = lerBlocoMd({ linhas, inicio: inicio + 1, condicao: (item) => !PADRAO_CERCA_CODIGO.test(item) });
    return { html: "<pre><code>" + escaparHtml(bloco.join("\n")) + "</code></pre>", fim: fim + 1 };
  }
  const titulo = linha.match(PADRAO_TITULO_MD);
  if (titulo) {
    const nivel = Math.max(titulo[1].length, NIVEL_MINIMO_TITULO);
    return { html: `<h${nivel}>${formatarEmLinha(titulo[2])}</h${nivel}>`, fim: inicio + 1 };
  }
  if (PADRAO_REGUA.test(linha)) return { html: "<hr>", fim: inicio + 1 };
  const ehTabela = PADRAO_LINHA_TABELA.test(linha) && PADRAO_SEPARADOR_TABELA.test(linhas[inicio + 1] || "");
  if (ehTabela) {
    const { bloco, fim } = lerBlocoMd({ linhas, inicio, condicao: (item) => PADRAO_LINHA_TABELA.test(item) });
    return { html: montarTabelaMd(bloco), fim };
  }
  return converterBlocoTextoMd(linhas, inicio);
}

/**
 * Converte citação, lista ou parágrafo.
 * @param {string[]} linhas - Todas as linhas do texto.
 * @param {number} inicio - Linha atual.
 * @returns {{html: string, fim: number}} HTML do bloco e a próxima linha a ler.
 */
function converterBlocoTextoMd(linhas, inicio) {
  if (linhas[inicio].trim().startsWith(">")) {
    const { bloco, fim } = lerBlocoMd({ linhas, inicio, condicao: (item) => item.trim().startsWith(">") });
    const texto = bloco.map((item) => item.trim().replace(/^>\s?/, "")).join("\n");
    return { html: "<blockquote>" + markdownParaHtml(texto) + "</blockquote>", fim };
  }
  if (PADRAO_ITEM_LISTA.test(linhas[inicio])) {
    const continuaLista = (item) => PADRAO_ITEM_LISTA.test(item) || /^\s{2,}\S/.test(item);
    const { bloco, fim } = lerBlocoMd({ linhas, inicio, condicao: continuaLista });
    const itens = bloco.map((item) => {
      const conteudo = item.match(PADRAO_ITEM_LISTA)?.[1] ?? item.trim();
      return "<li>" + formatarEmLinha(conteudo) + "</li>";
    });
    return { html: "<ul>" + itens.join("") + "</ul>", fim };
  }
  const ehParagrafo = (item) => item.trim() !== "" && !PADRAO_TITULO_MD.test(item) &&
    !PADRAO_CERCA_CODIGO.test(item) && !PADRAO_LINHA_TABELA.test(item) && !PADRAO_ITEM_LISTA.test(item);
  const { bloco, fim } = lerBlocoMd({ linhas, inicio, condicao: ehParagrafo });
  if (!bloco.length) {
    const linhaSolta = linhas[inicio].trim();
    return { html: linhaSolta ? "<p>" + formatarEmLinha(linhaSolta) + "</p>" : "", fim: inicio + 1 };
  }
  return { html: "<p>" + bloco.map(formatarEmLinha).join("<br>") + "</p>", fim };
}

/**
 * Converte um texto Markdown em HTML.
 * @param {string} texto - Markdown.
 * @returns {string} HTML.
 */
function markdownParaHtml(texto) {
  const linhas = String(texto || "").split(/\r?\n/);
  const partes = [];
  let posicao = 0;
  while (posicao < linhas.length) {
    const { html, fim } = converterBlocoMd(linhas, posicao);
    partes.push(html);
    posicao = fim;
  }
  return partes.join("\n");
}


// Visualizador de regras e tarefas: abas, cartões, filtros e modal. Os dados vêm embutidos no
// <script id="dados"> pelo gerador scripts/regras/gerar_visualizador_regras.py.

const TODOS = "Todos";
const TAMANHO_RESUMO_CARTAO = 170;
const ORDEM_SITUACOES = ["Em andamento", "Aguardando", "Pendente", "Cancelada/Bloqueada", "Concluída"];
const COLUNAS_FRENTE = { titulo: "Frente", situacao: "Situação" };
const DADOS = JSON.parse(document.getElementById("dados").textContent);
const estadoFiltros = { categoria: TODOS, tipo: TODOS, situacao: TODOS, buscaRegras: "", buscaTasks: "" };

/**
 * Transforma um texto em sufixo de classe CSS (sem acentos, espaços ou barras).
 * @param {string} texto - Texto original.
 * @returns {string} Sufixo em kebab-case.
 */
function paraClasse(texto) {
  return String(texto).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").replace("cancelada-bloqueada", "canceladabloqueada");
}

/**
 * Resume um Markdown em texto corrido para o cartão.
 * @param {string} texto - Markdown.
 * @returns {string} Começo do texto sem marcações.
 */
function resumirTexto(texto) {
  const limpo = String(texto || "").replace(/```[\s\S]*?```/g, " ").replace(/[#>*`|_~-]+/g, " ")
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/\s+/g, " ").trim();
  if (limpo.length <= TAMANHO_RESUMO_CARTAO) return limpo;
  return limpo.slice(0, TAMANHO_RESUMO_CARTAO).trimEnd() + "…";
}

/**
 * Cria um elemento com classe e texto.
 * @param {string} tag - Nome da tag.
 * @param {string} classe - Classes CSS.
 * @param {string} [texto] - Texto do elemento.
 * @returns {HTMLElement} Elemento criado.
 */
function criarElemento(tag, classe, texto = "") {
  const elemento = document.createElement(tag);
  elemento.className = classe;
  elemento.textContent = texto;
  return elemento;
}

/**
 * Cria uma etiqueta colorida.
 * @param {string} texto - Texto da etiqueta.
 * @param {string} [classeCor] - Classe que define a cor.
 * @returns {HTMLElement} Etiqueta.
 */
function criarEtiqueta(texto, classeCor = "") {
  return criarElemento("span", ("etiqueta " + classeCor).trim(), texto);
}

/**
 * Abre o modal com título, etiquetas e conteúdo Markdown.
 * @param {{titulo: string, etiquetas: HTMLElement[], markdown: string}} conteudo - O que mostrar.
 */
function abrirModal(conteudo) {
  document.getElementById("modal-titulo").textContent = conteudo.titulo;
  document.getElementById("modal-etiquetas").replaceChildren(...conteudo.etiquetas);
  document.getElementById("modal-corpo").innerHTML = markdownParaHtml(conteudo.markdown);
  document.getElementById("modal").showModal();
}

/**
 * Cria um cartão clicável.
 * @param {{titulo: string, texto: string, classe: string, etiquetas: HTMLElement[]}} dados - Conteúdo.
 * @param {Function} aoClicar - Ação ao clicar.
 * @returns {HTMLButtonElement} Cartão.
 */
function criarCartao(dados, aoClicar) {
  const cartao = criarElemento("button", "cartao " + dados.classe);
  cartao.type = "button";
  const rodape = criarElemento("div", "cartao__rodape");
  rodape.append(...dados.etiquetas);
  cartao.append(criarElemento("span", "cartao__titulo", dados.titulo),
    criarElemento("span", "cartao__texto", dados.texto), rodape);
  cartao.addEventListener("click", aoClicar);
  return cartao;
}

/**
 * Cria a barra de chips de um filtro.
 * @param {{idDestino: string, opcoes: string[], chave: string}} filtro - Onde, quais opções e qual estado.
 * @param {Function} aoMudar - Redesenho a chamar depois da escolha.
 */
function criarChips(filtro, aoMudar) {
  const destino = document.getElementById(filtro.idDestino);
  const opcoes = [TODOS, ...filtro.opcoes];
  const chips = opcoes.map((opcao) => {
    const chip = criarElemento("button", "chip", opcao);
    chip.type = "button";
    chip.classList.toggle("chip--ativo", opcao === estadoFiltros[filtro.chave]);
    chip.addEventListener("click", () => {
      estadoFiltros[filtro.chave] = opcao;
      chips.forEach((outro) => outro.classList.toggle("chip--ativo", outro === chip));
      aoMudar();
    });
    return chip;
  });
  destino.replaceChildren(...chips);
}

/**
 * Lista os valores distintos de um campo, na ordem em que aparecem.
 * @param {Object[]} itens - Registros.
 * @param {string} campo - Nome do campo.
 * @returns {string[]} Valores sem repetição.
 */
function valoresDistintos(itens, campo) {
  return [...new Set(itens.map((item) => item[campo]).filter(Boolean))];
}

/**
 * Diz se o texto do registro contém a busca (sem diferenciar maiúsculas).
 * @param {Object} registro - Registro com campos de texto.
 * @param {string} busca - Texto procurado.
 * @returns {boolean} Verdadeiro se combina ou se a busca está vazia.
 */
function combinaBusca(registro, busca) {
  if (!busca) return true;
  return JSON.stringify(registro).toLowerCase().includes(busca.toLowerCase());
}


// Aba REGRAS: seções dos arquivos de .claude/rules/ em cartões, agrupadas por categoria e arquivo.

/**
 * Abre o modal com o texto completo de uma seção de regra.
 * @param {Object} secao - Seção (arquivo, título, categoria, tipo, texto).
 */
function abrirRegra(secao) {
  abrirModal({
    titulo: secao.titulo,
    etiquetas: [
      criarEtiqueta(secao.categoria),
      criarEtiqueta(secao.tipo, "tipo--" + paraClasse(secao.tipo)),
      criarEtiqueta(secao.arquivo),
    ],
    markdown: secao.texto,
  });
}

/**
 * Cria o cartão de uma seção de regra.
 * @param {Object} secao - Seção da regra.
 * @returns {HTMLButtonElement} Cartão.
 */
function criarCartaoRegra(secao) {
  const classeTipo = "tipo--" + paraClasse(secao.tipo);
  return criarCartao({
    titulo: secao.titulo,
    texto: resumirTexto(secao.texto),
    classe: classeTipo,
    etiquetas: [criarEtiqueta(secao.tipo, classeTipo), criarEtiqueta(secao.arquivo)],
  }, () => abrirRegra(secao));
}

/**
 * Filtra as seções pelo estado atual (categoria, tipo e busca).
 * @returns {Object[]} Seções visíveis.
 */
function filtrarRegras() {
  return DADOS.regras.filter((secao) => {
    const categoriaCombina = estadoFiltros.categoria === TODOS || secao.categoria === estadoFiltros.categoria;
    const tipoCombina = estadoFiltros.tipo === TODOS || secao.tipo === estadoFiltros.tipo;
    return categoriaCombina && tipoCombina && combinaBusca(secao, estadoFiltros.buscaRegras);
  });
}

/**
 * Agrupa seções por uma chave, mantendo a ordem de chegada.
 * @param {Object[]} itens - Registros.
 * @param {string} campo - Campo usado como chave.
 * @returns {Map<string, Object[]>} Grupos.
 */
function agruparPor(itens, campo) {
  const grupos = new Map();
  itens.forEach((item) => {
    if (!grupos.has(item[campo])) grupos.set(item[campo], []);
    grupos.get(item[campo]).push(item);
  });
  return grupos;
}

/**
 * Monta o bloco de um arquivo: nome, assunto e a grade de cartões.
 * @param {string} arquivo - Nome do arquivo.
 * @param {Object[]} secoes - Seções desse arquivo.
 * @returns {HTMLElement} Bloco do arquivo.
 */
function montarBlocoArquivo(arquivo, secoes) {
  const bloco = criarElemento("div", "grupo__bloco");
  const titulo = criarElemento("p", "grupo__arquivo");
  const nome = criarElemento("code", "", arquivo);
  const assunto = secoes[0].assunto || secoes[0].tituloArquivo;
  titulo.append(nome, document.createTextNode(" — " + assunto));
  const grade = criarElemento("div", "grade");
  grade.append(...secoes.map(criarCartaoRegra));
  bloco.append(titulo, grade);
  return bloco;
}

/**
 * Redesenha a lista de regras conforme os filtros.
 */
function desenharRegras() {
  const visiveis = filtrarRegras();
  const destino = document.getElementById("lista-regras");
  document.getElementById("contagem-regras").textContent =
    `${visiveis.length} de ${DADOS.regras.length} seções de regras`;
  if (!visiveis.length) {
    destino.replaceChildren(criarElemento("p", "vazio", "Nenhuma regra encontrada."));
    return;
  }
  const grupos = [...agruparPor(visiveis, "categoria")].map(([categoria, secoes]) => {
    const grupo = criarElemento("section", "grupo");
    grupo.append(criarElemento("h2", "grupo__titulo", categoria));
    agruparPor(secoes, "arquivo").forEach((doArquivo, arquivo) => {
      grupo.append(montarBlocoArquivo(arquivo, doArquivo));
    });
    return grupo;
  });
  destino.replaceChildren(...grupos);
}

/**
 * Prepara a aba REGRAS: chips de categoria e tipo, busca e primeira renderização.
 */
function iniciarAbaRegras() {
  criarChips({ idDestino: "filtro-categorias", opcoes: valoresDistintos(DADOS.regras, "categoria"),
    chave: "categoria" }, desenharRegras);
  criarChips({ idDestino: "filtro-tipos", opcoes: valoresDistintos(DADOS.regras, "tipo"),
    chave: "tipo" }, desenharRegras);
  document.getElementById("busca-regras").addEventListener("input", (evento) => {
    estadoFiltros.buscaRegras = evento.target.value.trim();
    desenharRegras();
  });
  desenharRegras();
}


// Aba TASKS: tarefas do tasks/STATUS.md (com a etapa de cada uma), frentes e itens 👀 das etapas.

/**
 * Monta o Markdown completo de uma tarefa para o modal.
 * @param {Object} tarefa - Linha da tabela de tarefas com as etapas e o próximo passo.
 * @returns {string} Markdown do detalhamento.
 */
function montarMarkdownTarefa(tarefa) {
  const resumo = [
    "| Campo | Valor |", "|---|---|",
    `| Status | ${tarefa["Status"] || "—"} |`,
    `| Prioridade | ${tarefa["Prioridade"] || "—"} |`,
    `| Depende de | ${tarefa["Depende de"] || "—"} |`,
    `| Próximo passo (da etapa) | ${tarefa.proximo || "—"} |`,
    `| Em uso por | ${tarefa["Em uso por"] || "—"} |`,
  ].join("\n");
  const partes = ["## Situação no quadro", resumo];
  tarefa.etapas.forEach((etapa) => partes.push("---", etapa.texto));
  if (!tarefa.etapas.length) partes.push("*Sem etapa ligada a esta tarefa.*");
  return partes.join("\n\n");
}

/**
 * Abre o modal da tarefa.
 * @param {Object} tarefa - Tarefa do quadro.
 */
function abrirTarefa(tarefa) {
  const classe = "situacao--" + paraClasse(tarefa.situacao);
  abrirModal({
    titulo: `${tarefa["Tarefa"]} — ${tarefa["Título"]}`,
    etiquetas: [criarEtiqueta(tarefa.situacao, classe),
      ...tarefa.etapas.map((etapa) => criarEtiqueta(etapa.arquivo.replace(/\.md$/, "")))],
    markdown: montarMarkdownTarefa(tarefa),
  });
}

/**
 * Cria o cartão de uma tarefa.
 * @param {Object} tarefa - Tarefa do quadro.
 * @returns {HTMLButtonElement} Cartão.
 */
function criarCartaoTarefa(tarefa) {
  const classe = "situacao--" + paraClasse(tarefa.situacao);
  const codigoCurto = tarefa["Tarefa"].split("-")[0];
  const etiquetas = [criarEtiqueta(codigoCurto), criarEtiqueta(tarefa.situacao, classe)];
  const emUso = tarefa["Em uso por"];
  if (emUso && emUso !== "—") etiquetas.push(criarEtiqueta("🔒 " + emUso.split(" (")[0]));
  return criarCartao({
    titulo: tarefa["Título"],
    texto: resumirTexto(tarefa["Status"] + " · Próximo: " + (tarefa.proximo || "—")),
    classe,
    etiquetas,
  }, () => abrirTarefa(tarefa));
}

/**
 * Desenha os contadores por situação.
 */
function desenharResumoTarefas() {
  const itens = ORDEM_SITUACOES.map((situacao) => {
    const total = DADOS.tasks.tarefas.filter((tarefa) => tarefa.situacao === situacao).length;
    const item = criarElemento("div", "resumo__item situacao--" + paraClasse(situacao));
    item.append(criarElemento("span", "resumo__numero", String(total)),
      criarElemento("span", "resumo__rotulo", situacao));
    return item;
  });
  document.getElementById("resumo-tasks").replaceChildren(...itens);
}

/**
 * Redesenha a lista de tarefas conforme a situação e a busca.
 */
function desenharTarefas() {
  const visiveis = DADOS.tasks.tarefas.filter((tarefa) => {
    const situacaoCombina = estadoFiltros.situacao === TODOS || tarefa.situacao === estadoFiltros.situacao;
    return situacaoCombina && combinaBusca(tarefa, estadoFiltros.buscaTasks);
  });
  const ordenadas = [...visiveis].sort((a, b) =>
    ORDEM_SITUACOES.indexOf(a.situacao) - ORDEM_SITUACOES.indexOf(b.situacao));
  document.getElementById("contagem-tasks").textContent =
    `${visiveis.length} de ${DADOS.tasks.tarefas.length} tarefas`;
  const destino = document.getElementById("lista-tasks");
  if (!ordenadas.length) {
    destino.replaceChildren(criarElemento("p", "vazio", "Nenhuma tarefa encontrada."));
    return;
  }
  destino.replaceChildren(...ordenadas.map(criarCartaoTarefa));
}

/**
 * Desenha as frentes de trabalho como cartões que abrem o detalhe da frente.
 */
function desenharFrentes() {
  const cartoes = DADOS.tasks.frentes.map((frente) => {
    const situacao = frente[COLUNAS_FRENTE.situacao] || "";
    const { proximo, ...colunas } = frente;
    const campos = [...Object.entries(colunas), ["Próximo passo (da etapa)", proximo]];
    const markdown = campos.map(([campo, valor]) => `### ${campo}\n\n${valor || "—"}`).join("\n\n");
    return criarCartao({
      titulo: frente[COLUNAS_FRENTE.titulo] || "Frente",
      texto: resumirTexto(proximo || ""),
      classe: "situacao--" + paraClasse(situacao.includes("✅") ? "Concluída" : "Em andamento"),
      etiquetas: [criarEtiqueta(situacao), criarEtiqueta(frente["Atualizado em"] || "")],
    }, () => abrirModal({ titulo: frente[COLUNAS_FRENTE.titulo], etiquetas: [criarEtiqueta(situacao)], markdown }));
  });
  const destino = document.getElementById("lista-frentes");
  destino.replaceChildren(...(cartoes.length ? cartoes : [criarElemento("p", "vazio", "Nenhuma frente.")]));
}

/**
 * Desenha a tabela "Aguardando o usuário" (itens 👀 das etapas, calculados pelo gerador).
 */
function desenharAguardando() {
  const linhas = DADOS.tasks.aguardando;
  const destino = document.getElementById("lista-aguardando");
  if (!linhas.length) {
    destino.replaceChildren(criarElemento("p", "vazio", "Nada aguardando o usuário."));
    return;
  }
  const colunas = Object.keys(linhas[0]);
  const markdown = ["| " + colunas.join(" | ") + " |", "|" + colunas.map(() => "---").join("|") + "|",
    ...linhas.map((linha) => "| " + colunas.map((coluna) => linha[coluna] || "").join(" | ") + " |")].join("\n");
  destino.innerHTML = markdownParaHtml(markdown);
}

/**
 * Prepara a aba TASKS.
 */
function iniciarAbaTasks() {
  criarChips({ idDestino: "filtro-situacoes", opcoes: ORDEM_SITUACOES, chave: "situacao" }, desenharTarefas);
  document.getElementById("busca-tasks").addEventListener("input", (evento) => {
    estadoFiltros.buscaTasks = evento.target.value.trim();
    desenharTarefas();
  });
  desenharResumoTarefas();
  desenharTarefas();
  desenharFrentes();
  desenharAguardando();
}


// Inicialização: data de geração, troca de abas (lembrada na URL com #regras / #tasks) e modal.

const ABA_PADRAO = "regras";

/**
 * Mostra a aba pedida e marca o botão correspondente.
 * @param {string} aba - "regras" ou "tasks".
 */
function mostrarAba(aba) {
  document.querySelectorAll("[data-aba]").forEach((botao) => {
    const ativa = botao.dataset.aba === aba;
    botao.classList.toggle("abas__botao--ativa", ativa);
    botao.setAttribute("aria-selected", String(ativa));
  });
  document.getElementById("painel-regras").hidden = aba !== "regras";
  document.getElementById("painel-tasks").hidden = aba !== "tasks";
}

/**
 * Liga os botões das abas e abre a aba indicada no endereço (#tasks), se houver.
 */
function iniciarAbas() {
  document.querySelectorAll("[data-aba]").forEach((botao) => {
    botao.addEventListener("click", () => {
      history.replaceState(null, "", "#" + botao.dataset.aba);
      mostrarAba(botao.dataset.aba);
    });
  });
  const abaDoEndereco = location.hash.replace("#", "");
  mostrarAba(["regras", "tasks"].includes(abaDoEndereco) ? abaDoEndereco : ABA_PADRAO);
}

/**
 * Liga o fechamento do modal: botão ✕, clique fora da caixa e tecla Esc (nativa do dialog).
 */
function iniciarModal() {
  const modal = document.getElementById("modal");
  document.getElementById("modal-fechar").addEventListener("click", () => modal.close());
  modal.addEventListener("click", (evento) => {
    if (evento.target === modal) modal.close();
  });
}

document.getElementById("data-geracao").textContent = DADOS.geradoEm;
iniciarAbas();
iniciarModal();
iniciarAbaRegras();
iniciarAbaTasks();
</script>
