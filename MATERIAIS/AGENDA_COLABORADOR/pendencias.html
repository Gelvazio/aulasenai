<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
<script src="../../js/header-usuario.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendências de aulas</title>
    <link rel="stylesheet" href="../../assets/css/criar-usuarios-comando.css">
    <link rel="stylesheet" href="../../assets/css/header-usuario.css">
    <link rel="stylesheet" href="../../assets/css/turmas-professor.css">
    <link rel="stylesheet" href="../../assets/css/pendencias.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/supabase.js" defer></script>
    <script src="../../assets/js/popup.js" defer></script>
    <script src="../../assets/js/pendencias-repositorio.js" defer></script>
    <script src="../../assets/js/pendencias-pagina.js" defer></script>
    <script src="../../assets/js/pendencias-modal.js" defer></script>
</head>
<body>
    <div id="header-usuario"></div>
    <main class="guia">
        <header class="guia-cabecalho">
            <h1>📌 Pendências de aulas</h1>
            <p>Cadastro das pendências de aulas — uso exclusivo do Professor Administrador</p>
        </header>

        <section class="guia-cartao guia-erro" id="pdBloqueio" hidden></section>

        <div id="pdConteudo" hidden>
            <section class="guia-cartao">
                <h2>Filtros</h2>
                <form id="pdFiltros" class="pd-filtros">
                    <label class="tp-campo">ID
                        <input id="pdFiltroId" class="guia-filtro" type="number" min="1" step="1">
                    </label>
                    <label class="tp-campo">Nome contém
                        <input id="pdFiltroNome" class="guia-filtro" type="search">
                    </label>
                    <label class="tp-campo">Descrição contém
                        <input id="pdFiltroDescricao" class="guia-filtro" type="search">
                    </label>
                    <label class="tp-campo">Responsável contém
                        <input id="pdFiltroResponsavel" class="guia-filtro" type="search">
                    </label>
                    <label class="tp-campo">Início de
                        <input id="pdFiltroDataDe" class="guia-filtro" type="date">
                    </label>
                    <label class="tp-campo">Início até
                        <input id="pdFiltroDataAte" class="guia-filtro" type="date">
                    </label>
                    <label class="tp-campo">Status
                        <select id="pdFiltroStatus" class="guia-filtro"></select>
                    </label>
                    <label class="tp-campo">Excluído
                        <select id="pdFiltroExcluido" class="guia-filtro"></select>
                    </label>
                    <div class="tp-acoes">
                        <button type="reset" class="guia-botao tp-botao-secundario pd-botao-largo" id="pdLimparFiltros">Limpar filtros</button>
                    </div>
                </form>
            </section>

            <section class="guia-cartao">
                <div class="pd-cabecalho-lista">
                    <h2>Pendências cadastradas</h2>
                    <button type="button" class="guia-botao pd-botao-largo" id="pdNovaPendencia">➕ Nova Pendência</button>
                </div>
                <p id="pdResumo" class="tp-resumo"></p>
                <div class="tp-tabela-rolagem">
                    <table class="guia-tabela pd-tabela">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Descrição</th>
                                <th>Responsável</th>
                                <th>Data de início</th>
                                <th>Status</th>
                                <th>Excluído</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="pdLinhas"></tbody>
                    </table>
                </div>
            </section>
        </div>

        <div id="pdModal" class="tp-modal" hidden>
            <form id="pdFormulario" class="tp-modal__caixa pd-modal__caixa" role="dialog" aria-modal="true"
                aria-labelledby="pdTituloFormulario">
                <div class="pd-modal__topo">
                    <h2 id="pdTituloFormulario">Nova pendência</h2>
                    <button type="button" class="tp-botao-icone" data-fechar-modal aria-label="Fechar">✖</button>
                </div>
                <label class="tp-campo">Nome
                    <input id="pdNome" class="guia-filtro" type="text" maxlength="300" required>
                </label>
                <label class="tp-campo">Descrição
                    <textarea id="pdDescricao" class="guia-filtro pd-descricao-campo" rows="4" maxlength="2000"></textarea>
                </label>
                <label class="tp-campo">Responsável
                    <input id="pdResponsavel" class="guia-filtro" type="text" maxlength="120" required>
                </label>
                <div class="pd-modal__linha">
                    <label class="tp-campo">Data de início
                        <input id="pdDataInicio" class="guia-filtro" type="date" required>
                    </label>
                    <label class="tp-campo">Status
                        <select id="pdStatus" class="guia-filtro" required></select>
                    </label>
                </div>
                <div class="tp-acoes">
                    <button type="submit" class="guia-botao" id="pdSalvar">Cadastrar</button>
                    <button type="button" class="guia-botao tp-botao-secundario" data-fechar-modal>Cancelar</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
