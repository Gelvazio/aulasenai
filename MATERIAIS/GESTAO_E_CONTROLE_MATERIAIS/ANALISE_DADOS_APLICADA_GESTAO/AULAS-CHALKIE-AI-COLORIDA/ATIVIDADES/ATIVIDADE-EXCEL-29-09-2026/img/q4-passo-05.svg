="#222" >que o Estoque Mínimo (F2)?</text><rect x="450.0" y="186.0" width="220.0" height="70.0" rx="8" fill="#ffffff" stroke="#c62828" stroke-width="2.5"/><rect x="450.0" y="186.0" width="220.0" height="26.0" rx="8" fill="#c62828"/><text x="560.0" y="204.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">SIM</text><text x="460.0" y="232.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#222" >escreve &quot;Crítico&quot;</text><rect x="40.0" y="300.0" width="300.0" height="84.0" rx="8" fill="#ffffff" stroke="#004384" stroke-width="2.5"/><rect x="40.0" y="300.0" width="300.0" height="26.0" rx="8" fill="#004384"/><text x="190.0" y="318.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Pergunta 2 (se NÃO)</text><text x="50.0" y="346.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#222" >O saldo é ATÉ 1,5 vez o</text><text x="50.0" y="364.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#222" >mínimo? (I2 &lt;= F2*1,5)</text><rect x="450.0" y="306.0" width="220.0" height="70.0" rx="8" fill="#ffffff" stroke="#b26a00" stroke-width="2.5"/><rect x="450.0" y="306.0" width="220.0" height="26.0" rx="8" fill="#b26a00"/><text x="560.0" y="324.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">SIM</text><text x="460.0" y="352.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#222" >escreve &quot;Atenção&quot;</text><rect x="450.0" y="412.0" width="220.0" height="70.0" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2.5"/><rect x="450.0" y="412.0" width="220.0" height="26.0" rx="8" fill="#2e7d32"/><text x="560.0" y="430.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">NÃO</text><text x="460.0" y="458.0" font-family="Segoe UI, Arial, sans-serif" font-siz