<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turmas × Professores</title>
    <link rel="stylesheet" href="assets/css/criar-usuarios-comando.css">
    <link rel="stylesheet" href="assets/css/header-usuario.css">
    <link rel="stylesheet" href="assets/css/turmas-professor.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js" defer></script>
    <script src="js/header-usuario.js" defer></script>
    <script src="assets/js/popup.js" defer></script>
    <script src="assets/js/turmas-professor-repositorio.js" defer></script>
    <script src="assets/js/unidade.js" defer></script>
    <script src="assets/js/turmas-professor-modais.js" defer></script>
    <script src="assets/js/turmas-professor-pagina.js" defer></script>
</head>
<body>
    <div id="header-usuario"></div>
    <main class="guia">
        <header class="guia-cabecalho">
            <h1>🏫 Turmas × Professores</h1>
            <p>Vincule professores (perfil PROFESSOR) às turmas — uso exclusivo do Professor Administrador</p>
        </header>

        <section class="guia-cartao guia-erro" id="tpBloqueio" hidden></section>

        <div id="tpConteudo" hidden>
            <section class="guia-cartao">
                <div class="tp-cabecalho-lista">
                    <h2>Turmas e professores</h2>
                    <label class="tp-campo tp-campo--filtro">Buscar
                        <input type="search" id="tpBusca" class="guia-filtro"
                            placeholder="Turma, unidade ou professor">
                    </label>
                </div>
                <p id="tpResumo" class="tp-resumo"></p>
                <div class="tp-tabela-rolagem">
                    <table class="guia-tabela">
                        <thead>
                            <tr>
                                <th>Vincular</th>
                                <th>Turma</th>
                                <th>Turno / horário</th>
                                <th>Professores vinculados</th>
                            </tr>
                        </thead>
                        <tbody id="tpLinhas"></tbody>
                    </table>
                </div>
            </section>
        </div>

        <div id="tpModalTurma" class="tp-modal" hidden>
            <form id="tpFormularioTurma" class="tp-modal__caixa" role="dialog" aria-modal="true"
                aria-labelledby="tpTituloTurma">
                <h2 id="tpTituloTurma">Vincular professor</h2>
                <h3 class="tp-modal__subtitulo">Professores desta turma</h3>
                <ul id="tpProfessoresTurma" class="tp-lista-professores"></ul>
                <label class="tp-campo">Professor (só quem ainda não está nesta turma)
                    <select id="tpNovoProfessor" class="guia-filtro"></select>
                </label>
                <div class="tp-acoes">
                    <button type="submit" class="guia-botao" id="tpVincular">Vincular</button>
                    <button type="button" class="guia-botao tp-botao-secundario" data-fechar-modal>Fechar</button>
                </div>
            </form>
        </div>

        <div id="tpModalVinculo" class="tp-modal" hidden>
            <form id="tpFormularioVinculo" class="tp-modal__caixa" role="dialog" aria-modal="true"
                aria-labelledby="tpTituloVinculo">
                <h2 id="tpTituloVinculo">Editar vínculo</h2>
                <label class="tp-campo">Turma
                    <select id="tpTurmaVinculo" class="guia-filtro" required></select>
                </label>
                <label class="tp-campo">Professor
                    <select id="tpProfessorVinculo" class="guia-filtro" required></select>
                </label>
                <div class="tp-acoes">
                    <button type="submit" class="guia-botao">Salvar alteração</button>
                    <button type="button" class="guia-botao tp-botao-secundario" data-fechar-modal>Cancelar</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
